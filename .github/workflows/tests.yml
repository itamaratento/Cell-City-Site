name: Testes automatizados

# Roda as suítes de teste do repositório a cada push/PR — até agora essas
# suítes só eram executadas manualmente (GUIA_MANUTENCAO.md registra como
# dívida técnica: "nenhuma CI executa os testes existentes"; PROXIMA_ETAPA.md
# item 10: "CI mínima"). Firestore Rules e Cloud Functions do Portal rodam
# 100% contra o emulador local do Firestore — nenhuma chamada sai para um
# projeto Firebase real, nenhuma credencial de produção é usada. Os testes
# de RBAC (tests/rbac/) não usam Firestore nem emulador — importam o código
# real das páginas via loader ESM (tests/rbac/loader.mjs) com só a borda do
# SDK mockada em memória (mesmo princípio da homologação da Camada
# Repository); substituem os harnesses ad-hoc descartados nos sprints
# anteriores (Sprint 2, Sprint 3, re-homologação de 2026-07-07 — ver
# CRM/TECHDOC.md §7.3). tests/kernel/ (Sprint 1 — Fase 1.3) testa o código
# real de CRM/scripts/kernel.js (boot, auth, tenant, sessão, permissões).
# tests/performance/ (padrão de gating polling/aba oculta, Fase 1 do plano
# de performance) não usa Firestore nem DOM real — só Node puro, mesmo
# princípio do RBAC.
#
# A homologação em navegador real (Fase 3 de scripts/homologacao/) NÃO roda
# aqui — exige credencial do DEV e Chrome real, fora do escopo de uma CI que
# roda em qualquer PR de qualquer colaborador. Continua manual, sob demanda
# (`npm run homologar-performance`).
#
# Não bloqueia merge (não há proteção de branch configurada), só dá
# visibilidade — mas já é melhor do que zero verificação automática.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Control Center (estrutura.test.mjs) lê git log/histórico real —
          # fetch-depth: 1 quebra testes de Central de IAs (Fase 5 no log).
          fetch-depth: 0

      # actions/checkout traz origin/main (com fetch-depth: 0), mas só cria
      # refs/heads/<branch-do-evento>. Comparar Branches usa o nome curto
      # "main" nos defaults develop↔main — sem refs/heads/main o teste falha
      # com "Branch 'main' não encontrada" (passa localmente se main existe).
      - name: Materializar branches main e develop locais (Control Center)
        run: |
          # Push na main não materializa refs/heads/develop (e vice-versa);
          # o Comparar Branches usa nomes curtos e exige as duas (D04).
          for b in main develop; do
            if ! git rev-parse --verify --quiet "refs/heads/$b" >/dev/null; then
              git branch --track "$b" "origin/$b"
            fi
          done

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Causa raiz da falha 100% da CI (runs 2026-07-14 a 17): emulador
      # Firestore/Storage e JAR Java. Sem JDK no runner, emulators:exec aborta.
      - name: Configurar Java 21 (emuladores Firebase)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Confirmar Java disponivel
        run: java -version

      - name: Instalar dependências (raiz — inclui firebase-tools)
        run: npm ci

      - name: Disponibilizar o CLI do Firebase no PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Instalar dependências (functions/)
        run: npm ci
        working-directory: functions

      - name: Instalar dependências (tests/firestore-rules/)
        run: npm ci
        working-directory: tests/firestore-rules

      - name: Testes de Firestore Rules
        run: npm test
        working-directory: tests/firestore-rules

      - name: Instalar dependencias (tests/storage-rules/)
        run: npm ci
        working-directory: tests/storage-rules

      - name: Testes de Storage Rules (isolamento A2 + paths canonicos)
        run: npm test
        working-directory: tests/storage-rules

      - name: Testes das Cloud Functions do Portal do Cliente
        run: firebase emulators:exec --config ../../firebase.json --only firestore --project cellcity-rules-test "node --test --test-concurrency=1"
        working-directory: tests/functions

      - name: Instalar dependências (tests/rbac/)
        run: npm ci
        working-directory: tests/rbac

      - name: Testes de RBAC (Fase 2 — CRM/Entrada/Chips/Agenda/Estoque/Caixa/Financeiro)
        run: npm test
        working-directory: tests/rbac

      - name: "Testes do Kernel (Sprint 1 — Fase 1.3 boot, autenticação, tenant, sessão)"
        run: npm test
        working-directory: tests/kernel

      - name: Testes de performance (padrão de gating polling/aba oculta)
        run: node --test tests/performance/polling-gating.test.mjs

      - name: Testes de integridade (imports/refs/coleções×rules — Observabilidade v1.1)
        run: node --test tests/integrity/integridade.test.mjs

      - name: Regressão de segurança Fase 2.2 (escHtml/CSPRNG/PIN/catálogo público)
        run: node --test tests/integrity/seguranca-fase22.test.mjs

      - name: Regressão de cota Firestore (limites hotspots) + BL-007 engines
        run: node --test tests/integrity/cota-limites.test.mjs

      - name: Testes de validação do onboarding SaaS (puros, sem Firestore)
        run: node --test tests/onboarding/saas-onboarding-validacao.test.mjs

      - name: Instalar dependências (tests/onboarding/)
        run: npm ci
        working-directory: tests/onboarding

      - name: Testes de UI do wizard de onboarding SaaS (jsdom — Sprint 3 Polish)
        run: node --test saas-onboarding-wizard.test.mjs
        working-directory: tests/onboarding

      - name: Validação de infraestrutura app-config
        run: npm run validar-infra-app-config

      - name: Catálogo de módulos (gerar + testar consistência)
        run: npm run gerar-catalogo && npm run testar-central-modulos

      - name: Testes E2E de estrutura básica (Puppeteer, Chrome headless)
        run: node --test tests/e2e/basic-structure.test.mjs

      - name: Testes do Control Center (estrutura, menus, dispatch — Fase 1)
        run: node --test tests/control-center/estrutura.test.mjs

      # Ausentes da CI até esta missão (achado: cobertura incompleta) —
      # ~10min de execução total (scripts shell reais via execSync, não
      # travamento — já confirmado em certificações anteriores), mas dão
      # cobertura a diagnóstico/manutenção/ferramentas do Control Center
      # que hoje só era verificada manualmente.
      - name: Testes do Control Center (diagnóstico, ferramentas, manutenção)
        run: |
          node --test tests/control-center/diagnostico.test.mjs
          node --test tests/control-center/ferramentas.test.mjs
          node --test tests/control-center/manutencao.test.mjs
