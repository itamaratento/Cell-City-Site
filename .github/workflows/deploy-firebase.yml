name: Deploy Firebase (rules + indexes + functions)

# Sprint 0 FASE 3 (2026-07-16): o job deployava no projeto de PRODUÇÃO
# (--project cellcity-crm) também em pushes de develop — o MESMO vetor do
# incidente P0 de 2026-07-14 (rules de develop quebraram main por ~2h28).
# Nunca chegou a disparar deploy real porque FIREBASE_SA_KEY nunca foi
# configurado (auth falha em todo run), mas o gate abaixo remove o vetor
# antes que o secret exista. Deploy de produção SÓ a partir de main.
on:
  push:
    branches: [main, develop]
    paths:
      - 'CRM/firestore.rules'
      - 'CRM/firestore.indexes.json'
      - 'firebase.json'
      - 'storage.rules'
      - 'functions/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # exigido pelo OIDC do Workload Identity Federation (D03)

jobs:
  deploy:
    # Produção só a partir de main (develop continua validado por tests.yml)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # D03 (Fase 3.9): Workload Identity Federation substitui o secret
      # FIREBASE_SA_KEY (nunca configurado; SA JSON eliminado por decisão).
      # O provider github-oidc só aceita tokens deste repo na ref main.
      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: cellcity-crm
          workload_identity_provider: projects/645609867368/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@cellcity-crm.iam.gserviceaccount.com

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project cellcity-crm --force

      - name: Deploy Firestore Indexes
        run: firebase deploy --only firestore:indexes --project cellcity-crm --force

      - name: Deploy Storage Rules
        # Fase 4.2 (2026-07-19): o projeto NÃO tem Firebase Storage
        # configurado (nenhum bucket vinculado — verificado via API
        # firebasestorage; criar o bucket exige plano Blaze, decisão do
        # dono). O `firebase deploy --only storage` falha nesse cenário e
        # derrubava o job inteiro, pulando o deploy das Cloud Functions.
        # Guard: só deploya storage.rules quando existir bucket vinculado;
        # quando o dono configurar o Storage, o passo volta a rodar sozinho.
        run: |
          BUCKETS=$(curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://firebasestorage.googleapis.com/v1beta/projects/cellcity-crm/buckets")
          COUNT=$(echo "$BUCKETS" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('buckets',[])))")
          if [ "$COUNT" = "0" ]; then
            echo "⚠️ Firebase Storage sem bucket vinculado — deploy de storage.rules PULADO."
            echo "   Para ativar: console Firebase > Storage > Get Started (exige Blaze)."
            exit 0
          fi
          firebase deploy --only storage --project cellcity-crm --force

      # Fase 4.3 (2026-07-19): o CLI carrega o código das functions no
      # runner para descobrir o que deployar — sem node_modules o run
      # 29693959000 falhou ("Couldn't find firebase-functions package").
      - name: Instalar dependências das Functions
        run: npm ci
        working-directory: functions

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project cellcity-crm --force

      - name: Validar deploy das Rules (via API)
        run: |
          echo "=== Verificando release ativo do Firestore ==="
          RELEASE=$(curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://firebaserules.googleapis.com/v1/projects/cellcity-crm/releases/cloud.firestore")
          RULESET_NAME=$(echo "$RELEASE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('rulesetName','N/A'))")
          echo "Ruleset ativo: $RULESET_NAME"
          if [ "$RULESET_NAME" = "N/A" ] || [ -z "$RULESET_NAME" ]; then
            echo "❌ Falha na validação — ruleset não encontrado"
            exit 1
          fi
          echo "✅ Firestore Rules deployadas e verificadas"
