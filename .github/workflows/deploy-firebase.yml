name: Deploy Firebase (rules + indexes + functions)

# Sprint 0 FASE 3 (2026-07-16): o job deployava no projeto de PRODUÇÃO
# (--project cellcity-crm) também em pushes de develop — o MESMO vetor do
# incidente P0 de 2026-07-14 (rules de develop quebraram main por ~2h28).
# Nunca chegou a disparar deploy real porque FIREBASE_SA_KEY nunca foi
# configurado (auth falha em todo run), mas o gate abaixo remove o vetor
# antes que o secret exista. Deploy de produção SÓ a partir de main.
on:
  push:
    branches: [main, develop]
    paths:
      - 'CRM/firestore.rules'
      - 'CRM/firestore.indexes.json'
      - 'firebase.json'
      - 'storage.rules'
      - 'functions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Produção só a partir de main (develop continua validado por tests.yml)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project cellcity-crm --force

      - name: Deploy Firestore Indexes
        run: firebase deploy --only firestore:indexes --project cellcity-crm --force

      - name: Deploy Storage Rules
        run: firebase deploy --only storage --project cellcity-crm --force

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project cellcity-crm --force

      - name: Validar deploy das Rules (via API)
        run: |
          echo "=== Verificando release ativo do Firestore ==="
          RELEASE=$(curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://firebaserules.googleapis.com/v1/projects/cellcity-crm/releases/cloud.firestore")
          RULESET_NAME=$(echo "$RELEASE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('rulesetName','N/A'))")
          echo "Ruleset ativo: $RULESET_NAME"
          if [ "$RULESET_NAME" = "N/A" ] || [ -z "$RULESET_NAME" ]; then
            echo "❌ Falha na validação — ruleset não encontrado"
            exit 1
          fi
          echo "✅ Firestore Rules deployadas e verificadas"
