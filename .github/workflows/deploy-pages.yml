name: Deploy Pages (main + develop)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (produção)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout develop (desenvolvimento)
        uses: actions/checkout@v4
        with:
          ref: develop
          path: site-develop

      - name: Montar estrutura publicada (main na raiz, develop em /dev)
        # HARDENING (auditoria 2026-07-06, plans/AUDITORIA_GERAL_20260706.md):
        # plans/, CLAUDE.md e CRM/pages/kernel-test/ eram publicados ao vivo
        # sem intenção — são documentação interna (metodologia de auditoria,
        # regras permanentes de desenvolvimento) e uma página de teste
        # administrativa, não parte do produto. Exclusão é só do artefato de
        # deploy — não altera nenhum arquivo do repositório nem comportamento
        # da aplicação.
        #
        # FECHAMENTO v2026.07.10: _BACKUPS/ (2.263 arquivos rastreados,
        # snapshots internos com rules antigas) e backups avulsos da raiz
        # (BACKUP_POSVENDA_*, firestore.rules.backup*, firebase.json.bak*)
        # também eram publicados — apontado nas auditorias de 2026-07-03
        # e nunca mitigado. Mesma técnica: exclusão só do artefato.
        run: |
          mkdir -p _site
          rsync -a --exclude='/.git' --exclude='/.github' \
            --exclude='/plans/' --exclude='/CLAUDE.md' --exclude='CRM/pages/kernel-test/' \
            --exclude='/_BACKUPS/' --exclude='/_runtime_audit/' --exclude='/sql/' --exclude='/pages/' --exclude='/scripts/' --exclude='/sistema/' \
            --exclude='/BACKUP_POSVENDA_SAAS_FIX_2026-06-26/' \
            --exclude='firestore.rules.backup*' --exclude='firebase.json.bak*' \
            site-main/ _site/
          mkdir -p _site/dev
          rsync -a --exclude='/.git' --exclude='/.github' \
            --exclude='/plans/' --exclude='/CLAUDE.md' --exclude='CRM/pages/kernel-test/' \
            --exclude='/_BACKUPS/' --exclude='/_runtime_audit/' --exclude='/sql/' --exclude='/pages/' --exclude='/scripts/' --exclude='/sistema/' \
            --exclude='/BACKUP_POSVENDA_SAAS_FIX_2026-06-26/' \
            --exclude='firestore.rules.backup*' --exclude='firebase.json.bak*' \
            site-develop/ _site/dev/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
