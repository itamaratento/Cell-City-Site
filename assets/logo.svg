<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" role="img" aria-label="Cell City Informática — Gestão Empresarial">
  <defs>
    <!-- Verde Cell City — legível sobre fundo escuro -->
    <linearGradient id="cc-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a0f8d0"/>
      <stop offset="45%"  stop-color="#00c853"/>
      <stop offset="100%" stop-color="#009640"/>
    </linearGradient>
    <!-- Dourado institucional -->
    <linearGradient id="cc-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5da6a"/>
      <stop offset="100%" stop-color="#c09020"/>
    </linearGradient>
    <!-- Gradiente para linha decorativa (fade nas extremidades) -->
    <linearGradient id="cc-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(0,200,83,0)"/>
      <stop offset="18%"  stop-color="rgba(0,200,83,0.50)"/>
      <stop offset="82%"  stop-color="rgba(0,200,83,0.50)"/>
      <stop offset="100%" stop-color="rgba(0,200,83,0)"/>
    </linearGradient>
    <!-- Glow premium para CELL CITY -->
    <filter id="cc-glow" x="-8%" y="-20%" width="116%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════
       CELL CITY — elemento dominante (-12% vs anterior)
       ══════════════════════════════════════════ -->
  <text x="180" y="40"
    text-anchor="middle"
    font-family="'Arial Black','Helvetica Neue',Impact,sans-serif"
    font-size="35"
    font-weight="900"
    letter-spacing="5"
    fill="url(#cc-green)"
    filter="url(#cc-glow)"
    text-rendering="optimizeLegibility">CELL CITY</text>

  <!-- Linha decorativa — mais ampla para cobrir a largura do texto -->
  <line x1="22" y1="50" x2="338" y2="50"
        stroke="url(#cc-line)" stroke-width="0.8"/>

  <!-- ══════════════════════════════════════════
       INFORMÁTICA — maior presença visual
       ══════════════════════════════════════════ -->
  <text x="180" y="68"
    text-anchor="middle"
    font-family="'Segoe UI','Arial',Helvetica,sans-serif"
    font-size="20"
    font-weight="400"
    letter-spacing="11"
    fill="#c8e8d8"
    text-rendering="optimizeLegibility">INFORMÁTICA</text>

  <!-- ══════════════════════════════════════════
       GESTÃO EMPRESARIAL — mais visível
       ══════════════════════════════════════════ -->
  <text x="180" y="96"
    text-anchor="middle"
    font-family="'Segoe UI','Arial',Helvetica,sans-serif"
    font-size="25"
    font-weight="700"
    letter-spacing="3.5"
    fill="url(#cc-gold)"
    text-rendering="optimizeLegibility">GESTÃO EMPRESARIAL</text>
</svg>
