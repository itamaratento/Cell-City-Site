<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Autoatendimento...</title>
    <script>
        // Redirecionamento automático para a página de Autoatendimento do CRM
        // Esta página atua como um intermediário que oculta o caminho interno do CRM

        // Espera um pequeno delay para garantir que o redirecionamento seja suave
        window.addEventListener('load', function() {
            // Redireciona para a página interna do CRM
            window.location.href = '/CRM/public/abrir-atendimento.html';
        });

        // Fallback em caso de erro (já começa a redirecionar imediatamente)
        window.location.href = '/CRM/public/abrir-atendimento.html';
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #00C853 0%, #00A040 100%);
        }
        .container {
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            margin: 10px 0 0;
            font-size: 14px;
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>📱 Abrindo Autoatendimento</h1>
        <p>Por favor, aguarde...</p>
    </div>
</body>
</html>
