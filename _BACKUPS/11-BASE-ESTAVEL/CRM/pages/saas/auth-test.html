<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Test — Cell City</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #050a10; color: #e8edf5; font-family: monospace; padding: 24px; }
    .card { background: #0d1117; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 16px; font-weight: 800; color: #f59e0b; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; background: #141618; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #e8edf5; font-size: 14px; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; background: #00C853; color: #000; border: none; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; margin-bottom: 16px; }
    #log { background: #141618; border-radius: 8px; padding: 16px; font-size: 12px; line-height: 2; min-height: 200px; white-space: pre-wrap; }
    .ok  { color: #00e676; }
    .err { color: #ef4444; }
    .inf { color: #9aa5b8; }
    .warn { color: #f59e0b; }
  </style>
</head>
<body>
<div class="card">
  <h1>🔐 Auth Test — Diagnóstico Isolado</h1>
  <input id="email" type="email" placeholder="E-mail" value="itamaratento@gmail.com">
  <input id="senha" type="password" placeholder="Senha" value="CellCity@2026">
  <button onclick="testar()">▶ Testar Login</button>
  <div id="log"><span class="inf">Aguardando...</span></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {
  initializeAuth,
  indexedDBLocalPersistence,
  browserLocalPersistence,
  inMemoryPersistence,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import {
  getFirestore, doc, getDoc
} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:    'AIzaSyD5wQRvcVdweOhVqwd8e08JuzRXOESEbqE',
  authDomain:'cellcity-crm.firebaseapp.com',
  projectId: 'cellcity-crm',
}, 'auth-test');

const auth = initializeAuth(app, {
  persistence: [indexedDBLocalPersistence, browserLocalPersistence, inMemoryPersistence]
});
const db = getFirestore(app);

const logEl = document.getElementById('log');
function log(msg, cls = 'inf') {
  logEl.innerHTML += `<span class="${cls}">${msg}</span>\n`;
}
logEl.innerHTML = '';

log('Firebase inicializado (sem iframe cross-origin)', 'ok');

onAuthStateChanged(auth, user => {
  if (user) log(`onAuthStateChanged: logado — uid: ${user.uid}`, 'ok');
  else log('onAuthStateChanged: não logado', 'inf');
});

window.testar = async function() {
  logEl.innerHTML = '';
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value.trim();

  // Etapa 1: Login
  log('1. signInWithEmailAndPassword...', 'inf');
  try {
    const cred = await signInWithEmailAndPassword(auth, email, senha);
    const u = cred.user;
    log(`✅ Login OK`, 'ok');
    log(`   uid: ${u.uid}`, 'ok');
    log(`   email: ${u.email}`, 'ok');
    log(`   emailVerified: ${u.emailVerified}`, 'ok');

    // Etapa 2: Ler usuarios/{uid}
    log('\n2. Lendo usuarios/' + u.uid + '...', 'inf');
    const snap = await getDoc(doc(db, 'usuarios', u.uid));
    if (snap.exists()) {
      const d = snap.data();
      log(`✅ Documento encontrado`, 'ok');
      log(`   empresa_id: ${d.empresa_id}`, 'ok');
      log(`   perfil: ${d.perfil}`, 'ok');
      log(`   ativo: ${d.ativo}`, 'ok');

      // Etapa 3: getEmpresaId simulado
      log('\n3. getEmpresaId() → ' + d.empresa_id, 'ok');

      // Etapa 4: isMasterAdmin simulado
      const isMaster = d.perfil === 'master_admin';
      log('4. isMasterAdmin() → ' + isMaster, isMaster ? 'ok' : 'err');

      if (isMaster) {
        log('\n✅ TUDO OK! Acesse agora:', 'ok');
        log('   http://localhost:5001/CRM/pages/saas/index.html', 'warn');
      }
    } else {
      log(`❌ Documento usuarios/${u.uid} NÃO encontrado`, 'err');
    }
  } catch (e) {
    log(`❌ ERRO: ${e.code} — ${e.message}`, 'err');
  }
};
</script>
</body>
</html>
