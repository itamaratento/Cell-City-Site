<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limpando cache da OS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f5f7fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box {
      width: min(420px, calc(100vw - 32px));
      padding: 22px;
      border: 1px solid rgba(0, 200, 83, 0.25);
      border-radius: 12px;
      background: rgba(20, 22, 21, 0.8);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      color: #00e676;
      font-size: 20px;
    }
    p {
      margin: 0;
      color: #a1a8b3;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Atualizando O.S.</h1>
    <p>Limpando cache local e abrindo a versão nova...</p>
  </div>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
      } catch (e) {
        console.warn('Falha ao limpar cache da OS:', e);
      } finally {
        window.location.replace('/CRM/pages/os/index.html?v=20260611-os-header-v3');
      }
    })();
  </script>
</body>
</html>
