<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contas</title>
    <link rel="stylesheet" href="pendencias.css">
    <link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>
    <header class="pend-header" id="mainHeader">
        <h1>📋 Pendências e Contas</h1>
    </header>

    <!-- TOTAIS -->
    <div class="pend-totais" id="pend-totais">
        <div class="pend-total pend-total--receber">
            <span class="pend-total-icon">💵</span>
            <div class="pend-total-info">
                <span class="pend-total-label">A Receber</span>
                <span class="pend-total-valor" id="total-receber">R$ 0,00</span>
            </div>
        </div>
        <div class="pend-total pend-total--pagar">
            <span class="pend-total-icon">💸</span>
            <div class="pend-total-info">
                <span class="pend-total-label">A Pagar</span>
                <span class="pend-total-valor" id="total-pagar">R$ 0,00</span>
            </div>
        </div>
        <div class="pend-total pend-total--emprestimo">
            <span class="pend-total-icon">📦</span>
            <div class="pend-total-info">
                <span class="pend-total-label">Empréstimos</span>
                <span class="pend-total-valor" id="total-emprestimos">0</span>
            </div>
        </div>
    </div>

    <main>
        <div class="pend-content">

            <!-- ABAS -->
            <div class="pend-tabs">
                <button class="pend-tab active" data-tab="todos">⚪ Todos</button>
                <button class="pend-tab" data-tab="cliente_devendo">🟢 Clientes Devendo</button>
                <button class="pend-tab" data-tab="colega_parceiro">🔵 Colegas / Parceiros</button>
                <button class="pend-tab" data-tab="eu_devo">🔴 Eu Devo</button>
            </div>

            <!-- BUSCA -->
            <div class="pend-busca-wrap">
                <input type="search" id="pend-busca" class="pend-busca-input" placeholder="🔍 Buscar por nome ou descrição...">
            </div>

            <!-- TOOLBAR -->
            <div class="pend-toolbar">
                <button class="pend-btn-nova" id="btn-nova-pend">＋ Adicionar</button>
                <label class="pend-toggle-resolvidos">
                    <input type="checkbox" id="chk-resolvidos"> Ver resolvidos
                </label>
            </div>

            <!-- FORMULÁRIO -->
            <div class="pend-form" id="pend-form" style="display:none">
                <div class="pend-form-titulo" id="pend-form-titulo">Nova Pendência</div>
                <div class="pend-form-grid">
                    <div class="pend-form-group pend-span2">
                        <label>Nome *</label>
                        <input type="text" id="pf-nome" placeholder="Ex: Cliente Carreca, Henrique, Mendes..." maxlength="80">
                    </div>
                    <div class="pend-form-group">
                        <label>Tipo *</label>
                        <select id="pf-tipo">
                            <option value="cliente_devendo">🟢 Cliente Devendo</option>
                            <option value="colega_parceiro">🔵 Colega / Parceiro</option>
                            <option value="eu_devo">🔴 Eu Devo</option>
                            <option value="emprestimo">🟡 Empréstimo</option>
                        </select>
                    </div>
                    <div class="pend-form-group">
                        <label id="pf-valor-label">Valor (R$)</label>
                        <input type="number" id="pf-valor" placeholder="0,00" min="0" step="0.01">
                    </div>
                    <div class="pend-form-group pend-span2">
                        <label>Descrição / Item</label>
                        <input type="text" id="pf-descricao" placeholder="Ex: Teclado Virtual, Película, Cabo Tipo C - 3 unidades..." maxlength="200">
                    </div>
                    <div class="pend-form-group">
                        <label>Quantidade</label>
                        <input type="number" id="pf-quantidade" placeholder="Ex: 3" min="1" step="1">
                    </div>
                    <div class="pend-form-group">
                        <label>Data</label>
                        <input type="date" id="pf-data">
                    </div>
                    <div class="pend-form-group">
                        <label>Telefone (WhatsApp)</label>
                        <input type="tel" id="pf-telefone" placeholder="(11) 9 9999-0000" maxlength="20">
                    </div>
                    <div class="pend-form-group pend-span2" style="display:none" id="pf-status-group">
                        <label>Status</label>
                        <select id="pf-status">
                            <option value="aberto">🟡 Aberto</option>
                            <option value="resolvido">✅ Resolvido</option>
                        </select>
                    </div>
                </div>
                <div class="pend-form-btns">
                    <button class="pend-btn-salvar" id="pf-salvar">Salvar</button>
                    <button class="pend-btn-cancelar" id="pf-cancelar">Cancelar</button>
                </div>
            </div>

            <!-- LISTA -->
            <div class="pend-loading" id="pend-loading">
                <div class="pend-spinner"></div><span>Carregando...</span>
            </div>
            <div id="pend-lista"></div>
            <div class="pend-empty" id="pend-empty" style="display:none">
                <div class="pend-empty-icon">✅</div>
                <div class="pend-empty-title">Tudo em dia!</div>
                <div class="pend-empty-sub">Nenhuma pendência nesta categoria.</div>
            </div>

        </div>
    </main>

    <div class="pend-toast" id="pend-toast"></div>

    <script src="../../shared/brand-header.js"></script>
<script type="module" src="../../shared/sidebar.js"></script>
    <script type="module" src="pendencias.js"></script>
    <script type="module" src="../../shared/dock.js"></script>
</body>
</html>
