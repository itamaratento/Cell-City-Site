<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pós-venda</title>
    <link rel="stylesheet" href="posvenda.css">
<link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>

    <header class="header" id="mainHeader">
        <div class="header-spacer"></div>
        <h1 id="headerTitle">Pós-venda</h1>
        <button class="pv-config-btn" onclick="abrirConfiguracoes()" title="Configurações">⚙️</button>
    </header>

    <main>
        <div class="pv-content">

            <!-- BUSCA NO TOPO -->
            <div class="pv-search" id="pv-hist-search">
                <span class="pv-search-icon">🔍</span>
                <input type="text" id="hist-search" placeholder="Buscar cliente, OS, aparelho..." oninput="filterHistorico()">
            </div>

            <!-- RESUMO DO DIA -->
            <div class="pv-summary">
                <div class="pv-sum-item" id="sum-5">
                    <span class="pv-sum-num" id="count-5">—</span>
                    <span class="pv-sum-label">5 dias</span>
                </div>
                <div class="pv-sum-divider"></div>
                <div class="pv-sum-item" id="sum-15">
                    <span class="pv-sum-num" id="count-15">—</span>
                    <span class="pv-sum-label">15 dias</span>
                </div>
                <div class="pv-sum-divider"></div>
                <div class="pv-sum-item" id="sum-30">
                    <span class="pv-sum-num" id="count-30">—</span>
                    <span class="pv-sum-label">30 dias</span>
                </div>
            </div>

            <!-- TABS -->
            <div class="pv-tabs">
                <button class="pv-tab active" id="tab-pendentes" onclick="showTab('pendentes')">
                    Pendentes
                    <span class="pv-tab-badge" id="tab-badge" style="display:none">0</span>
                </button>
                <button class="pv-tab" id="tab-historico" onclick="showTab('historico')">
                    Histórico
                </button>
            </div>

            <!-- ABA PENDENTES -->
            <div id="screen-pendentes" class="pv-screen active">
                <div id="pendentes-container">
                    <div class="empty-state">
                        <div class="icon">⏳</div>
                        <p>Carregando...</p>
                    </div>
                </div>
            </div>

            <!-- ABA HISTÓRICO -->
            <div id="screen-historico" class="pv-screen">
                <div id="historico-container">
                    <div class="empty-state">
                        <div class="icon">📋</div>
                        <p>Carregando histórico...</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- MODAL DE CONFIGURAÇÕES -->
        <div class="pv-config-overlay" id="configOverlay" onclick="fecharConfiguracoes(event)"></div>
        <div class="pv-config-modal" id="configModal">
            <div class="pv-config-header">
                <h2>Configurações - Mensagens Pós-venda</h2>
                <button class="pv-config-close" onclick="fecharConfiguracoes()">✕</button>
            </div>
            <div class="pv-config-body">
                <div class="pv-config-field">
                    <label for="msg-5">📋 Mensagem - 5 dias</label>
                    <textarea id="msg-5" placeholder="Digite a mensagem para 5 dias..." maxlength="500"></textarea>
                    <span class="pv-char-count"><span id="count-5-chars">0</span>/500</span>
                </div>
                <div class="pv-config-field">
                    <label for="msg-15">📋 Mensagem - 15 dias</label>
                    <textarea id="msg-15" placeholder="Digite a mensagem para 15 dias..." maxlength="500"></textarea>
                    <span class="pv-char-count"><span id="count-15-chars">0</span>/500</span>
                </div>
                <div class="pv-config-field">
                    <label for="msg-30">📋 Mensagem - 30 dias</label>
                    <textarea id="msg-30" placeholder="Digite a mensagem para 30 dias..." maxlength="500"></textarea>
                    <span class="pv-char-count"><span id="count-30-chars">0</span>/500</span>
                </div>
            </div>
            <div class="pv-config-footer">
                <button class="pv-config-btn-cancel" onclick="fecharConfiguracoes()">Cancelar</button>
                <button class="pv-config-btn-save" onclick="salvarConfiguracoes()">Salvar Alterações</button>
            </div>
        </div>
    </main>

    <div class="pv-toast" id="toast"></div>

    <script src="../../shared/brand-header.js"></script>
<script type="module" src="../../shared/sidebar.js"></script>
    <script type="module" src="posvenda.js"></script>
    <script>
    window.addEventListener('load', function() {
        if (window.innerWidth <= 768) {
            var bar = document.getElementById('crm-brand-bar');
            var title = bar && bar.querySelector('.crm-page-title');
            if (bar && title) {
                bar.style.flexWrap = 'wrap';
                bar.style.paddingBottom = '10px';
                title.style.cssText = 'position:static !important; flex:1 1 100% !important; text-align:center !important; font-size:16px !important; font-weight:800 !important; margin-top:4px !important; left:auto !important; right:auto !important;';
            }
        }
    });
    </script>
<script type="module" src="../../shared/dock.js"></script>
<script src="../../shared/obs-expand.js?v=20260612-1"></script>
</body>
</html>
