<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
<title>Cell City Gestão Empresarial</title>
<link rel="stylesheet" href="entrada.css">
</head>
<body>

<header class="ent-header">
  <button class="ent-back" type="button" onclick="voltarCRM()">← CRM</button>
  <span class="ent-header-title">👤 Novo Cliente</span>
  <div class="ent-header-spacer"></div>
</header>

<main class="ent-main">
<form id="ent-form" onsubmit="submitEntrada(event)" autocomplete="off" novalidate>

  <!-- TELEFONE — identificador principal -->
  <div class="ent-field">
    <label class="ent-label" for="ent-tel">📞 Telefone *</label>
    <input type="tel" id="ent-tel" class="ent-input"
           placeholder="(62) 99999-9999"
           inputmode="tel"
           oninput="onTelInput(this.value)">
    <div id="ent-lookup-banner" style="display:none" class="ent-lookup"></div>
  </div>

  <!-- NOME -->
  <div class="ent-field">
    <label class="ent-label" for="ent-nome">👤 Nome *</label>
    <input type="text" id="ent-nome" class="ent-input"
           placeholder="Nome completo do cliente">
  </div>

  <!-- APARELHO -->
  <div class="ent-field">
    <label class="ent-label" for="ent-aparelho">📱 Aparelho</label>
    <input type="text" id="ent-aparelho" class="ent-input"
           placeholder="Ex: Samsung Galaxy A54, iPhone 14...">
  </div>

  <!-- SERVIÇO -->
  <div class="ent-field">
    <label class="ent-label" for="ent-servico">🔧 Serviço</label>
    <input type="text" id="ent-servico" class="ent-input"
           placeholder="Ex: Troca de tela, sem carregar...">
  </div>

  <!-- TIPO DE BLOQUEIO -->
  <div class="ent-field">
    <label class="ent-label" for="ent-lock">🔒 Tipo de bloqueio</label>
    <select id="ent-lock" class="ent-input ent-select" onchange="onLockChange()">
      <option value="">Sem bloqueio</option>
      <option value="Numerica">PIN / Numérica</option>
      <option value="Padrao">Padrão (desenho)</option>
      <option value="Biometria">Biometria / Face ID</option>
    </select>
  </div>

  <!-- SENHA — aparece para PIN/Numérica -->
  <div class="ent-field" id="ent-senha-wrap" style="display:none">
    <label class="ent-label" for="ent-senha">🔑 Senha / PIN</label>
    <input type="text" id="ent-senha" class="ent-input"
           placeholder="Digite o PIN ou senha" inputmode="numeric">
  </div>

  <!-- PADRÃO ANDROID — aparece para Padrão -->
  <div class="ent-field" id="ent-padrao-wrap" style="display:none">
    <button type="button" class="ent-btn-pattern" onclick="openEntradaPattern()">
      📱 Registrar Padrão Android
    </button>
    <div id="ent-padrao-summary" style="display:none" class="ent-padrao-ok"></div>
  </div>

  <!-- MAIS INFORMAÇÕES (recolhido) -->
  <div class="ent-mais-wrap">
    <button type="button" class="ent-mais-toggle" id="ent-mais-btn" onclick="toggleMais()">
      ＋ Mais informações
    </button>
    <div id="ent-mais-content" style="display:none">
      <div class="ent-field">
        <label class="ent-label" for="ent-obs">💬 Observações</label>
        <textarea id="ent-obs" class="ent-input ent-textarea" rows="3"
                  placeholder="Detalhes adicionais sobre o aparelho ou serviço..."></textarea>
      </div>
      <div class="ent-field">
        <label class="ent-label" for="ent-valor">💰 Valor estimado (R$)</label>
        <input type="number" id="ent-valor" class="ent-input"
               placeholder="0,00" min="0" step="0.01" inputmode="decimal">
      </div>
    </div>
  </div>

  <!-- STATUS / DESTINO -->
  <div class="ent-status-section">
    <div class="ent-status-lbl">Destino</div>
    <div class="ent-chips" id="ent-chips"></div>
  </div>

  <!-- BOTÃO SUBMIT -->
  <div class="ent-actions">
    <button type="submit" class="ent-btn-submit" id="ent-btn-submit">Salvar Lead</button>
  </div>

</form>
</main>

<!-- Modal Padrão Android -->
<div class="ent-overlay" id="ent-pattern-overlay" onclick="closeEntradaPattern(event)">
  <div class="ent-pattern-modal">
    <div id="ent-pattern-draw-container">
      <h3 class="ent-pattern-title">📱 Registrar Padrão Android</h3>
      <p class="ent-pattern-hint">Arraste para conectar os pontos na ordem do padrão</p>
      <canvas id="ent-pattern-canvas" width="300" height="300" class="ent-pattern-canvas"></canvas>
      <div class="ent-pattern-btns">
        <button type="button" class="ent-pattern-btn-sec" onclick="clearEntradaPattern()">🗑️ Limpar</button>
        <button type="button" class="ent-pattern-btn-pri" onclick="saveEntradaPattern()">💾 Salvar</button>
      </div>
      <button type="button" class="ent-pattern-btn-cancel" onclick="closeEntradaPattern()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="ent-toast" id="ent-toast"></div>

<script type="module" src="entrada.js"></script>
</body>
</html>
