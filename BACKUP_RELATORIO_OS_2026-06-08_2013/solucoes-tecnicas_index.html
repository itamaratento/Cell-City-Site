<!DOCTYPE html>
<html lang="pt-BR" data-fav-key="pt-casos-bancada" data-fav-label="Casos da Bancada" data-fav-icon="🔧">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soluções Técnicas - Portal Técnico</title>
    <link rel="stylesheet" href="../portal-tecnico.css">
    <link rel="stylesheet" href="solucoes-tecnicas.css">
    <link rel="stylesheet" href="../../../shared/dock.css">
</head>
<body>
    <header class="header">
        <a class="cb-back" href="../index.html" title="Voltar ao Portal Técnico">‹ Portal Técnico</a>
        <span class="header-title">📖 Soluções Técnicas</span>
        <span class="cb-header-spacer"></span>
    </header>

    <div class="pt-screen">
        <!-- BUSCA (logo abaixo do título, para ganhar espaço útil) -->
        <div class="pt-search" role="search">
            <span class="pt-search-icon">🔍</span>
            <input type="text" id="cb-busca" placeholder="Pesquisar: chip, A15, oxidação, não liga..." oninput="cbBuscar()" autocomplete="off" aria-label="Pesquisar casos da bancada">
        </div>
        <div id="cb-view"></div>
    </div>

    <!-- MODAL: CABEÇALHO DO CASO (criar / editar) -->
    <div class="cb-modal-overlay" id="cb-modal" aria-hidden="true">
        <div class="cb-modal">
            <div class="cb-modal-head">
                <span id="cb-modal-title">➕ Novo Caso</span>
                <button class="cb-modal-close" onclick="cbFecharForm()" aria-label="Fechar">✕</button>
            </div>
            <div class="cb-modal-body">
                <input type="hidden" id="f-id">
                <div class="cb-fg"><label>Defeito / Título do caso *</label><input type="text" id="f-defeito" placeholder="Ex: Não reconhece chip"></div>
                <div class="cb-fg-row">
                    <div class="cb-fg"><label>Marca</label><input type="text" id="f-marca" placeholder="Ex: Samsung"></div>
                    <div class="cb-fg"><label>Modelo</label><input type="text" id="f-modelo" placeholder="Ex: A15"></div>
                </div>
                <div class="cb-fg"><label>Cliente</label><input type="text" id="f-cliente" placeholder="Ex: João Silva"></div>
                <div class="cb-fg-row">
                    <div class="cb-fg"><label>Data</label><input type="date" id="f-data"></div>
                    <div class="cb-fg"><label>Status</label><select id="f-status">
                        <option value="Resolvido">✅ Resolvido</option>
                        <option value="Não resolvido">❌ Não resolvido</option>
                    </select></div>
                </div>
            </div>
            <div class="cb-modal-foot">
                <button class="cb-btn-cancel" onclick="cbFecharForm()">Cancelar</button>
                <button class="cb-btn-save" onclick="cbSalvar()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <div class="cb-toast" id="cb-toast"></div>

    <script src="../../../shared/brand-header.js"></script>
    <script type="module" src="../../../shared/dock.js"></script>
    <script>
    (function () {
        'use strict';

        var STORAGE_KEY = 'cc_pt_casos_bancada';

        function hojeBR() { return new Date().toLocaleDateString('pt-BR'); }
        function hojeISO() { return new Date().toISOString().slice(0, 10); }
        function isoParaBR(iso) {
            if (!iso) return '';
            var p = iso.split('-');
            if (p.length !== 3) return iso;
            return p[2] + '/' + p[1] + '/' + p[0];
        }

        var SEED = [
            {
                id: 'cb1',
                cliente: 'João Silva',
                marca: 'Samsung',
                modelo: 'A15',
                defeito: 'Não reconhece chip',
                resultado: 'Resolvido',
                data: '2026-06-08',
                relatorio: 'Hoje recebi o aparelho.\nFoi identificado problema no setor de chip.\nRealizada limpeza.\nTestado novamente.\nPersistiu defeito.\nRealizada ressolda.\nAparelho voltou a reconhecer o chip.\nCliente avisado.\nServiço concluído.'
            }
        ];

        var view, busca, toast, modal;
        var state = { termo: '' };
        var autoTimer = null;

        // ===== Migração: registros antigos (procedimentos/obs) viram "relatorio" =====
        function migrar(c) {
            if (typeof c.relatorio === 'undefined') {
                var partes = [];
                if (c.procedimentos) partes.push(c.procedimentos);
                if (c.obs) partes.push('Observações: ' + c.obs);
                c.relatorio = partes.join('\n\n');
            }
            return c;
        }

        function load() {
            var list;
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) { var a = JSON.parse(raw); if (Array.isArray(a)) list = a; }
            } catch (e) {}
            if (!list) { save(SEED); return SEED.slice(); }
            return list.map(migrar);
        }
        function save(list) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {} }

        function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }
        function toastMsg(m) { if (!toast) return; toast.textContent = m; toast.classList.add('show'); clearTimeout(window.__cb); window.__cb = setTimeout(function () { toast.classList.remove('show'); }, 2500); }

        function resultadoCls(r) {
            var t = (r || '').toLowerCase();
            if (t.indexOf('não resolv') >= 0 || t.indexOf('nao resolv') >= 0) return 'cb-res-err';
            if (t.indexOf('resolv') >= 0 || t.indexOf('conclu') >= 0) return 'cb-res-ok';
            if (t.indexOf('andamento') >= 0 || t.indexOf('aguard') >= 0 || t.indexOf('parcial') >= 0) return 'cb-res-warn';
            return 'cb-res-neutral';
        }

        function filtrados() {
            var list = load();
            var t = (state.termo || '').toLowerCase();
            var arr = list.slice().sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
            if (!t) return arr;
            return arr.filter(function (x) {
                var blob = [x.cliente, x.marca, x.modelo, x.defeito, x.resultado, x.relatorio].join(' ').toLowerCase();
                return blob.indexOf(t) >= 0;
            });
        }

        // ===== HOME (lista) =====
        function renderHome() {
            var total = load().length;
            var itens = filtrados();
            var lista = itens.length
                ? itens.map(itemHTML).join('')
                : '<div class="cb-empty">' + (state.termo ? 'Nenhum caso encontrado para "' + esc(state.termo) + '".' : 'Nenhum caso registrado ainda. Clique em "➕ Novo Caso" para começar.') + '</div>';
            view.innerHTML =
                '<div class="cb-toolbar">'
                + '<span class="cb-count">🔧 Casos da Bancada • ' + (state.termo ? itens.length + ' de ' + total : total + ' registro' + (total === 1 ? '' : 's')) + '</span>'
                + '<button class="cb-novo-btn" onclick="cbNovo()">➕ Novo Caso</button>'
                + '</div>'
                + '<div class="cb-list">' + lista + '</div>';
        }

        function itemHTML(c) {
            var aparelho = [c.marca, c.modelo].filter(Boolean).join(' ') || '—';
            var res = c.resultado ? '<span class="cb-res ' + resultadoCls(c.resultado) + '">' + esc(c.resultado) + '</span>' : '';
            return '<button class="cb-list-item" onclick="cbAbrir(\'' + c.id + '\')">'
                + '<div class="cb-li-main">'
                + '<div class="cb-li-titulo">' + esc(c.defeito || '(sem título)') + '</div>'
                + '<div class="cb-li-meta">📱 ' + esc(aparelho) + (c.cliente ? ' • 👤 ' + esc(c.cliente) : '') + (c.data ? ' • 📅 ' + esc(isoParaBR(c.data)) : '') + '</div>'
                + (res ? '<div class="cb-li-tagrow">' + res + '</div>' : '')
                + '</div><span class="cb-li-chevron">›</span></button>';
        }

        // ===== DETALHE (diário técnico) =====
        function renderDetail(id) {
            var c = load().find(function (x) { return x.id === id; });
            if (!c) { renderHome(); return; }
            var aparelho = [c.marca, c.modelo].filter(Boolean).join(' ') || '—';

            var html = '<div class="cb-back-row">'
                + '<button class="cb-voltar" onclick="cbHome()">‹ Voltar</button>'
                + '<span class="cb-detail-actions"><button class="cb-mini-btn" onclick="cbEditar(\'' + c.id + '\')">✏️ Editar cabeçalho</button><button class="cb-mini-btn cb-mini-del" onclick="cbExcluir(\'' + c.id + '\')">🗑️</button></span>'
                + '</div>'
                + '<div class="cb-detail">'
                + '<h2 class="cb-detail-title">🔧 ' + esc(c.defeito || '(sem título)') + '</h2>'
                + '<div class="cb-badges">'
                + '<span class="cb-badge">📱 ' + esc(aparelho) + '</span>'
                + (c.cliente ? '<span class="cb-badge">👤 ' + esc(c.cliente) + '</span>' : '')
                + (c.data ? '<span class="cb-badge">📅 ' + esc(isoParaBR(c.data)) + '</span>' : '')
                + (c.resultado ? '<span class="cb-res ' + resultadoCls(c.resultado) + '">' + esc(c.resultado) + '</span>' : '')
                + '</div>'
                + '<div class="cb-relatorio-head">'
                + '<span class="cb-sec-title">📝 Relatório Técnico</span>'
                + '<span class="cb-autosave" id="cb-autosave">salvamento automático</span>'
                + '</div>'
                + '<textarea id="cb-relatorio" class="cb-relatorio" placeholder="Escreva aqui tudo o que foi feito neste aparelho, como um diário da bancada...&#10;&#10;Ex:&#10;Hoje recebi o aparelho.&#10;Identificado problema no setor de chip.&#10;Realizada limpeza e teste...">' + esc(c.relatorio || '') + '</textarea>'
                + '</div>';

            view.innerHTML = html;

            var ta = document.getElementById('cb-relatorio');
            ta.addEventListener('input', function () { agendarAutosave(c.id, ta.value); });
            // foco ao final do texto para continuar escrevendo
            ta.focus();
            try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== Autosave do relatório =====
        function agendarAutosave(id, texto) {
            var ind = document.getElementById('cb-autosave');
            if (ind) { ind.textContent = 'salvando…'; ind.className = 'cb-autosave saving'; }
            clearTimeout(autoTimer);
            autoTimer = setTimeout(function () {
                var list = load();
                var i = list.findIndex(function (x) { return x.id === id; });
                if (i >= 0) {
                    list[i].relatorio = texto;
                    list[i].ultimaAtualizacao = hojeBR();
                    save(list);
                }
                var ind2 = document.getElementById('cb-autosave');
                if (ind2) {
                    ind2.textContent = '✓ salvo automaticamente';
                    ind2.className = 'cb-autosave saved';
                }
            }, 500);
        }

        // ===== FORM (cabeçalho) =====
        function abrirForm(c) {
            document.getElementById('cb-modal-title').textContent = c ? '✏️ Editar Cabeçalho' : '➕ Novo Caso';
            document.getElementById('f-id').value = c ? c.id : '';
            document.getElementById('f-defeito').value = c ? (c.defeito || '') : '';
            document.getElementById('f-marca').value = c ? (c.marca || '') : '';
            document.getElementById('f-modelo').value = c ? (c.modelo || '') : '';
            document.getElementById('f-cliente').value = c ? (c.cliente || '') : '';
            document.getElementById('f-data').value = c ? (c.data || hojeISO()) : hojeISO();
            document.getElementById('f-status').value = (c && c.resultado === 'Não resolvido') ? 'Não resolvido' : 'Resolvido';
            modal.classList.add('open');
            setTimeout(function () { document.getElementById('f-defeito').focus(); }, 50);
        }
        function fecharForm() { modal.classList.remove('open'); }

        function salvar() {
            var id = document.getElementById('f-id').value;
            var defeito = document.getElementById('f-defeito').value.trim();
            if (!defeito) { toastMsg('⚠️ Informe o defeito / título do caso.'); document.getElementById('f-defeito').focus(); return; }
            var dados = {
                defeito: defeito,
                marca: document.getElementById('f-marca').value.trim(),
                modelo: document.getElementById('f-modelo').value.trim(),
                cliente: document.getElementById('f-cliente').value.trim(),
                data: document.getElementById('f-data').value || hojeISO(),
                resultado: document.getElementById('f-status').value
            };
            var list = load();
            if (id) {
                var i = list.findIndex(function (x) { return x.id === id; });
                if (i >= 0) list[i] = Object.assign({}, list[i], dados, { ultimaAtualizacao: hojeBR() });
            } else {
                dados.id = 'cb' + Date.now();
                dados.dataCadastro = hojeBR();
                dados.relatorio = '';
                list.push(dados);
                id = dados.id;
            }
            save(list);
            fecharForm();
            toastMsg('✅ Caso salvo!');
            renderDetail(id);
        }

        function excluir(id) {
            if (!confirm('Excluir este caso da bancada? Esta ação não pode ser desfeita.')) return;
            save(load().filter(function (x) { return x.id !== id; }));
            toastMsg('🗑️ Caso excluído.');
            renderHome();
        }

        // ===== Navegação / API global =====
        function cbHome() { if (busca) busca.value = ''; state.termo = ''; renderHome(); }
        function cbAbrir(id) { renderDetail(id); }
        function cbBuscar() { state.termo = (busca.value || '').trim(); renderHome(); }
        function cbNovo() { abrirForm(null); }
        function cbEditar(id) { var c = load().find(function (x) { return x.id === id; }); abrirForm(c || null); }
        window.cbHome = cbHome; window.cbAbrir = cbAbrir; window.cbBuscar = cbBuscar;
        window.cbNovo = cbNovo; window.cbEditar = cbEditar; window.cbExcluir = excluir;
        window.cbSalvar = salvar; window.cbFecharForm = fecharForm;

        document.addEventListener('DOMContentLoaded', function () {
            view = document.getElementById('cb-view');
            busca = document.getElementById('cb-busca');
            toast = document.getElementById('cb-toast');
            modal = document.getElementById('cb-modal');
            modal.addEventListener('click', function (e) { if (e.target === modal) fecharForm(); });
            renderHome();
        });

    })();
    </script>
</body>
</html>
