<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login — Cell City Gestão Empresarial</title>
  <link rel="stylesheet" href="shared/design-system.css">
  <script src="shared/theme.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0b0d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 36px 32px 32px;
    }

    /* ── Logo ── */
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-titulo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #00e676 0%, #00c853 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(0,200,83,0.35));
    }
    .logo-divisor {
      height: 1px;
      background: linear-gradient(90deg, transparent, #00c853, transparent);
      margin: 6px auto;
      width: 80%;
      opacity: 0.6;
    }
    .logo-sub {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b7280;
    }

    /* ── Campos ── */
    .campo {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #e5e7eb;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 200ms, box-shadow 200ms;
      -webkit-appearance: none;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: rgba(0,200,83,0.5);
      box-shadow: 0 0 0 3px rgba(0,200,83,0.12);
    }
    input::placeholder { color: #4b5563; }

    /* ── Lembrar de mim ── */
    .lembrar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      cursor: pointer;
      user-select: none;
    }
    .lembrar input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #00c853;
      cursor: pointer;
      flex-shrink: 0;
    }
    .lembrar span {
      font-size: 13px;
      color: #9ca3af;
    }

    /* ── Erro ── */
    .erro {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      color: #f87171;
      font-size: 13px;
      padding: 10px 12px;
      margin-bottom: 16px;
      display: none;
    }
    .erro.visivel { display: block; }

    /* ── Botão ── */
    .btn-entrar {
      width: 100%;
      background: linear-gradient(135deg, #00c853, #00e676);
      border: none;
      border-radius: 10px;
      color: #0a0b0d;
      font-size: 15px;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      transition: opacity 200ms, transform 100ms;
    }
    .btn-entrar:hover:not(:disabled) { opacity: 0.92; }
    .btn-entrar:active:not(:disabled) { transform: scale(0.98); }
    .btn-entrar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Spinner ── */
    .btn-entrar.carregando::after {
      content: '';
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 8px;
      vertical-align: -3px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Rodapé ── */
    .rodape {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <div class="logo-titulo">Cell City Informática</div>
      <div class="logo-divisor"></div>
      <div class="logo-sub">Gestão Empresarial</div>
    </div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email"
               autocomplete="email" inputmode="email"
               placeholder="seu@email.com" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha"
               autocomplete="current-password"
               placeholder="••••••••" required>
      </div>

      <label class="lembrar">
        <input type="checkbox" id="lembrar" name="lembrar">
        <span>Lembrar de mim neste dispositivo</span>
      </label>

      <div class="erro" id="erro" role="alert"></div>

      <button type="submit" class="btn-entrar" id="btn-entrar">
        Entrar
      </button>
    </form>

    <div class="rodape">Cell City Informática &nbsp;·&nbsp; Gestão Empresarial</div>
  </div>

  <script type="module">
    import { login, getCtxAsync } from './scripts/kernel.js';

    // H-003 (homologação 2026-07-03): era fixo em /CRM/..., sem prefixo
    // /dev — usuário já autenticado dentro do /dev era mandado de volta
    // para o dashboard de PRODUÇÃO (mesma origem, mesmo localStorage).
    // Mesmo critério de detecção já usado em shared/brand-header.js.
    const _p = location.pathname;
    const _prefix = (_p === '/dev' || _p.startsWith('/dev/')) ? '/dev' : '';
    const DASHBOARD = _prefix + '/CRM/pages/dashboard/index.html';

    // Se já está autenticado, vai direto ao dashboard.
    // Usa getCtxAsync() (não onAuthStateChanged direto) para garantir que a
    // flag cc_kernel_v1 já foi gravada antes de navegar — senão o gate do
    // dashboard manda de volta pro login antes da flag existir, causando
    // um loop de redirecionamento (tela piscando entre login e dashboard).
    getCtxAsync().then((ctx) => {
      if (ctx) location.replace(DASHBOARD);
    });

    // ── Submissão do formulário ──
    const form   = document.getElementById('form-login');
    const btn    = document.getElementById('btn-entrar');
    const erroEl = document.getElementById('erro');

    function mostrarErro(msg) {
      erroEl.textContent = msg;
      erroEl.classList.add('visivel');
    }
    function limparErro() {
      erroEl.textContent = '';
      erroEl.classList.remove('visivel');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      limparErro();

      const email  = document.getElementById('email').value.trim();
      const senha  = document.getElementById('senha').value;
      const lembrar = document.getElementById('lembrar').checked;

      if (!email || !senha) {
        mostrarErro('Preencha e-mail e senha.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('carregando');
      btn.textContent = 'Entrando';

      try {
        await login(email, senha, lembrar);
        location.replace(DASHBOARD);
      } catch (err) {
        // Traduz os códigos de erro do Firebase para mensagens amigáveis
        const MENSAGENS = {
          'auth/invalid-credential':      'E-mail ou senha incorretos.',
          'auth/user-not-found':          'E-mail não cadastrado.',
          'auth/wrong-password':          'Senha incorreta.',
          'auth/too-many-requests':       'Muitas tentativas. Tente novamente em alguns minutos.',
          'auth/network-request-failed':  'Sem conexão com a internet. Verifique sua rede.',
          'auth/user-disabled':           'Esta conta foi desativada. Fale com o administrador.'
        };
        const msg = MENSAGENS[err.code] || 'Erro ao entrar. Tente novamente.';
        mostrarErro(msg);
        console.error('[LOGIN]', err.code, err.message);
      } finally {
        btn.disabled = false;
        btn.classList.remove('carregando');
        btn.textContent = 'Entrar';
      }
    });

    // Enter no campo de e-mail passa para senha
    document.getElementById('email').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('senha').focus();
      }
    });
  </script>

</body>
</html>
