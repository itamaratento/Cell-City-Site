<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizando CRM</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050505;
      color: #f5f7fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box {
      width: min(420px, calc(100vw - 32px));
      padding: 28px 22px;
      border: 1px solid rgba(0, 200, 83, 0.25);
      border-radius: 12px;
      background: rgba(20, 22, 21, 0.8);
      text-align: center;
    }
    .icon { font-size: 40px; margin-bottom: 12px; }
    h1 { margin: 0 0 8px; color: #00e676; font-size: 20px; }
    p { margin: 0 0 6px; color: #a1a8b3; font-size: 14px; }
    .ok { color: #00e676; font-weight: 700; font-size: 16px; margin-top: 14px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🔄</div>
    <h1>Atualizando CRM</h1>
    <p>Limpando cache antigo...</p>
    <p>Aguarde, será redirecionado automaticamente.</p>
    <div class="ok" id="ok">✅ Pronto! Redirecionando...</div>
  </div>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        document.getElementById('ok').style.display = 'block';
      } catch (e) {
        console.warn('Erro ao limpar cache:', e);
      } finally {
        setTimeout(() => window.location.replace('/CRM/index.html'), 1500);
      }
    })();
  </script>
</body>
</html>
