<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 92" role="img" aria-label="Cell City Informática — Gestão Empresarial">
  <defs>
    <!-- Verde Cell City — do topo claro ao verde sólido -->
    <linearGradient id="cc-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a0f8d0"/>
      <stop offset="45%"  stop-color="#00c853"/>
      <stop offset="100%" stop-color="#009640"/>
    </linearGradient>
    <!-- Dourado institucional -->
    <linearGradient id="cc-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5da6a"/>
      <stop offset="100%" stop-color="#c09020"/>
    </linearGradient>
    <!-- Gradiente para linha decorativa (fade nas extremidades) -->
    <linearGradient id="cc-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(0,200,83,0)"/>
      <stop offset="20%"  stop-color="rgba(0,200,83,0.50)"/>
      <stop offset="80%"  stop-color="rgba(0,200,83,0.50)"/>
      <stop offset="100%" stop-color="rgba(0,200,83,0)"/>
    </linearGradient>
    <!-- Glow premium para CELL CITY -->
    <filter id="cc-glow" x="-8%" y="-20%" width="116%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Sombra discreta para contraste -->
    <filter id="cc-shadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5"
        flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════
       CELL CITY — elemento dominante da marca
       ══════════════════════════════════════════ -->
  <text x="210" y="44"
    text-anchor="middle"
    font-family="'Arial Black','Helvetica Neue',Impact,sans-serif"
    font-size="40"
    font-weight="900"
    letter-spacing="4"
    fill="url(#cc-green)"
    filter="url(#cc-glow)"
    text-rendering="optimizeLegibility">CELL CITY</text>

  <!-- Linha decorativa — separador premium -->
  <line x1="48" y1="54" x2="372" y2="54"
        stroke="url(#cc-line)" stroke-width="0.8"/>

  <!-- ══════════════════════════════════════════
       INFORMÁTICA — subtítulo institucional
       ══════════════════════════════════════════ -->
  <text x="210" y="69"
    text-anchor="middle"
    font-family="'Segoe UI','Arial',Helvetica,sans-serif"
    font-size="16"
    font-weight="400"
    letter-spacing="8"
    fill="#c8e8d8"
    text-rendering="optimizeLegibility">INFORMÁTICA</text>

  <!-- ══════════════════════════════════════════
       GESTÃO EMPRESARIAL — identificação
       ══════════════════════════════════════════ -->
  <text x="210" y="85"
    text-anchor="middle"
    font-family="'Segoe UI','Arial',Helvetica,sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="4"
    fill="url(#cc-gold)"
    text-rendering="optimizeLegibility">GESTÃO EMPRESARIAL</text>
</svg>
