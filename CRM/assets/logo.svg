<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 88" role="img" aria-label="Cell City Informática — Gestão Empresarial">
  <defs>
    <!-- Verde principal: Cell City green com profundidade -->
    <linearGradient id="cc-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#72f0b0"/>
      <stop offset="45%"  stop-color="#00c853"/>
      <stop offset="100%" stop-color="#005c22"/>
    </linearGradient>
    <!-- Dourado institucional -->
    <linearGradient id="cc-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0d268"/>
      <stop offset="100%" stop-color="#9e7010"/>
    </linearGradient>
    <!-- Sombra suave para CELL CITY -->
    <filter id="cc-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8"
        flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <!-- Brilho suave para o ícone da cidade -->
    <filter id="cc-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════
       ÍCONE: Skyline urbana (baseado na logo-large)
       Zona: x=0–82, centralizado verticalmente
       ═══════════════════════════════════════════ -->
  <g transform="translate(6, 11)" filter="url(#cc-glow)">
    <!-- Prédio esquerdo (pequeno) -->
    <rect x="0"  y="36" width="13" height="26" rx="1"
          fill="none" stroke="#00c853" stroke-width="1.8"/>
    <rect x="3"  y="42" width="4"  height="5"  rx="0.5"
          fill="none" stroke="#00c853" stroke-width="1.2"/>

    <!-- Prédio centro-esquerda (médio) -->
    <rect x="16" y="22" width="16" height="40" rx="1"
          fill="none" stroke="#00c853" stroke-width="1.8"/>
    <rect x="20" y="30" width="5"  height="6"  rx="0.5"
          fill="none" stroke="#00c853" stroke-width="1.2"/>

    <!-- Prédio central alto (topo diagonal = mais alto à direita) -->
    <path d="M36,22 L52,8 L52,62 L36,62 Z"
          fill="none" stroke="#00c853" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Prédio direito (médio) -->
    <rect x="55" y="27" width="14" height="35" rx="1"
          fill="none" stroke="#00c853" stroke-width="1.8"/>
    <rect x="58" y="34" width="4"  height="5"  rx="0.5"
          fill="none" stroke="#00c853" stroke-width="1.2"/>

    <!-- Arco do horizonte urbano -->
    <path d="M-2,62 Q34,73 73,62"
          fill="none" stroke="#00c853" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Linha separadora vertical -->
  <line x1="88" y1="14" x2="88" y2="74"
        stroke="rgba(0,200,83,0.2)" stroke-width="0.8"/>

  <!-- ═══════════════════════════════════════════
       TEXTO: hierarquia em 3 níveis
       Zona: x=96–418
       ═══════════════════════════════════════════ -->

  <!-- Nível 1 — CELL CITY (marca principal) -->
  <text x="96" y="42"
    font-family="'Arial Black','Helvetica Neue',Impact,sans-serif"
    font-size="36"
    font-weight="900"
    letter-spacing="2"
    fill="url(#cc-green)"
    filter="url(#cc-shadow)"
    text-rendering="optimizeLegibility">CELL CITY</text>

  <!-- Nível 2 — INFORMÁTICA (subtítulo) -->
  <text x="98" y="61"
    font-family="'Segoe UI','Arial',Helvetica,sans-serif"
    font-size="14.5"
    font-weight="300"
    letter-spacing="7"
    fill="rgba(200,220,205,0.88)"
    text-rendering="optimizeLegibility">INFORMÁTICA</text>

  <!-- Nível 3 — GESTÃO EMPRESARIAL (identificação institucional) -->
  <text x="98" y="77"
    font-family="'Segoe UI','Arial',Helvetica,sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="3"
    fill="url(#cc-gold)"
    text-rendering="optimizeLegibility">GESTÃO EMPRESARIAL</text>
</svg>
