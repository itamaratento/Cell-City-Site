<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 50" role="img" aria-label="Cell City Informática">
  <defs>
    <linearGradient id="cc-green-compact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a0f8d0"/>
      <stop offset="45%"  stop-color="#00c853"/>
      <stop offset="100%" stop-color="#009640"/>
    </linearGradient>
    <filter id="cc-glow-compact" x="-6%" y="-30%" width="112%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="0" y="36"
    font-family="'Noto Sans','Liberation Sans',sans-serif"
    font-size="34"
    font-weight="800"
    letter-spacing="1.5"
    fill="url(#cc-green-compact)"
    filter="url(#cc-glow-compact)"
    text-rendering="optimizeLegibility">CELL CITY</text>
</svg>
