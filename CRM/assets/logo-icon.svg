<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 58" role="img" aria-hidden="true">
  <!-- Ícone da City Cell — skyline de prédios, estilo line-art  -->
  <!-- Cor via CSS currentColor; se usado como <img>, usar fill/stroke direto -->

  <!-- Prédio 1 — baixo esquerdo -->
  <rect x="1"  y="38" width="11" height="18"
        fill="none" stroke="#00c853" stroke-width="1.8"/>
  <rect x="3.5" y="44" width="3" height="3" fill="#00c853"/>
  <rect x="7"   y="44" width="3" height="3" fill="#00c853"/>

  <!-- Prédio 2 — médio esquerdo -->
  <rect x="13" y="23" width="9" height="33"
        fill="none" stroke="#00c853" stroke-width="1.8"/>
  <rect x="15.5" y="29" width="3" height="3" fill="#00c853"/>

  <!-- Prédio 3 — centro, mais alto -->
  <rect x="23" y="4" width="14" height="52"
        fill="none" stroke="#00c853" stroke-width="1.8"/>
  <rect x="26"  y="10" width="3.5" height="3.5" fill="#00c853"/>
  <rect x="30.5" y="10" width="3.5" height="3.5" fill="#00c853"/>
  <rect x="26"  y="19" width="3.5" height="3.5" fill="#00c853"/>
  <rect x="30.5" y="19" width="3.5" height="3.5" fill="#00c853"/>

  <!-- Prédio 4 — médio direito -->
  <rect x="38" y="23" width="9" height="33"
        fill="none" stroke="#00c853" stroke-width="1.8"/>
  <rect x="40.5" y="29" width="3" height="3" fill="#00c853"/>

  <!-- Prédio 5 — baixo direito -->
  <rect x="48" y="38" width="11" height="18"
        fill="none" stroke="#00c853" stroke-width="1.8"/>
  <rect x="50.5" y="44" width="3" height="3" fill="#00c853"/>
  <rect x="54"   y="44" width="3" height="3" fill="#00c853"/>

  <!-- Linha de base -->
  <line x1="0" y1="56.1" x2="60" y2="56.1"
        stroke="#00c853" stroke-width="1.5"/>
</svg>
