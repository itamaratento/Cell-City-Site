<!DOCTYPE html>
<html lang="pt-BR" data-fav-key="compras" data-fav-label="Compras" data-fav-icon="🛒" data-fav-url="/CRM/pages/compras/index.html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>var _h=location.hostname;var _p=location.pathname;var _dev=(_p==='/dev'||_p.indexOf('/dev/')===0);if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace((_dev?'/dev':'')+'/CRM/login.html');</script>
<title>Cell City — Compras</title>
    <link rel="stylesheet" href="../../shared/design-system.css">
    <script src="../../shared/theme.js"></script>
<link rel="stylesheet" href="compras.css">
<link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>

<header class="cr-header" id="mainHeader">
  <h1>🛒 Compras</h1>
</header>

<main>
<div class="cr-content">

  <div class="cr-toolbar">
    <button class="cr-btn-nova" id="cr-btn-nova">＋ Novo Pedido</button>
    <div class="cr-filtro-status">
      <button class="cr-fstatus active" data-cr-status="todos">Todos</button>
      <button class="cr-fstatus" data-cr-status="pendente">Pendentes</button>
      <button class="cr-fstatus" data-cr-status="pedido">Pedidos</button>
      <button class="cr-fstatus" data-cr-status="recebido">Recebidos</button>
      <button class="cr-fstatus" data-cr-status="cancelado">Cancelados</button>
    </div>
  </div>

  <!-- FORM -->
  <div class="cr-form hidden" id="cr-form">
    <div class="cr-form-titulo" id="cr-form-titulo">Novo Pedido</div>
    <div class="cr-form-grid">
      <div class="cr-form-group cr-span2">
        <label>Descrição</label>
        <input type="text" id="cr-desc" placeholder="Ex: Peças para iPhone 15, Telas Samsung..." maxlength="120">
      </div>
      <div class="cr-form-group">
        <label>Fornecedor</label>
        <select id="cr-fornecedor"><option value="">Selecionar...</option></select>
      </div>
      <div class="cr-form-group">
        <label>Data</label>
        <input type="date" id="cr-data">
      </div>
      <div class="cr-form-group">
        <label>Valor (R$)</label>
        <input type="number" id="cr-valor" min="0" step="0.01" placeholder="0,00">
      </div>
      <div class="cr-form-group">
        <label>Status</label>
        <select id="cr-status">
          <option value="pendente">🟡 Pendente</option>
          <option value="pedido">🔵 Pedido</option>
          <option value="recebido">✅ Recebido</option>
          <option value="cancelado">❌ Cancelado</option>
        </select>
      </div>
      <div class="cr-form-group cr-span2">
        <label>Observação</label>
        <input type="text" id="cr-obs" placeholder="Opcional..." maxlength="200">
      </div>
    </div>
    <div class="cr-form-btns">
      <button class="cr-btn-salvar" id="cr-salvar">Salvar</button>
      <button class="cr-btn-cancelar" id="cr-cancelar">Cancelar</button>
    </div>
  </div>

  <div class="cr-loading" id="cr-loading"><div class="cr-spinner"></div><span>Carregando...</span></div>
  <div id="cr-lista"></div>
  <div class="cr-empty" id="cr-empty" style="display:none">
    <div class="cr-empty-icon">🛒</div>
    <div class="cr-empty-title">Nenhum pedido</div>
    <div class="cr-empty-sub">Crie seu primeiro pedido de compras.</div>
  </div>

</div>
</main>

<div class="cr-toast" id="cr-toast"></div>

<script src="../../shared/brand-header.js"></script>
<script type="module" src="compras.js"></script>
<script type="module" src="../../shared/dock.js"></script>
</body>
</html>
