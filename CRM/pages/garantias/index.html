<!DOCTYPE html>
<html lang="pt-BR" data-fav-key="garantias" data-fav-label="Garantias" data-fav-icon="🛡️" data-fav-url="/CRM/pages/garantias/index.html">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell City Gestão Empresarial</title>
    <link rel="stylesheet" href="garantias.css">
    <link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>
    <header class="header" id="mainHeader">
        <h1 id="headerTitle">🛡️ Garantias</h1>
    </header>

    <main>
        <div class="g-wrap">

            <div class="g-section">
                <div class="g-section-title">🏪 Dados da Loja</div>
                <div class="g-row">
                    <div class="g-field">
                        <label>Nome da Loja</label>
                        <input type="text" id="loja-nome" placeholder="Ex: Cell City Informática">
                    </div>
                    <div class="g-field">
                        <label>WhatsApp</label>
                        <input type="text" id="loja-whatsapp" placeholder="(62) 99999-9999">
                    </div>
                </div>
                <div class="g-row">
                    <div class="g-field">
                        <label>Endereço</label>
                        <input type="text" id="loja-endereco" placeholder="Rua, número, bairro, cidade">
                    </div>
                    <div class="g-field">
                        <label>CNPJ</label>
                        <input type="text" id="loja-cnpj" placeholder="00.000.000/0001-00">
                    </div>
                </div>
            </div>

            <div class="g-section">
                <div class="g-section-title">🖼️ Logo da Loja</div>
                <div class="g-logo-area">
                    <div class="g-logo-preview" id="logo-preview">
                        <span class="g-logo-empty">Sem logo</span>
                    </div>
                    <div class="g-logo-btns">
                        <label class="g-btn g-btn-upload">
                            📁 Escolher imagem
                            <input type="file" accept="image/*" onchange="handleLogoUpload(event)" style="display:none">
                        </label>
                        <button class="g-btn g-btn-del" id="btn-remove-logo" onclick="removeLogo()" style="display:none">🗑️ Remover</button>
                    </div>
                    <p class="g-hint">PNG com fundo transparente · Máx 500kb</p>
                </div>
            </div>

            <div class="g-section">
                <div class="g-section-title">📋 Modelos de Garantia</div>
                <p class="g-hint" style="margin-bottom:16px">Textos que aparecerão na impressão. Marque um como padrão.</p>
                <div id="garantias-list"></div>
                <button class="g-btn g-btn-add" onclick="addGarantia()">＋ Novo modelo</button>
            </div>

            <button class="g-btn-save" id="btn-save" onclick="saveConfig()">💾 Salvar Configurações</button>

        </div>
    </main>

    <div class="g-toast" id="toast"></div>

    <script src="../../shared/brand-header.js"></script>
    <script src="../../shared/sidebar.js"></script>
    <script type="module" src="garantias.js"></script>
    <script type="module" src="../../shared/dock.js"></script>
</body>
</html>
