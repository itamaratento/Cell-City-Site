<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell City — Agenda Inteligente</title>
    <link rel="stylesheet" href="acaodasemana.css">
    <link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>

    <header class="header" id="mainHeader">
        <h1 class="ag-header-titulo">🗓️ Agenda Inteligente</h1>
    </header>

    <main>
        <div class="ag-content">

            <!-- ALERTA DE COMPROMISSO NO HORÁRIO -->
            <div class="ag-alerta-vivo" id="ag-alerta-vivo" hidden>
                <div class="ag-alerta-icone">⚠</div>
                <div class="ag-alerta-corpo">
                    <div class="ag-alerta-topo">COMPROMISSO</div>
                    <div class="ag-alerta-hora" id="ag-alerta-hora">--:--</div>
                    <div class="ag-alerta-titulo" id="ag-alerta-titulo">—</div>
                    <div class="ag-alerta-status" id="ag-alerta-status">—</div>
                </div>
                <button class="ag-alerta-fechar" id="ag-alerta-fechar" title="Dispensar">✕</button>
            </div>

            <!-- RESUMO -->
            <div class="ag-resumo" id="ag-resumo">
                <div class="ag-resumo-item">
                    <span class="ag-resumo-num" id="ag-res-hoje">—</span>
                    <span class="ag-resumo-label">Hoje</span>
                </div>
                <div class="ag-resumo-divider"></div>
                <div class="ag-resumo-item">
                    <span class="ag-resumo-num ag-amarelo" id="ag-res-avencer">—</span>
                    <span class="ag-resumo-label">A vencer</span>
                </div>
                <div class="ag-resumo-divider"></div>
                <div class="ag-resumo-item">
                    <span class="ag-resumo-num ag-vermelho" id="ag-res-atrasados">—</span>
                    <span class="ag-resumo-label">Passou</span>
                </div>
                <div class="ag-resumo-divider ag-prox-divider"></div>
                <div class="ag-resumo-item ag-resumo-prox">
                    <span class="ag-resumo-num-prox" id="ag-res-proximo">—</span>
                    <span class="ag-resumo-label">Próximo compromisso</span>
                </div>
            </div>

            <!-- CABEÇALHO DO CALENDÁRIO -->
            <div class="ag-cal-header">
                <button class="ag-nav-btn" id="ag-prev" title="Mês anterior">◀</button>
                <div class="ag-cal-titulo-wrap">
                    <span class="ag-cal-titulo" id="ag-cal-titulo">—</span>
                    <button class="ag-hoje-btn" id="ag-hoje">Hoje</button>
                </div>
                <button class="ag-nav-btn" id="ag-next" title="Próximo mês">▶</button>
            </div>

            <!-- GRADE — cada dia é uma nota colada -->
            <div class="ag-cal">
                <div class="ag-cal-semana">
                    <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span>
                    <span>Qui</span><span>Sex</span><span>Sáb</span>
                </div>
                <div class="ag-cal-grade" id="ag-cal-grade"></div>
            </div>

            <!-- BLOCO DE NOTAS DO DIA (várias anotações empilhadas) -->
            <div class="ag-nota-painel">
                <div class="ag-nota-head">
                    <span class="ag-nota-titulo" id="ag-dia-titulo">Selecione um dia</span>
                    <div class="ag-nota-controles">
                        <div class="ag-fonte">
                            <button type="button" id="ag-fonte-menos" title="Diminuir fonte">A−</button>
                            <button type="button" id="ag-fonte-mais" title="Aumentar fonte">A+</button>
                        </div>
                        <button type="button" class="ag-add-nota" id="ag-add-nota">＋ Nota</button>
                    </div>
                </div>
                <div class="ag-dica">Cada linha é uma anotação. Comece pelo horário (ex.: 09:00). Clique na bolinha para a cor · Enter cria outra · salva sozinho.</div>
                <div class="ag-notas-lista" id="ag-notas-lista"></div>
                <div class="ag-nota-status" id="ag-nota-status"></div>
            </div>

        </div>
    </main>

    <div class="ag-toast" id="ag-toast"></div>

    <script src="../../shared/brand-header.js"></script>
    <script type="module" src="acaodasemana.js"></script>
    <script type="module" src="../../shared/dock.js"></script>
</body>
</html>
