<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace('/CRM/login.html');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa - Cell City CRM</title>
  <link rel="stylesheet" href="caixa.css">
  <link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>

  <header>
    <h1>💰 Caixa</h1>
  </header>

  <!-- TOTAIS -->
  <div class="totais">
    <div class="card-total entrada">
      <div class="card-label">Entradas</div>
      <div class="card-valor" id="total-entrada">R$ 0,00</div>
    </div>
    <div class="card-total saida">
      <div class="card-label">Saídas</div>
      <div class="card-valor" id="total-saida">R$ 0,00</div>
    </div>
    <div class="card-total saldo">
      <div class="card-label">Saldo</div>
      <div class="card-valor" id="total-saldo">R$ 0,00</div>
    </div>
  </div>

  <!-- FORMULÁRIO NOVO LANÇAMENTO -->
  <div class="form-card">
    <div class="form-titulo">➕ Novo Lançamento</div>

    <div class="tipo-grupo">
      <button class="tipo-btn ativo" data-tipo="entrada" onclick="selecionarTipo(this)">🟢 Entrada</button>
      <button class="tipo-btn" data-tipo="saida" onclick="selecionarTipo(this)">🔴 Saída</button>
      <button class="tipo-btn" data-tipo="servico" onclick="selecionarTipo(this)">🔵 Serviço</button>
    </div>
    <input type="hidden" id="tipo" value="entrada">

    <div class="campo-grupo">
      <label>Descrição *</label>
      <input type="text" id="descricao" placeholder="Ex: Venda de película, Serviço de tela...">
    </div>

    <div class="campo-grupo">
      <label>Categoria *</label>
      <select id="categoria">
        <option value="">Carregando...</option>
      </select>
    </div>

    <div class="campo-linha">
      <div class="campo-grupo">
        <label>Valor (R$) *</label>
        <input type="number" id="valor" placeholder="0,00" step="0.01" min="0">
      </div>
      <div class="campo-grupo">
        <label>Data *</label>
        <input type="date" id="data">
      </div>
    </div>

    <div class="campo-grupo">
      <label>Observação</label>
      <input type="text" id="obs" placeholder="Opcional...">
    </div>

    <button class="btn-salvar" onclick="salvarLancamento()">💾 Salvar</button>
  </div>

  <!-- FILTROS -->
  <div class="filtros">
    <button class="filtro-btn ativo" data-periodo="hoje" onclick="filtrar(this)">Hoje</button>
    <button class="filtro-btn" data-periodo="semana" onclick="filtrar(this)">Semana</button>
    <button class="filtro-btn" data-periodo="mes" onclick="filtrar(this)">Mês</button>
  </div>

  <!-- LISTA DE LANÇAMENTOS -->
  <div id="lista-lancamentos">
    <div class="vazio">Carregando lançamentos...</div>
  </div>

  <script type="module" src="caixa.js"></script>
  <script src="../../shared/brand-header.js"></script>
  <script src="../../shared/dock.js" type="module"></script>
  <script src="../../shared/favoritos.js" type="module"></script>
</body>
</html>
