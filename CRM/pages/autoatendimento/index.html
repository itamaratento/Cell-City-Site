<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell City Gestão Empresarial — Autoatendimento</title>
    <link rel="stylesheet" href="autoatendimento.css">
    <link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>
    <header class="header">
        <span class="header-title">⚡ Autoatendimento / Pré-OS</span>
    </header>

    <div class="auto-screen">
        <!-- TOPO: FILTROS + NOVO -->
        <section class="auto-topo">
            <div class="auto-search">
                <span class="auto-search-icon">🔍</span>
                <input type="text" id="auto-busca" placeholder="Pesquisar por nome ou telefone..." oninput="filtrarPreOS()" autocomplete="off">
            </div>
            <div class="auto-filtros">
                <button class="auto-filter-btn${' active' if status === 'AGUARDANDO_CONVERSAO'}" onclick="filtrarPorStatus('AGUARDANDO_CONVERSAO')">Aguardando</button>
                <button class="auto-filter-btn" onclick="filtrarPorStatus('CONVERTIDA')">Convertidas</button>
                <button class="auto-filter-btn" onclick="filtrarPorStatus('TODAS')">Todas</button>
            </div>
            <a href="../../public/abrir-atendimento.html" target="_blank" class="auto-btn-novo">🔗 Abrir Link</a>
        </section>

        <!-- CONTADOR -->
        <section class="auto-contador">
            <div class="counter-card">
                <span class="counter-label">Aguardando Conversão</span>
                <span class="counter-value" id="auto-contador-pendentes">0</span>
            </div>
            <div class="counter-card">
                <span class="counter-label">Convertidas</span>
                <span class="counter-value" id="auto-contador-convertidas">0</span>
            </div>
        </section>

        <!-- LISTA DE PRÉ-OS -->
        <section class="auto-lista-sec">
            <div class="auto-sec-titulo">📋 Pré-OS Recebidas</div>
            <div class="auto-lista" id="auto-lista">
                <div class="auto-empty">
                    <div class="auto-empty-icon">📝</div>
                    <p>Nenhuma solicitação de Autoatendimento ainda.</p>
                </div>
            </div>
        </section>
    </div>

    <!-- MODAL DETALHES / CONVERSÃO -->
    <div id="auto-modal" class="auto-modal">
        <div class="auto-modal-content">
            <div class="auto-modal-header">
                <h3 id="auto-modal-titulo">Detalhes da Pré-OS</h3>
                <button class="auto-modal-close" onclick="fecharModalAutoatendimento()">✕</button>
            </div>
            <div class="auto-modal-body" id="auto-modal-body"></div>
            <div class="auto-modal-footer">
                <button class="auto-btn-cancelar" onclick="fecharModalAutoatendimento()">Fechar</button>
                <button class="auto-btn-converter" id="auto-btn-converter" onclick="converterEmOS()" style="display:none;">🚀 Converter em OS</button>
            </div>
        </div>
    </div>

    <script src="../../shared/brand-header.js"></script>
    <script type="module" src="autoatendimento.js"></script>
    <script type="module" src="../../shared/dock.js"></script>
<script src="../../shared/obs-expand.js?v=20260612-1"></script>
</body>
</html>
