<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell City - Acesso</title>
    <link rel="stylesheet" href="config.css">
    <link rel="manifest" href="/CRM/manifest.json">
    <meta name="theme-color" content="#00C853">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cell City">
    <link rel="apple-touch-icon" href="/CRM/assets/logo.png">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/CRM/sw.js', { scope: '/CRM/' });</script>
</head>
<body>

    <main>
        <div class="pin-wrapper">

            <div class="pin-logo">
                <div class="pin-logo-icon">🔐</div>
                <div class="pin-logo-title">Cell City CRM</div>
                <div class="pin-logo-sub">Acesso Seguro</div>
            </div>

            <!-- MODO: DIGITAR PIN -->
            <div id="screen-login" class="pin-screen active">
                <p class="pin-label" id="pin-label">Digite seu PIN</p>
                <div class="pin-dots" id="pin-dots">
                    <span class="pin-dot"></span>
                    <span class="pin-dot"></span>
                    <span class="pin-dot"></span>
                    <span class="pin-dot"></span>
                </div>
                <div class="pin-error" id="pin-error"></div>
                <div class="pin-pad" id="pin-pad">
                    <button class="pin-btn" onclick="pinPress('1')">1</button>
                    <button class="pin-btn" onclick="pinPress('2')">2</button>
                    <button class="pin-btn" onclick="pinPress('3')">3</button>
                    <button class="pin-btn" onclick="pinPress('4')">4</button>
                    <button class="pin-btn" onclick="pinPress('5')">5</button>
                    <button class="pin-btn" onclick="pinPress('6')">6</button>
                    <button class="pin-btn" onclick="pinPress('7')">7</button>
                    <button class="pin-btn" onclick="pinPress('8')">8</button>
                    <button class="pin-btn" onclick="pinPress('9')">9</button>
                    <button class="pin-btn" onclick="pinPress('0')">0</button>
                    <button class="pin-btn pin-btn-del" onclick="pinDelete()">⌫</button>
                    <button class="pin-btn pin-btn-empty"></button>
                </div>
                <button class="pin-btn-device" id="btn-device" onclick="entrarComDispositivo()" style="display:none">
                    🔐 Usar senha do dispositivo
                </button>
                <button class="pin-link" id="btn-alterar" onclick="showScreen('alterar')" style="display:none">Alterar PIN</button>
                <button class="pin-link pin-link-sair" id="btn-redefinir" onclick="redefinirPin()" style="display:none">Redefinir PIN</button>
            </div>

            <!-- MODO: CONFIGURAR / ALTERAR PIN -->
            <div id="screen-alterar" class="pin-screen">
                <p class="pin-label" id="pin-novo-label">Criar novo PIN</p>
                <div class="pin-dots" id="pin-novo-dots">
                    <span class="pin-dot"></span>
                    <span class="pin-dot"></span>
                    <span class="pin-dot"></span>
                    <span class="pin-dot"></span>
                </div>
                <div class="pin-error" id="pin-novo-error"></div>
                <div class="pin-pad">
                    <button class="pin-btn" onclick="pinNovoPress('1')">1</button>
                    <button class="pin-btn" onclick="pinNovoPress('2')">2</button>
                    <button class="pin-btn" onclick="pinNovoPress('3')">3</button>
                    <button class="pin-btn" onclick="pinNovoPress('4')">4</button>
                    <button class="pin-btn" onclick="pinNovoPress('5')">5</button>
                    <button class="pin-btn" onclick="pinNovoPress('6')">6</button>
                    <button class="pin-btn" onclick="pinNovoPress('7')">7</button>
                    <button class="pin-btn" onclick="pinNovoPress('8')">8</button>
                    <button class="pin-btn" onclick="pinNovoPress('9')">9</button>
                    <button class="pin-btn" onclick="pinNovoPress('0')">0</button>
                    <button class="pin-btn pin-btn-del" onclick="pinNovoDelete()">⌫</button>
                    <button class="pin-btn pin-btn-empty"></button>
                </div>
                <button class="pin-link" onclick="showScreen('login')">← Voltar</button>
            </div>

            <!-- MODO: LOGADO -->
            <div id="screen-logado" class="pin-screen">
                <div class="pin-success">✅</div>
                <p class="pin-label">Acesso liberado</p>
                <a href="/CRM/pages/dashboard/index.html" class="pin-btn-entrar">Abrir CRM</a>

                <!-- SEGURANÇA: Usar senha do dispositivo -->
                <div class="seg-device-row" id="seg-device-row" style="display:none" onclick="toggleDispositivo()">
                    <div class="seg-device-info">
                        <div class="seg-device-title">🔐 Usar senha do dispositivo</div>
                        <div class="seg-device-status" id="seg-device-status">Desativado — usa o PIN do CRM.</div>
                    </div>
                    <div class="seg-device-toggle" id="seg-device-toggle"><span class="seg-device-knob"></span></div>
                </div>
                <button class="pin-link" onclick="showScreen('alterar')" style="margin-top:12px">🔑 Alterar PIN</button>
                <button class="pin-link pin-link-sair" onclick="sair()">Sair</button>
            </div>

        </div>
    </main>

    <script type="module" src="config.js"></script>
</body>
</html>
