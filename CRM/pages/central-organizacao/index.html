<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;var _p=location.pathname;var _dev=(_p==='/dev'||_p.indexOf('/dev/')===0);if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace((_dev?'/dev':'')+'/CRM/login.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Cell City — Central Automação</title>
    <link rel="stylesheet" href="../../shared/design-system.css">
    <script src="../../shared/theme.js"></script>
    <link rel="stylesheet" href="central.css">
    <link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>

    <!-- O brand-header.js migra este header para a barra universal -->
    <header>
        <span class="header-title">⚡ Central Automação</span>
    </header>

    <main class="content">

        <div class="tabs">
            <button class="tab active" data-tab="whatsapp">📱 WhatsApp</button>
            <button class="tab" data-tab="robos">🤖 Robôs & IA</button>
            <button class="tab" data-tab="programas">🛠️ Programas</button>
            <button class="tab" data-tab="historico">📜 Histórico</button>
            <button class="tab" data-tab="links">🔗 Links</button>
        </div>

        <!-- ===== WHATSAPP ===== -->
        <div class="tab-panel active" id="tab-whatsapp">
            <div class="section-header">
                <div class="section-title">Números de WhatsApp</div>
                <button class="btn-add" onclick="Central.abrirForm('whatsapp')">+ Adicionar</button>
            </div>

            <div class="form-box hidden" id="form-whatsapp">
                <input class="field" id="wpp-nome" placeholder="Nome (ex: WhatsApp Principal)" maxlength="60">
                <input class="field" id="wpp-numero" placeholder="Número (ex: 11999999999)" maxlength="20" type="tel">

                <!-- E-mails dinâmicos -->
                <div id="wpp-emails-container" class="dynamic-fields">
                    <div class="field-row">
                        <input class="field" placeholder="E-mail (opcional)" maxlength="120" type="email">
                        <button class="btn-add-row" type="button" onclick="Central.addEmailRow()" title="Adicionar e-mail">+</button>
                    </div>
                </div>

                <!-- Senhas dinâmicas -->
                <div id="wpp-senhas-container" class="dynamic-fields">
                    <div class="field-row">
                        <input class="field" placeholder="Senha (opcional)" maxlength="120" type="text">
                        <button class="btn-add-row" type="button" onclick="Central.addSenhaRow()" title="Adicionar senha">+</button>
                    </div>
                </div>

                <input class="field" id="wpp-obs" placeholder="Observação (opcional)" maxlength="120">
                <div class="form-actions">
                    <button class="btn-save" onclick="Central.salvar('whatsapp')">Salvar</button>
                    <button class="btn-cancel" onclick="Central.fecharForm('whatsapp')">Cancelar</button>
                </div>
            </div>

            <div class="list" id="list-whatsapp"></div>
        </div>

        <!-- ===== ROBÔS & IA ===== -->
        <div class="tab-panel" id="tab-robos">
            <div class="section-header">
                <div class="section-title">Robôs e Inteligência Artificial</div>
                <button class="btn-add" onclick="Central.abrirForm('robos')">+ Adicionar</button>
            </div>

            <div class="form-box hidden" id="form-robos">
                <input class="field" id="robos-nome" placeholder="Nome (ex: ChatGPT)" maxlength="60">
                <input class="field" id="robos-funcao" placeholder="Função (ex: Suporte e diagnóstico)" maxlength="120">
                <input class="field" id="robos-obs" placeholder="Observação (opcional)" maxlength="200">
                <div class="form-actions">
                    <button class="btn-save" onclick="Central.salvar('robos')">Salvar</button>
                    <button class="btn-cancel" onclick="Central.fecharForm('robos')">Cancelar</button>
                </div>
            </div>

            <div class="list" id="list-robos"></div>
        </div>

        <!-- ===== PROGRAMAS ===== -->
        <div class="tab-panel" id="tab-programas">
            <div class="section-header">
                <div class="section-title">Programas e Ferramentas</div>
                <button class="btn-add" onclick="Central.abrirForm('programas')">+ Adicionar</button>
            </div>

            <div class="form-box hidden" id="form-programas">
                <input class="field" id="programas-nome" placeholder="Nome (ex: VS Code)" maxlength="60">
                <input class="field" id="programas-link" placeholder="Link (ex: https://code.visualstudio.com)" maxlength="200">
                <input class="field" id="programas-obs" placeholder="Observação (opcional)" maxlength="200">
                <div class="form-actions">
                    <button class="btn-save" onclick="Central.salvar('programas')">Salvar</button>
                    <button class="btn-cancel" onclick="Central.fecharForm('programas')">Cancelar</button>
                </div>
            </div>

            <div class="list" id="list-programas"></div>
        </div>

        <!-- ===== HISTÓRICO ===== -->
        <div class="tab-panel" id="tab-historico">
            <div class="section-header">
                <div class="section-title">Histórico do Projeto</div>
                <button class="btn-add" onclick="Central.abrirForm('historico')">+ Registrar</button>
            </div>

            <div class="form-box hidden" id="form-historico">
                <input class="field" id="historico-data" type="date">
                <input class="field" id="historico-descricao" placeholder="O que foi feito (ex: Criado módulo financeiro)" maxlength="200">
                <input class="field" id="historico-responsavel" placeholder="Responsável (ex: Cell City)" maxlength="60">
                <div class="form-actions">
                    <button class="btn-save" onclick="Central.salvar('historico')">Salvar</button>
                    <button class="btn-cancel" onclick="Central.fecharForm('historico')">Cancelar</button>
                </div>
            </div>

            <div class="list" id="list-historico"></div>
        </div>

        <!-- ===== LINKS ===== -->
        <div class="tab-panel" id="tab-links">
            <div class="section-header">
                <div class="section-title">Links Importantes</div>
                <button class="btn-add" onclick="Central.abrirForm('links')">+ Adicionar</button>
            </div>

            <div class="form-box hidden" id="form-links">
                <input class="field" id="links-nome" placeholder="Nome (ex: Firebase Console)" maxlength="60">
                <input class="field" id="links-url" placeholder="URL (ex: https://console.firebase.google.com)" maxlength="300">
                <input class="field" id="links-obs" placeholder="Observação (opcional)" maxlength="120">
                <div class="form-actions">
                    <button class="btn-save" onclick="Central.salvar('links')">Salvar</button>
                    <button class="btn-cancel" onclick="Central.fecharForm('links')">Cancelar</button>
                </div>
            </div>

            <div class="list" id="list-links"></div>
        </div>

    </main>

    <div class="toast hidden" id="toast"></div>

    <script src="../../shared/brand-header.js"></script>
    <script type="module" src="central.js"></script>
<script src="../../shared/obs-expand.js?v=20260612-1"></script>
</body>
</html>
