  <!-- ===== SAFETY NET: Garante que a tela de login SEMPRE apareça ===== -->
  <script>
  (function() {
    console.log('[Portal-Safety] Script de segurança carregado.');

    // Verifica a cada 1s se o Portal já substituiu o "Carregando..."
    var _safetyCheck = 0;
    var _safetyMax = 25; // ~25 segundos (Firebase CDN pode ser lento)
    function _forceLogin() {
      _safetyCheck++;
      var el = document.getElementById('app-content');
      if (!el) { console.warn('[Portal-Safety] #app-content não encontrado'); return; }

      // Se o Portal já renderizou, não faz nada
      var btnLogin = document.getElementById('login-phone');
      if (btnLogin) {
        console.log('[Portal-Safety] Tela de login já está visível — safety cancelado.');
        return;
      }

      // Se portal.js carregou e está funcional, não sobrescreve
      if (typeof window.Portal !== 'undefined' && typeof window.Portal.doLogin === 'function') {
        console.log('[Portal-Safety] Portal já carregado — safety cancelado.');
        return;
      }

      if (_safetyCheck >= _safetyMax) {
        console.error('[Portal-Safety] ***** SAFETY NET DISPARADO *****');
        console.error('[Portal-Safety] portal.js ou Firebase não responderam em ~25s');
        console.error('[Portal-Safety] Forçando render manual da tela de login');

        // Oculta elementos (footer e whatsapp; o header agora é global via header-component.js)
        var ftr = document.getElementById('app-footer');
        var wa  = document.getElementById('whatsapp-float');
        if (ftr) ftr.style.display = 'none';
        if (wa)  wa.style.display  = 'none';

        // Renderiza login manualmente (HTML duplicado do portal.js por segurança)
        el.innerHTML =
          '<div class="login-container">' +
          '<div class="login-header">' +
          '<img src="../../assets/logo.svg" alt="Cell City" class="login-logo-img" onclick="window.location.href=\'/\'">' +
          '<a href="/" class="login-btn-home">HOME Voltar ao Site</a>' +
          '</div>' +
          '<div class="login-card">' +
          '<h1>Portal do Cliente</h1>' +
          '<p>Acesse sua área exclusiva utilizando seu telefone</p>' +
          '<div class="login-form-box">' +
          '<div class="login-form-group">' +
          '<input type="tel" id="login-phone" class="login-input" placeholder="Telefone" maxlength="15" inputmode="numeric" autocomplete="tel">' +
          '<span class="login-error" id="login-error"></span>' +
          '</div>' +
          '<button id="btn-login" class="login-btn" onclick="Portal.doLogin()">Entrar</button>' +
          '<button id="btn-login-loading" class="login-btn" style="display:none" disabled><span class="spinner"></span> Verificando...</button>' +
          '</div>' +
          '</div>' +
          '</div>';
        console.log('[Portal-Safety] Tela de login renderizada manualmente.');
      } else {
        setTimeout(_forceLogin, 1000);
      }
    }
    setTimeout(_forceLogin, 1000);
  })();
  </script>

  <script type="module">
    // ===== FIREBASE INIT =====
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import {
      getFirestore,
      collection, query, where, getDocs, getDoc, doc, onSnapshot,
    } from 'firebase/firestore';
    import { getFunctions, httpsCallable } from 'firebase/functions';
    import * as PhoneUtils from '../../shared/phone-utils.js';
    import '../../shared/env-config.js'; // seleção DEV/PROD → window.CC_FIREBASE_CONFIG

    const firebaseConfig = window.CC_FIREBASE_CONFIG;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Expõe globais para portal.js (não-module)
    window.db = db;
    window.FirebaseModules = {
      collection, query, where, getDocs, getDoc, doc, onSnapshot,
    };
    window.PhoneUtils = PhoneUtils;

    // Sprint 1b (2026-07-06): as 7 funcionalidades do Portal que dependiam de
    // acesso direto do cliente anônimo ao Firestore agora passam por estas
    // Cloud Functions (functions/index.js, Admin SDK) — permite fechar as
    // Rules dessas coleções sem repetir o bloqueio a cliente anônimo legítimo
    // (ver CRM/TECHDOC.md, hotfix 60173b7 / Sprint 1a).
    const functionsApp = getFunctions(app, 'southamerica-east1');

    // PS-6 (multiempresa): o Portal atende uma empresa por URL
    // (?empresa=<id>; sem o parâmetro, Cell City). O empresaId é
    // injetado centralmente em TODAS as chamadas — portal.js não
    // precisa saber de multiempresa.
    const EMPRESA_ID = (new URLSearchParams(location.search).get('empresa') || 'cellcity-master')
      .toLowerCase().replace(/[^a-z0-9-]/g, '');
    window.PORTAL_EMPRESA_ID = EMPRESA_ID;
    const call = (name) => {
      const fn = httpsCallable(functionsApp, name);
      return (data = {}) => fn({ ...data, empresaId: EMPRESA_ID });
    };
    window.PortalFunctions = {
      obterNomeCliente: call('portalObterNomeCliente'),
      listarMensagens: call('portalListarMensagens'),
      enviarMensagem: call('portalEnviarMensagem'),
      marcarMensagemLida: call('portalMarcarMensagemLida'),
      listarAvaliacoes: call('portalListarAvaliacoes'),
      criarAvaliacao: call('portalCriarAvaliacao'),
      listarAgendamentos: call('portalListarAgendamentos'),
      criarAgendamento: call('portalCriarAgendamento'),
      listarHorariosOcupados: call('portalListarHorariosOcupados'),
      criarSolicitacaoDiagnostico: call('portalCriarSolicitacaoDiagnostico'),
      registrarEvento: call('portalRegistrarEvento'),
      responderOrcamento: call('portalResponderOrcamento'),
      // PS-6: login e atualização de OS também via Cloud Function —
      // permitiu fechar o `list` público de /os nas Rules.
      consultarOSPorTelefone: call('consultarOSPorTelefonePublica'),
    };

    // Auth anônima
    window.authReady = false;
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        try {
          await signInAnonymously(auth);
        } catch (err) {
          console.error('Erro auth anônima:', err);
          // MESMO COM ERRO, dispara firebase-ready para não travar o Portal
          window.authReady = true;
          window.dispatchEvent(new Event('firebase-ready'));
        }
      } else {
        window.authReady = true;
        window.dispatchEvent(new Event('firebase-ready'));
      }
    });
  </script>
