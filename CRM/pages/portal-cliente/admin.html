<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo — Portal do Cliente</title>
  <link rel="stylesheet" href="admin.css?v=2.1">

  <!-- Firebase SDK (compat) v10.8.0 -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="admin-topbar">
    <div class="admin-topbar-left">
      <span class="admin-topbar-logo">🔷</span>
      <div>
        <span class="admin-topbar-title">Portal do Cliente</span>
        <span class="admin-topbar-sub">Painel Administrativo</span>
      </div>
    </div>
    <div class="admin-topbar-right">
      <button class="admin-topbar-btn" onclick="window.PortalAdmin?.refresh?.()" title="Atualizar">🔄</button>
      <a href="../../index.html" class="admin-topbar-btn" title="Voltar ao CRM">🏠</a>
    </div>
  </header>

  <!-- ===== ABAS ===== -->
  <nav class="admin-tabs" id="admin-tabs">
    <button class="admin-tab active" data-tab="central" onclick="window.PortalAdmin?.navegar?.('central')">
      <span class="tab-icon">🏠</span>
      <span class="tab-label">Central</span>
    </button>
    <button class="admin-tab" data-tab="mensagens" onclick="window.PortalAdmin?.navegar?.('mensagens')">
      <span class="tab-icon">💬</span>
      <span class="tab-label">Mensagens</span>
      <span class="tab-badge" id="badge-mensagens" style="display:none;">0</span>
    </button>
    <button class="admin-tab" data-tab="avaliacoes" onclick="window.PortalAdmin?.navegar?.('avaliacoes')">
      <span class="tab-icon">⭐</span>
      <span class="tab-label">Avaliações</span>
    </button>
    <button class="admin-tab" data-tab="solicitacoes" onclick="window.PortalAdmin?.navegar?.('solicitacoes')">
      <span class="tab-icon">🔧</span>
      <span class="tab-label">Solicitações</span>
      <span class="tab-badge" id="badge-solicitacoes" style="display:none;">0</span>
    </button>
    <button class="admin-tab" data-tab="estatisticas" onclick="window.PortalAdmin?.navegar?.('estatisticas')">
      <span class="tab-icon">📊</span>
      <span class="tab-label">Estatísticas</span>
    </button>
  </nav>

  <!-- ===== CONTEÚDO ===== -->
  <main class="admin-content" id="admin-content">
    <div class="admin-loading">
      <span class="spinner"></span>
      <p>Carregando Painel Administrativo...</p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="admin-footer">
    <span>Cell City Informática © <span id="admin-year">2026</span></span>
    <span class="admin-footer-sep">|</span>
    <span>Portal do Cliente — v2.0</span>
  </footer>

  <script type="module">
    // ===== FIREBASE INIT =====
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import {
      getFirestore,
      collection, query, where, getDocs, onSnapshot,
      addDoc, doc, updateDoc, deleteDoc, orderBy, serverTimestamp
    } from 'firebase/firestore';

    const firebaseConfig = {
      apiKey: "AIzaSyDjL0iFTJ_2mIJjSMdYxUcBSG-OaABH-yQ",
      authDomain: "cellcity-crm.firebaseapp.com",
      projectId: "cellcity-crm",
      storageBucket: "cellcity-crm.firebasestorage.app",
      messagingSenderId: "52486693325",
      appId: "1:52486693325:web:33b53a088c9fe3a10e9585"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Expõe globais para admin.js (não-module)
    window.db = db;
    window.FirebaseModules = {
      collection, query, where, getDocs, onSnapshot,
      addDoc, doc, updateDoc, deleteDoc, orderBy, serverTimestamp
    };

    // Auth anônima
    window.authReady = false;
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        try {
          await signInAnonymously(auth);
        } catch (err) {
          console.error('[Admin] Erro auth:', err);
          window.authReady = true;
          window.dispatchEvent(new Event('admin-firebase-ready'));
        }
      } else {
        window.authReady = true;
        window.dispatchEvent(new Event('admin-firebase-ready'));
      }
    });
  </script>

  <script src="admin.js?v=2.1"></script>
</body>
</html>
