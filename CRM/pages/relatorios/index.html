<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta &amp; Evolução — Cell City CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="relatorios.css">
  <link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>

<!-- brand-header.js migra este header para #crm-brand-bar e centraliza .header-title -->
<header>
  <span class="header-title">📊 Meta &amp; Evolução</span>
</header>

<!-- ============================================================
     PAINEL GERENCIAL — SEMPRE VISÍVEL
     ============================================================ -->
<div class="painel" id="painel">

  <!-- Mês / Ano -->
  <div class="painel-mes-header" id="painel-mes-header">Carregando...</div>

  <!-- CRESCIMENTO — número principal, maior destaque -->
  <div class="painel-cresc-bloco">
    <div class="painel-cresc-num" id="painel-cresc-num">—</div>
    <div class="painel-cresc-label">crescimento</div>
  </div>

  <!-- Comparação lado a lado -->
  <div class="painel-vs">
    <div class="painel-vs-item painel-vs-ant">
      <div class="painel-vs-label" id="vs-ant-label">—</div>
      <div class="painel-vs-valor" id="vs-ant-valor">—</div>
    </div>
    <div class="painel-vs-sep">vs</div>
    <div class="painel-vs-item painel-vs-atual">
      <div class="painel-vs-label" id="vs-atual-label">—</div>
      <div class="painel-vs-valor" id="vs-atual-valor">—</div>
    </div>
  </div>

  <!-- Divisor -->
  <div class="painel-divisor"></div>

  <!-- Meta automática -->
  <div class="painel-meta" id="painel-meta">

    <div class="meta-top">
      <div class="meta-top-left">
        <span class="meta-badge">🤖 Meta automática</span>
        <span class="meta-num" id="meta-num">—</span>
      </div>
      <span class="meta-base" id="meta-base">—</span>
    </div>

    <div class="meta-barra-wrap">
      <div class="meta-barra-track">
        <div class="meta-barra-fill" id="meta-barra-fill" style="width:0%"></div>
      </div>
      <span class="meta-barra-pct" id="meta-barra-pct">0%</span>
    </div>

    <div class="meta-rodape">
      <span class="meta-status" id="meta-status"></span>
      <span class="meta-pdia"  id="meta-pdia"></span>
    </div>

  </div>

  <!-- Sem dados -->
  <div class="painel-sem-dados" id="painel-sem-dados" style="display:none">
    ⚠️ Dados insuficientes — continue usando o sistema para gerar histórico
  </div>

</div>

<!-- ============================================================
     TOOLBAR: seleção de anos para os gráficos
     ============================================================ -->
<div class="charts-toolbar">
  <span class="charts-toolbar-label">Comparar anos:</span>
  <div class="anos-lista" id="anos-lista">
    <span class="anos-loading">carregando...</span>
  </div>
</div>

<!-- ============================================================
     GRÁFICOS — janela 6 meses com mês atual centralizado
     ============================================================ -->
<div class="graficos-area">

  <div class="grafico-card">
    <div class="grafico-card-top">
      <span class="grafico-titulo">Faturamento — 6 meses</span>
      <div class="grafico-legenda" id="legenda-fat"></div>
    </div>
    <div class="grafico-destaque" id="grafico-destaque-fat"></div>
    <div class="grafico-wrap">
      <canvas id="chart-fat"></canvas>
    </div>
  </div>

  <div class="grafico-card">
    <div class="grafico-card-top">
      <span class="grafico-titulo">OS abertas — 6 meses</span>
      <div class="grafico-legenda" id="legenda-os"></div>
    </div>
    <div class="grafico-destaque" id="grafico-destaque-os"></div>
    <div class="grafico-wrap">
      <canvas id="chart-os"></canvas>
    </div>
  </div>

</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-txt">Carregando dados...</div>
</div>

<script type="module" src="relatorios.js"></script>
<script src="../../shared/brand-header.js"></script>
<script src="../../shared/favoritos.js"></script>
<script src="../../shared/dock.js" type="module"></script>
</body>
</html>
