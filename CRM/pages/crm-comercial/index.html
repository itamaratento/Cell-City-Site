<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
<title>CRM Comercial — Cell City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="crm.css">
<link rel="stylesheet" href="../../shared/dock.css">
</head>
<body>

<!-- HEADER (migrado para brand-bar pelo brand-header.js) -->
<header id="mainHeader">
  <h1 id="headerTitle">🎯 CRM Comercial</h1>
</header>

<!-- CONTEÚDO PRINCIPAL -->
<div class="crm-wrap">
  <div class="crm-main">

    <!-- Stats -->
    <div class="stats-bar" id="stats-bar"></div>

    <!-- Busca -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Buscar por nome, telefone, aparelho..." oninput="onSearchInput(this.value)">
    </div>

    <!-- Filtros de status -->
    <div class="filter-tabs" id="filter-tabs"></div>

    <!-- Lista de leads -->
    <div class="leads-grid" id="leads-list">
      <div class="empty-state">
        <span class="empty-icon">🎯</span>
        <h3>Carregando leads...</h3>
        <p>Conectando ao banco de dados.</p>
      </div>
    </div>

  </div>
</div>

<!-- FAB: novo lead -->
<button class="fab" onclick="openModal()" title="Novo Lead">+</button>

<!-- ══════════════ MODAL: Novo / Editar Lead ══════════════ -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">

    <div class="modal-header">
      <span class="modal-title" id="modal-title">➕ Novo Lead</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <form class="modal-body" onsubmit="submitForm(event)">

      <div class="form-row">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" id="f-nome" placeholder="Nome do cliente" required>
        </div>
        <div class="form-group">
          <label>Telefone *</label>
          <input type="tel" id="f-telefone" placeholder="(62) 99999-9999" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Aparelho / Produto</label>
          <input type="text" id="f-aparelho" placeholder="Ex: iPhone 13, Notebook Dell">
        </div>
        <div class="form-group">
          <label>Valor informado (R$)</label>
          <input type="number" id="f-valor" placeholder="0,00" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>

      <div class="form-group">
        <label>Serviço solicitado</label>
        <input type="text" id="f-servico" placeholder="Ex: Troca de tela, Formatação...">
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="f-status">
          <option value="novo_contato">Novo Contato</option>
          <option value="orcamento_enviado">Orçamento Enviado</option>
          <option value="aguardando_resposta">Aguardando Resposta</option>
          <option value="negociacao">Negociação</option>
          <option value="fechado">Fechado ✅</option>
          <option value="perdido">Perdido ❌</option>
        </select>
      </div>

      <div class="form-group">
        <label>Observações</label>
        <textarea id="f-obs" placeholder="Detalhes relevantes da negociação..."></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn-primary">Salvar Lead</button>
      </div>

    </form>
  </div>
</div>

<!-- ══════════════ PAINEL DE DETALHE ══════════════ -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>

<div class="detail-panel" id="detail-panel">
  <div class="detail-header">
    <span class="detail-title">📋 Detalhes do Lead</span>
    <button class="modal-close" onclick="closeDetail()">✕</button>
  </div>
  <div class="detail-body" id="detail-body"></div>
  <div class="detail-footer" id="detail-footer"></div>
</div>

<!-- Toast -->
<div class="crm-toast" id="crm-toast"></div>

<!-- Scripts compartilhados -->
<script src="../../shared/brand-header.js"></script>
<script src="../../shared/sidebar.js"></script>
<script type="module" src="../../shared/dock.js"></script>
<script type="module" src="crm.js"></script>

</body>
</html>
