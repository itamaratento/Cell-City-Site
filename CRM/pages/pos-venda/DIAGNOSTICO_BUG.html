<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Diagnóstico Bug - Copiar Mensagem</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: monospace;
            background: #0a0b0d;
            color: #f5f7fa;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #00e676; margin-bottom: 20px; }
        .section {
            background: #1a1d23;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #00c853;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid rgba(0,200,83,0.2);
            padding-bottom: 10px;
        }
        .log-line {
            padding: 8px;
            margin-bottom: 6px;
            border-left: 3px solid transparent;
            border-radius: 4px;
            font-size: 12px;
        }
        .success { border-left-color: #00c853; background: rgba(0,200,83,0.05); }
        .error { border-left-color: #ef4444; background: rgba(239,68,68,0.05); }
        .warning { border-left-color: #f59e0b; background: rgba(245,158,11,0.05); }
        .info { border-left-color: #3b82f6; background: rgba(59,130,246,0.05); }
        button {
            background: #00c853;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px 10px 0;
        }
        button:hover { background: #00e676; }
        code {
            background: rgba(0,200,83,0.1);
            padding: 2px 6px;
            border-radius: 3px;
        }
        .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 DIAGNÓSTICO COMPLETO — BUG "COPIAR MENSAGEM"</h1>

        <div class="section">
            <h2>📊 1. Verificar Firestore</h2>
            <div id="firestore-logs"></div>
        </div>

        <div class="section">
            <h2>📦 2. Verificar JavaScript (window.mensagensPosvenda)</h2>
            <div id="js-logs"></div>
        </div>

        <div class="section">
            <h2>🎯 3. Verificar Função copiarMensagem()</h2>
            <div id="function-logs"></div>
        </div>

        <div class="section">
            <h2>🧪 4. Teste Prático do Botão</h2>
            <div id="test-logs"></div>
            <button onclick="testarBotaoPratico()">▶️ Testar Botão Copiar Mensagem</button>
        </div>

        <div class="section">
            <h2>✅ 5. Resumo Final</h2>
            <div id="summary-logs"></div>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs } from "../../scripts/firebase.js";

        function addLog(containerId, msg, type = 'info') {
            const container = document.getElementById(containerId);
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = msg;
            container.appendChild(line);
            console.log(msg);
        }

        window.teste = async function() {
            // PASSO 1: Firestore
            addLog('firestore-logs', '🔄 Conectando ao Firestore...', 'info');
            try {
                const snap = await getDocs(collection(db, "posvenda_mensagens"));

                if (snap.empty) {
                    addLog('firestore-logs', '❌ ERRO: Coleção posvenda_mensagens VAZIA', 'error');
                    addLog('firestore-logs', '⚠️  Ação: Execute init-posvenda-mensagens.js', 'warning');
                } else {
                    addLog('firestore-logs', `✅ Coleção encontrada: ${snap.size} documentos`, 'success');

                    snap.forEach(doc => {
                        const data = doc.data();
                        const msg = data.mensagem;

                        if (!msg || msg.trim().length === 0) {
                            addLog('firestore-logs', `❌ Doc ${doc.id}: VAZIO`, 'error');
                        } else {
                            addLog('firestore-logs', `✅ Doc ${doc.id}: "${msg.substring(0, 50)}..."`, 'success');
                        }
                    });
                }
            } catch (err) {
                addLog('firestore-logs', `❌ ERRO Firestore: ${err.message}`, 'error');
            }

            addLog('firestore-logs', '', 'info');

            // PASSO 2: JavaScript
            addLog('js-logs', '🔄 Verificando window.mensagensPosvenda...', 'info');

            if (!window.mensagensPosvenda) {
                addLog('js-logs', '❌ ERRO: window.mensagensPosvenda é undefined', 'error');
            } else {
                addLog('js-logs', '✅ window.mensagensPosvenda encontrado', 'success');

                [5, 15, 30].forEach(prazo => {
                    const msg = window.mensagensPosvenda[prazo];
                    if (!msg || msg.trim().length === 0) {
                        addLog('js-logs', `❌ Prazo ${prazo}: VAZIO`, 'error');
                    } else {
                        addLog('js-logs', `✅ Prazo ${prazo}: "${msg.substring(0, 50)}..."`, 'success');
                    }
                });
            }

            addLog('js-logs', '', 'info');

            // PASSO 3: Função
            addLog('function-logs', '🔄 Verificando função copiarMensagem()...', 'info');

            if (typeof window.copiarMensagem !== 'function') {
                addLog('function-logs', '❌ ERRO: copiarMensagem não é função', 'error');
            } else {
                addLog('function-logs', '✅ Função copiarMensagem() encontrada', 'success');

                // Teste da função
                const testMsg = window.mensagensPosvenda[5];
                if (testMsg) {
                    const replaced = testMsg.replace('{{nome}}', 'TESTE').replace('{{modelo}}', 'MODELO');
                    addLog('function-logs', `✅ Substituição funciona: "${replaced.substring(0, 50)}..."`, 'success');
                } else {
                    addLog('function-logs', '❌ Mensagem vazia, não é possível testar substituição', 'error');
                }
            }

            addLog('function-logs', '', 'info');

            // PASSO 4: Cards
            addLog('test-logs', '🔄 Verificando cards...', 'info');
            const cards = document.querySelectorAll('.pv-card');
            addLog('test-logs', `✅ ${cards.length} cards encontrados`, 'success');

            if (cards.length > 0) {
                const card = cards[0];
                const prazo = parseInt(card.dataset.prazo);
                addLog('test-logs', `Card 1: prazo=${prazo}`, 'info');

                const btnCopy = card.querySelector('.pv-copy-btn');
                if (btnCopy) {
                    addLog('test-logs', '✅ Botão 💬 Copiar encontrado', 'success');
                } else {
                    addLog('test-logs', '❌ Botão 💬 Copiar NÃO encontrado', 'error');
                }
            }

            addLog('test-logs', '', 'info');

            // RESUMO
            const hasMsgs = window.mensagensPosvenda &&
                           window.mensagensPosvenda[5] &&
                           window.mensagensPosvenda[15] &&
                           window.mensagensPosvenda[30];

            const hasFunc = typeof window.copiarMensagem === 'function';
            const hasCards = cards.length > 0;

            addLog('summary-logs', '', 'info');
            if (hasMsgs && hasFunc && hasCards) {
                addLog('summary-logs', '✅ TUDO OK! Sistema pronto', 'success');
                addLog('summary-logs', '', 'info');
                addLog('summary-logs', '💡 Teste prático:', 'info');
                addLog('summary-logs', '1. Clique em "▶️ Testar Botão Copiar Mensagem"', 'info');
                addLog('summary-logs', '2. O console mostrará o que foi copiado', 'info');
            } else {
                addLog('summary-logs', '❌ PROBLEMA IDENTIFICADO:', 'error');
                if (!hasMsgs) addLog('summary-logs', '   ❌ Mensagens não carregadas/vazias', 'error');
                if (!hasFunc) addLog('summary-logs', '   ❌ Função copiarMensagem não encontrada', 'error');
                if (!hasCards) addLog('summary-logs', '   ❌ Nenhum card de atendimento', 'error');
            }
        };

        window.testarBotaoPratico = function() {
            addLog('test-logs', '🧪 Testando botão...', 'info');

            const cards = document.querySelectorAll('.pv-card');
            if (cards.length === 0) {
                addLog('test-logs', '❌ Nenhum card encontrado. Abra a página de Pós-venda primeiro', 'error');
                return;
            }

            const card = cards[0];
            const prazo = parseInt(card.dataset.prazo);
            const btnCopy = card.querySelector('.pv-copy-btn');

            if (!btnCopy) {
                addLog('test-logs', '❌ Botão não encontrado', 'error');
                return;
            }

            // Simular o que o botão deveria fazer
            const os = window.pendentes[prazo]?.find(o => o.osId === card.dataset.osid);

            if (!os) {
                addLog('test-logs', '❌ OS não encontrada em pendentes', 'error');
                return;
            }

            addLog('test-logs', `✅ OS encontrada: ${os.osId}`, 'success');
            addLog('test-logs', `   Nome: ${os.clientName}`, 'info');
            addLog('test-logs', `   Modelo: ${os.model}`, 'info');
            addLog('test-logs', `   Telefone: ${os.phone}`, 'info');
            addLog('test-logs', `   Prazo: ${prazo}`, 'info');

            // Verificar mensagem
            const msg = window.mensagensPosvenda[prazo];
            if (!msg) {
                addLog('test-logs', `❌ Mensagem para prazo ${prazo} não encontrada`, 'error');
                return;
            }

            const msgProcessada = msg.replace('{{nome}}', os.clientName).replace('{{modelo}}', os.model);

            addLog('test-logs', '', 'info');
            addLog('test-logs', '📋 Mensagem que DEVERIA ser copiada:', 'info');
            addLog('test-logs', msgProcessada, 'success');

            addLog('test-logs', '', 'info');
            addLog('test-logs', '💡 Próximo passo: Clique no botão 💬 Copiar e veja o que é copiado', 'warning');
        };

        // Auto-executar ao carregar
        window.addEventListener('load', window.teste);
    </script>
</body>
</html>
