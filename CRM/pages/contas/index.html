<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace('/CRM/login.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell City — Contas & Números</title>
    <link rel="stylesheet" href="contas.css">
</head>
<body>

    <!-- ===== TELA: LISTA ===== -->
    <div id="view-lista" class="view active">

        <header class="header">
            <button class="back-btn" onclick="history.back()">←</button>
            <div class="header-center">
                <h1>📇 Contas & Números</h1>
                <p class="header-sub">Chips, e-mails, perfis e contas da Cell City.</p>
            </div>
            <button class="add-btn" onclick="Contas.abrirNovo()">+</button>
        </header>

        <div class="toolbar">
            <input class="search-input" id="search-input" type="search" placeholder="🔍 Pesquisar por nome, número ou e-mail..." oninput="Contas.filtrar()">
        </div>

        <div class="lista" id="lista"></div>

    </div>

    <!-- ===== TELA: FORMULÁRIO (novo / editar) ===== -->
    <div id="view-form" class="view">

        <header class="header">
            <button class="back-btn" onclick="Contas.voltarLista()">←</button>
            <div class="header-center">
                <h1 id="form-titulo">Nova Conta</h1>
            </div>
            <button class="save-btn" onclick="Contas.salvar()">Salvar</button>
        </header>

        <div class="form-body">
            <input type="hidden" id="form-id">

            <div class="field-group">
                <label class="field-label">Nome *</label>
                <input class="field-input" id="f-nome" placeholder="Ex: Chip Principal, WhatsApp Loja..." maxlength="80">
            </div>

            <div class="field-group">
                <label class="field-label">Número</label>
                <input class="field-input" id="f-numero" placeholder="Ex: (11) 9 9999-0000" type="tel" maxlength="20">
            </div>

            <div class="field-group">
                <label class="field-label">Chip</label>
                <input class="field-input" id="f-chip" placeholder="Ex: Claro pré-pago, SIM física..." maxlength="60">
            </div>

            <div class="field-group">
                <label class="field-label">Operadora</label>
                <input class="field-input" id="f-operadora" placeholder="Ex: Claro, Vivo, Tim..." maxlength="40">
            </div>

            <div class="field-group">
                <label class="field-label">WhatsApp</label>
                <input class="field-input" id="f-whatsapp" placeholder="Ex: (11) 9 9999-0000" type="tel" maxlength="20">
            </div>

            <div class="field-group">
                <label class="field-label">E-mail vinculado</label>
                <input class="field-input" id="f-email" placeholder="Ex: contato@cellcity.com.br" type="email" maxlength="100">
            </div>

            <div class="field-group">
                <label class="field-label">Perfil vinculado</label>
                <input class="field-input" id="f-perfil" placeholder="Ex: Meta Business, Google Ads..." maxlength="80">
            </div>

            <div class="field-group">
                <label class="field-label">Função</label>
                <input class="field-input" id="f-funcao" placeholder="Ex: Atendimento ao cliente" maxlength="100">
            </div>

            <div class="field-group">
                <label class="field-label">Observação</label>
                <textarea class="field-input field-textarea" id="f-obs" placeholder="Informações adicionais..." maxlength="400" rows="3"></textarea>
            </div>
        </div>

    </div>

    <!-- ===== TELA: DETALHE ===== -->
    <div id="view-detalhe" class="view">

        <header class="header">
            <button class="back-btn" onclick="Contas.voltarLista()">←</button>
            <div class="header-center">
                <h1 id="det-nome">—</h1>
            </div>
            <button class="edit-btn" onclick="Contas.abrirEdicao()">Editar</button>
        </header>

        <div class="detalhe-body" id="detalhe-body"></div>

        <div class="detalhe-footer">
            <button class="btn-excluir" onclick="Contas.excluir()">🗑 Excluir</button>
        </div>

    </div>

    <div class="toast hidden" id="toast"></div>

    <script type="module" src="contas.js"></script>
<script src="../../shared/obs-expand.js?v=20260612-1"></script>
</body>
</html>
