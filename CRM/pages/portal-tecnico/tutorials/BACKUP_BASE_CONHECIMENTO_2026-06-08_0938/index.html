<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tutoriais - Portal Técnico</title>
    <link rel="stylesheet" href="../portal-tecnico.css">
    <link rel="stylesheet" href="tutorials.css">
    <link rel="stylesheet" href="../../../shared/dock.css">
</head>
<body>
    <header class="header">
        <a class="tut-back" href="../index.html" title="Voltar ao Portal Técnico">‹ Portal Técnico</a>
        <span class="header-title">🎥 Tutoriais</span>
        <span class="tut-header-spacer"></span>
    </header>

    <div class="pt-screen">
        <!-- BUSCA -->
        <div class="pt-search" role="search">
            <span class="pt-search-icon">🔍</span>
            <input type="text" id="tut-busca" placeholder="Pesquisar tutoriais (modelo, marca, peça)..." oninput="tutBuscar()" autocomplete="off" aria-label="Pesquisar tutoriais">
        </div>

        <!-- CONTEÚDO (categorias / lista / detalhe — renderizado por JS) -->
        <div id="tut-view"></div>
    </div>

    <div class="pt-toast" id="pt-toast"></div>

    <script src="../../../shared/brand-header.js"></script>
    <script type="module" src="../../../shared/dock.js"></script>
    <script>
    (function () {
        // ===== Categorias =====
        var CATS = [
            { key: 'tela',        icon: '📱', label: 'Troca de Tela' },
            { key: 'bateria',     icon: '🔋', label: 'Troca de Bateria' },
            { key: 'conector',    icon: '🔌', label: 'Conector de Carga' },
            { key: 'audio',       icon: '🎧', label: 'Áudio e Microfone' },
            { key: 'cameras',     icon: '📷', label: 'Câmeras' },
            { key: 'molhados',    icon: '💧', label: 'Aparelhos Molhados' },
            { key: 'desmontagem', icon: '🛠️', label: 'Desmontagem' },
            { key: 'softwares',   icon: '💻', label: 'Softwares e Ferramentas' }
        ];

        // ===== Conteúdo demonstrativo (fictício — apenas validação de estrutura) =====
        var TUTORIAIS = [
            {
                id: 't1', cat: 'tela', titulo: 'Troca de Tela', marca: 'Motorola', modelo: 'Moto G54', data: '08/06/2026',
                descricao: 'Procedimento completo de substituição do display (frontal) do Moto G54 5G.',
                youtubeId: 'dQw4w9WgXcQ',
                passos: [
                    'Desligue o aparelho e remova o chip/SD.',
                    'Aqueça as bordas (≈80°C) para amolecer a cola.',
                    'Use ventosa + palheta para abrir a tela com cuidado.',
                    'Desconecte os flexes do display e da bateria.',
                    'Instale o novo display, teste antes de colar.',
                    'Reaplique cola/adesivo e pressione as bordas.'
                ],
                observacoes: 'Conteúdo fictício para validação da estrutura. Teste touch e brilho antes de fechar.',
                atualizacoes: ''
            },
            {
                id: 't2', cat: 'bateria', titulo: 'Troca de Bateria', marca: 'Samsung', modelo: 'Galaxy A15', data: '08/06/2026',
                descricao: 'Substituição da bateria do Galaxy A15 com remoção segura do adesivo.',
                youtubeId: 'dQw4w9WgXcQ',
                passos: [
                    'Abra a tampa traseira aquecendo as bordas.',
                    'Remova os parafusos do suporte e a antena.',
                    'Solte o adesivo da bateria puxando as abas.',
                    'Desconecte o flex da bateria da placa.',
                    'Instale a nova bateria e reconecte o flex.',
                    'Calibre carregando até 100% após a montagem.'
                ],
                observacoes: 'Conteúdo fictício. Nunca perfure a bateria; use ferramenta plástica.',
                atualizacoes: ''
            },
            {
                id: 't3', cat: 'conector', titulo: 'Troca do Conector de Carga', marca: 'Apple', modelo: 'iPhone 11', data: '08/06/2026',
                descricao: 'Substituição do flex do conector de carga (placa de carga) do iPhone 11.',
                youtubeId: 'dQw4w9WgXcQ',
                passos: [
                    'Remova os 2 parafusos pentalobe inferiores.',
                    'Abra a tela com ventosa e desconecte as baterias/flexes.',
                    'Retire o alto-falante e os suportes.',
                    'Solte o flex do conector e a antena inferior.',
                    'Instale o novo flex e refaça a vedação.',
                    'Teste carga e microfone inferior antes de fechar.'
                ],
                observacoes: 'Conteúdo fictício. Verifique impermeabilização ao fechar.',
                atualizacoes: ''
            }
        ];

        var view, busca, toast;
        function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }
        function catLabel(key) { var c = CATS.find(function (x) { return x.key === key; }); return c ? (c.icon + ' ' + c.label) : key; }
        function countCat(key) { return TUTORIAIS.filter(function (t) { return t.cat === key; }).length; }

        // ===== HOME: categorias =====
        function renderHome() {
            var html = '<div class="pt-grid tut-cats">';
            CATS.forEach(function (c) {
                var n = countCat(c.key);
                html += '<button class="pt-card" onclick="tutAbrirCat(\'' + c.key + '\')">'
                    + '<span class="pt-card-icon">' + c.icon + '</span>'
                    + '<span class="pt-card-body"><span class="pt-card-title">' + esc(c.label) + '</span>'
                    + '<span class="pt-card-desc">' + (n ? (n + ' tutorial' + (n > 1 ? 'is' : '')) : 'Sem tutoriais ainda') + '</span></span>'
                    + '</button>';
            });
            html += '</div>';
            view.innerHTML = html;
        }

        // ===== LISTA por categoria (ou resultados de busca) =====
        function listItemHTML(t) {
            return '<button class="tut-list-item" onclick="tutAbrir(\'' + t.id + '\')">'
                + '<div class="tut-li-main">'
                + '<div class="tut-li-titulo">' + esc(t.titulo) + '</div>'
                + '<div class="tut-li-meta">' + esc(t.marca) + ' • ' + esc(t.modelo) + ' • ' + esc(t.data) + '</div>'
                + '<div class="tut-li-desc">' + esc(t.descricao) + '</div>'
                + '<span class="tut-cat-badge">' + catLabel(t.cat) + '</span>'
                + '</div><span class="tut-li-chevron">›</span></button>';
        }

        function renderCat(key) {
            var itens = TUTORIAIS.filter(function (t) { return t.cat === key; });
            var html = '<div class="tut-back-row"><button class="tut-voltar" onclick="tutHome()">‹ Categorias</button>'
                + '<span class="tut-cat-titulo">' + catLabel(key) + '</span></div>';
            if (!itens.length) {
                html += '<div class="tut-empty">Nenhum tutorial nesta categoria ainda.</div>';
            } else {
                html += '<div class="tut-list">' + itens.map(listItemHTML).join('') + '</div>';
            }
            view.innerHTML = html;
        }

        function renderBusca(termo) {
            var t = termo.toLowerCase();
            var itens = TUTORIAIS.filter(function (x) {
                return (x.titulo + ' ' + x.descricao + ' ' + x.marca + ' ' + x.modelo + ' ' + catLabel(x.cat)).toLowerCase().indexOf(t) >= 0;
            });
            var html = '<div class="tut-back-row"><span class="tut-cat-titulo">Resultados para "' + esc(termo) + '"</span></div>';
            if (!itens.length) html += '<div class="tut-empty">Nenhum tutorial encontrado.</div>';
            else html += '<div class="tut-list">' + itens.map(listItemHTML).join('') + '</div>';
            view.innerHTML = html;
        }

        // ===== DETALHE =====
        function renderDetail(id) {
            var t = TUTORIAIS.find(function (x) { return x.id === id; });
            if (!t) { renderHome(); return; }
            var passos = (t.passos || []).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('');
            var html = '<div class="tut-back-row"><button class="tut-voltar" onclick="tutAbrirCat(\'' + t.cat + '\')">‹ ' + esc(catLabel(t.cat)) + '</button></div>'
                + '<div class="tut-detail">'
                + '<h2 class="tut-detail-title">' + esc(t.titulo) + '</h2>'
                + '<div class="tut-badges">'
                + '<span class="tut-badge">🏷️ ' + esc(t.marca) + '</span>'
                + '<span class="tut-badge">📱 ' + esc(t.modelo) + '</span>'
                + '<span class="tut-badge">📅 ' + esc(t.data) + '</span>'
                + '</div>'
                + '<p class="tut-desc">' + esc(t.descricao) + '</p>'
                + '<div class="tut-sec-title">🎥 Vídeo</div>'
                + '<div class="tut-video"><iframe src="https://www.youtube.com/embed/' + encodeURIComponent(t.youtubeId) + '" title="' + esc(t.titulo) + '" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>'
                + '<div class="tut-sec-title">📝 Passo a passo</div>'
                + '<ol class="tut-steps">' + passos + '</ol>'
                + '<div class="tut-sec-title">⚠️ Observações técnicas</div>'
                + '<div class="tut-obs">' + esc(t.observacoes || '—') + '</div>'
                + '<div class="tut-sec-title">🔄 Atualizações</div>'
                + '<div class="tut-obs tut-obs-muted">' + (t.atualizacoes ? esc(t.atualizacoes) : 'Nenhuma atualização registrada. (Espaço reservado para futuras atualizações.)') + '</div>'
                + '</div>';
            view.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== Navegação =====
        function tutHome() { if (busca) busca.value = ''; renderHome(); }
        function tutAbrirCat(key) { if (busca) busca.value = ''; renderCat(key); }
        function tutAbrir(id) { renderDetail(id); }
        function tutBuscar() {
            var termo = (busca.value || '').trim();
            if (termo) renderBusca(termo); else renderHome();
        }
        window.tutHome = tutHome; window.tutAbrirCat = tutAbrirCat; window.tutAbrir = tutAbrir; window.tutBuscar = tutBuscar;

        document.addEventListener('DOMContentLoaded', function () {
            view = document.getElementById('tut-view');
            busca = document.getElementById('tut-busca');
            toast = document.getElementById('pt-toast');
            renderHome();
        });
    })();
    </script>
</body>
</html>
