<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;var _p=location.pathname;var _dev=(_p==='/dev'||_p.indexOf('/dev/')===0);if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace((_dev?'/dev':'')+'/CRM/login.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Softwares, Drivers e Ferramentas - Portal Técnico</title>
    <link rel="stylesheet" href="../portal-tecnico.css">
    <link rel="stylesheet" href="softwares.css">
    <link rel="stylesheet" href="../../../shared/dock.css">
</head>
<body>
    <header class="header">
        <a class="sw-back" href="../index.html" title="Voltar ao Portal Técnico">‹ Portal Técnico</a>
        <span class="header-title">🛠 Softwares, Drivers e Ferramentas</span>
        <span class="sw-header-spacer"></span>
    </header>

    <div class="pt-screen">
        <div class="pt-search" role="search">
            <span class="pt-search-icon">🔍</span>
            <input type="text" id="sw-busca" placeholder="Pesquisar: SamFW, Odin, Driver Samsung, ADB..." oninput="swBuscar()" autocomplete="off" aria-label="Pesquisar softwares">
        </div>
        <div id="sw-view"></div>
    </div>

    <!-- MODAL: CADASTRO / EDIÇÃO -->
    <div class="sw-modal-overlay" id="sw-modal" aria-hidden="true">
        <div class="sw-modal">
            <div class="sw-modal-head">
                <span id="sw-modal-title">➕ Novo Software</span>
                <button class="sw-modal-close" onclick="swFecharForm()" aria-label="Fechar">✕</button>
            </div>
            <div class="sw-modal-body">
                <input type="hidden" id="f-id">
                <div class="sw-fg"><label>Nome do Software *</label><input type="text" id="f-nome" placeholder="Ex: SamFW"></div>
                <div class="sw-fg-row">
                    <div class="sw-fg"><label>Categoria *</label><select id="f-categoria"></select></div>
                    <div class="sw-fg"><label>Status</label><select id="f-status"></select></div>
                </div>
                <div class="sw-fg"><label>Descrição</label><textarea id="f-desc" rows="2" placeholder="Para que serve este software/driver/ferramenta..."></textarea></div>
                <div class="sw-fg-row">
                    <div class="sw-fg"><label>Versão</label><input type="text" id="f-versao" placeholder="Ex: 4.2.0"></div>
                    <div class="sw-fg"><label>Fabricante</label><input type="text" id="f-fabricante" placeholder="Ex: Samsung"></div>
                </div>
                <div class="sw-fg-row">
                    <div class="sw-fg"><label>Link Oficial</label><input type="text" id="f-link-oficial" placeholder="https://..."></div>
                    <div class="sw-fg"><label>Link Alternativo</label><input type="text" id="f-link-alt" placeholder="https://..."></div>
                </div>
                <div class="sw-fg"><label>⚠️ Observações Técnicas</label><textarea id="f-obs" rows="2" placeholder="Compatibilidade, requisitos, instalação, cuidados..."></textarea></div>
                <div class="sw-fg"><label>Tags (separadas por vírgula)</label><input type="text" id="f-tags" placeholder="frp, samsung, usb, driver..."></div>
            </div>
            <div class="sw-modal-foot">
                <button class="sw-btn-cancel" onclick="swFecharForm()">Cancelar</button>
                <button class="sw-btn-save" onclick="swSalvar()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <div class="sw-toast" id="sw-toast"></div>

    <script src="../../../shared/brand-header.js"></script>
    <script type="module" src="../../../shared/dock.js"></script>
    <script>
    (function () {
        'use strict';

        var STORAGE_KEY = 'cc_pt_softwares';

        var CATS = [
            { key: 'frp',          icon: '📱', label: 'FRP e Contas' },
            { key: 'flash',        icon: '💻', label: 'Flash e Firmware' },
            { key: 'drivers',      icon: '🔌', label: 'Drivers' },
            { key: 'apks',         icon: '📦', label: 'APKs' },
            { key: 'utilitarios',  icon: '🛠', label: 'Utilitários' },
            { key: 'samsung',      icon: '📲', label: 'Samsung' },
            { key: 'motorola',     icon: '📲', label: 'Motorola' },
            { key: 'xiaomi',       icon: '📲', label: 'Xiaomi' }
        ];

        var STATUS = [
            { v: 'ativo',    label: '✅ Ativo', cls: 'sw-st-ok' },
            { v: 'desatualizado', label: '⚠️ Desatualizado', cls: 'sw-st-warn' },
            { v: 'obsoleto', label: '❌ Obsoleto', cls: 'sw-st-err' },
            { v: 'emteste',  label: '🔄 Em Teste', cls: 'sw-st-test' }
        ];

        function hoje() { return new Date().toLocaleDateString('pt-BR'); }

        var SEED = [
            { id: 'sw1', nome: 'SamFW', categoria: 'frp', desc: 'Ferramenta para bypass de FRP em dispositivos Samsung. Suporta diversos modelos e versões Android.',
              versao: '4.2.0', fabricante: 'SamFW Dev', linkOficial: 'https://samfw.com', linkAlt: '',
              obs: 'Necessário driver Samsung instalado. Testado em Android 13 e 14. Mantenha o Samsung USB Driver atualizado.',
              tags: ['frp', 'samsung', 'bypass', 'conta google'], status: 'ativo',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' },
            { id: 'sw2', nome: 'Odin', categoria: 'flash', desc: 'Ferramenta oficial Samsung para flash de firmwares stock através do modo Download.',
              versao: '3.14.4', fabricante: 'Samsung', linkOficial: 'https://odindownload.com', linkAlt: '',
              obs: 'Usar sempre a versão mais recente. Compatível com todos os Samsung Exynos e Snapdragon. Não desconectar o USB durante o flash.',
              tags: ['samsung', 'flash', 'firmware', 'stock rom'], status: 'ativo',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' },
            { id: 'sw3', nome: 'Samsung USB Driver', categoria: 'drivers', desc: 'Driver USB oficial Samsung para conexão de dispositivos ao PC.',
              versao: '1.7.59', fabricante: 'Samsung', linkOficial: 'https://developer.samsung.com/android-usb-driver', linkAlt: '',
              obs: 'Necessário para Odin, SamFW e ADB. Instalar antes de conectar o aparelho. Compatível com Windows 10 e 11.',
              tags: ['driver', 'samsung', 'usb', 'windows'], status: 'ativo',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' },
            { id: 'sw4', nome: 'Motorola Device Manager', categoria: 'drivers', desc: 'Gerenciador de dispositivos Motorola com drivers USB oficiais.',
              versao: '2.5.4', fabricante: 'Motorola', linkOficial: 'https://en-us.support.motorola.com', linkAlt: '',
              obs: 'Necessário para flash e ADB em dispositivos Motorola. Instalar com o aparelho desconectado.',
              tags: ['driver', 'motorola', 'usb'], status: 'ativo',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' },
            { id: 'sw5', nome: 'ADB Platform Tools', categoria: 'utilitarios', desc: 'Ferramentas de depuração Android (ADB, Fastboot). Essencial para comandos avançados.',
              versao: '35.0.2', fabricante: 'Google', linkOficial: 'https://developer.android.com/studio/releases/platform-tools', linkAlt: '',
              obs: 'Versão mais recente sempre no site oficial. Adicionar ao PATH do Windows. Necessário driver USB do fabricante.',
              tags: ['adb', 'fastboot', 'google', 'depuracao'], status: 'ativo',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' },
            { id: 'sw6', nome: 'MTK Client', categoria: 'flash', desc: 'Ferramenta para flash e reparo em dispositivos com chipset MediaTek (MTK).',
              versao: '2.0.0.3', fabricante: 'MTK Client Dev', linkOficial: '', linkAlt: '',
              obs: 'Funciona apenas com dispositivos MTK. Necessário drivers MediaTek VCom instalados. Modo BROM obrigatório.',
              tags: ['mediatek', 'mtk', 'flash', 'brom'], status: 'ativo',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' },
            { id: 'sw7', nome: 'Chimera', categoria: 'utilitarios', desc: 'Ferramenta multifuncional para reparo de dispositivos Samsung, LG e Nokia.',
              versao: '1.90.0', fabricante: 'Chimera Dev', linkOficial: 'https://chimeratool.com', linkAlt: '',
              obs: 'Ferramenta paga. Suporta FRP, reparo IMEI e remoção de contas. Necessário conexão com internet.',
              tags: ['multifuncional', 'samsung', 'frp', 'imei'], status: 'ativo',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' },
            { id: 'sw8', nome: 'Unlock Tool', categoria: 'frp', desc: 'Ferramenta para bypass de FRP e desbloqueio em dispositivos Android.',
              versao: '4.8.2', fabricante: 'Unlock Tool Dev', linkOficial: '', linkAlt: '',
              obs: 'Suporta diversas marcas. Requer drivers ADB instalados. Testar compatibilidade antes de usar.',
              tags: ['frp', 'unlock', 'bypass', 'android'], status: 'ativo',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' },
            { id: 'sw9', nome: 'Alliance Shield', categoria: 'apks', desc: 'APK para bypass de FRP em dispositivos Samsung. Método alternativo.',
              versao: '3.7', fabricante: 'Alliance Dev', linkOficial: '', linkAlt: '',
              obs: 'Instalar via OTG ou ADB. Pode não funcionar em versões mais recentes do Android. Testar antes de garantir o serviço.',
              tags: ['apk', 'frp', 'samsung', 'bypass'], status: 'emteste',
              dataCadastro: '08/06/2026', ultimaAtualizacao: '08/06/2026' }
        ];

        var view, busca, toast, modal;
        var state = { cat: '', termo: '' };

        function load() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) { var a = JSON.parse(raw); if (Array.isArray(a)) return a; }
            } catch (e) {}
            save(SEED);
            return SEED.slice();
        }
        function save(list) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {} }

        function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }
        function catMeta(k) { return CATS.find(function (c) { return c.key === k; }) || { icon: '📌', label: k }; }
        function statusMeta(v) { return STATUS.find(function (s) { return s.v === v; }) || { label: v, cls: '' }; }
        function toastMsg(m) { if (!toast) return; toast.textContent = m; toast.classList.add('show'); clearTimeout(window.__sw); window.__sw = setTimeout(function () { toast.classList.remove('show'); }, 2500); }

        function filtrados() {
            var list = load();
            var t = (state.termo || '').toLowerCase();
            return list.filter(function (x) {
                if (state.cat && x.categoria !== state.cat) return false;
                if (!t) return true;
                var blob = [x.nome, x.fabricante, x.desc, (x.tags || []).join(' '), x.obs, catMeta(x.categoria).label].join(' ').toLowerCase();
                return blob.indexOf(t) >= 0;
            });
        }

        // ===== HOME =====
        function renderHome() {
            var list = load();
            var chips = '<button class="sw-chip' + (!state.cat ? ' active' : '') + '" onclick="swFiltro(\'\')">Todas (' + list.length + ')</button>';
            CATS.forEach(function (c) {
                var n = list.filter(function (x) { return x.categoria === c.key; }).length;
                chips += '<button class="sw-chip' + (state.cat === c.key ? ' active' : '') + '" onclick="swFiltro(\'' + c.key + '\')">' + c.icon + ' ' + esc(c.label) + ' (' + n + ')</button>';
            });
            var itens = filtrados();
            var lista = itens.length
                ? itens.map(itemHTML).join('')
                : '<div class="sw-empty">Nenhum software encontrado.</div>';
            view.innerHTML =
                '<div class="sw-toolbar">'
                + '<div class="sw-chips">' + chips + '</div>'
                + '<button class="sw-novo-btn" onclick="swNovo()">➕ Novo Software</button>'
                + '</div>'
                + '<div class="sw-list">' + lista + '</div>';
        }

        function itemHTML(s) {
            var st = statusMeta(s.status);
            return '<button class="sw-list-item" onclick="swAbrir(\'' + s.id + '\')">'
                + '<div class="sw-li-main">'
                + '<div class="sw-li-titulo">' + esc(s.nome) + '</div>'
                + '<div class="sw-li-meta">' + esc(s.fabricante || '—') + ' • v' + esc(s.versao || '—') + ' • ' + esc(s.dataCadastro || '') + '</div>'
                + '<div class="sw-li-tagrow">'
                + '<span class="sw-cat-badge">' + catMeta(s.categoria).icon + ' ' + esc(catMeta(s.categoria).label) + '</span>'
                + '<span class="sw-status ' + st.cls + '">' + st.label + '</span>'
                + '</div>'
                + '</div><span class="sw-li-chevron">›</span></button>';
        }

        // ===== DETALHE =====
        function renderDetail(id) {
            var s = load().find(function (x) { return x.id === id; });
            if (!s) { renderHome(); return; }
            var st = statusMeta(s.status);
            var tags = (s.tags || []).map(function (x) { return '<span class="sw-tag">#' + esc(x) + '</span>'; }).join('');

            function linkOuTexto(val) {
                if (!val) return '<span class="sw-obs-muted">—</span>';
                if (val.indexOf('http') === 0) return '<a href="' + esc(val) + '" target="_blank" rel="noopener">' + esc(val) + '</a>';
                return esc(val);
            }

            var html = '<div class="sw-back-row">'
                + '<button class="sw-voltar" onclick="swHome()">‹ Voltar</button>'
                + '<span class="sw-cat-titulo">' + catMeta(s.categoria).icon + ' ' + esc(catMeta(s.categoria).label) + '</span>'
                + '<span class="sw-detail-actions"><button class="sw-mini-btn" onclick="swEditar(\'' + s.id + '\')">✏️ Editar</button><button class="sw-mini-btn sw-mini-del" onclick="swExcluir(\'' + s.id + '\')">🗑️</button></span>'
                + '</div>'
                + '<div class="sw-detail">'
                + '<h2 class="sw-detail-title">🛠 ' + esc(s.nome) + '</h2>'
                + '<div class="sw-badges">'
                + '<span class="sw-badge">' + catMeta(s.categoria).icon + ' ' + esc(catMeta(s.categoria).label) + '</span>'
                + '<span class="sw-badge">🏷️ ' + esc(s.fabricante || '—') + '</span>'
                + '<span class="sw-badge">📦 v' + esc(s.versao || '—') + '</span>'
                + '<span class="sw-status ' + st.cls + '">' + st.label + '</span>'
                + '</div>'
                + (s.desc ? '<div class="sw-sec-title">📋 Descrição</div><p class="sw-desc">' + esc(s.desc) + '</p>' : '')
                + '<div class="sw-sec-title">📌 Informações</div>'
                + '<div class="sw-info-grid">'
                + '<div class="sw-info-item"><div class="sw-info-label">Versão</div><div class="sw-info-value">' + esc(s.versao || '—') + '</div></div>'
                + '<div class="sw-info-item"><div class="sw-info-label">Fabricante</div><div class="sw-info-value">' + esc(s.fabricante || '—') + '</div></div>'
                + '<div class="sw-info-item"><div class="sw-info-label">Link Oficial</div><div class="sw-info-value">' + linkOuTexto(s.linkOficial) + '</div></div>'
                + '<div class="sw-info-item"><div class="sw-info-label">Link Alternativo</div><div class="sw-info-value">' + linkOuTexto(s.linkAlt) + '</div></div>'
                + '</div>'
                + (s.obs ? '<div class="sw-sec-title">⚠️ Observações Técnicas</div><div class="sw-obs">' + esc(s.obs) + '</div>' : '')
                + (tags ? '<div class="sw-sec-title">🔖 Tags</div><div class="sw-tags">' + tags + '</div>' : '')
                + '<div class="sw-rodape">Cadastrado em ' + esc(s.dataCadastro || '—') + ' • Última atualização: ' + esc(s.ultimaAtualizacao || '—') + '</div>'
                + '</div>';

            view.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== FORM =====
        function preencherSelects() {
            document.getElementById('f-categoria').innerHTML = CATS.map(function (c) { return '<option value="' + c.key + '">' + c.icon + ' ' + esc(c.label) + '</option>'; }).join('');
            document.getElementById('f-status').innerHTML = STATUS.map(function (s) { return '<option value="' + s.v + '">' + s.label + '</option>'; }).join('');
        }
        function abrirForm(s) {
            preencherSelects();
            document.getElementById('sw-modal-title').textContent = s ? '✏️ Editar Software' : '➕ Novo Software';
            document.getElementById('f-id').value = s ? s.id : '';
            document.getElementById('f-nome').value = s ? (s.nome || '') : '';
            document.getElementById('f-categoria').value = s ? s.categoria : (state.cat || CATS[0].key);
            document.getElementById('f-status').value = s ? s.status : 'ativo';
            document.getElementById('f-desc').value = s ? (s.desc || '') : '';
            document.getElementById('f-versao').value = s ? (s.versao || '') : '';
            document.getElementById('f-fabricante').value = s ? (s.fabricante || '') : '';
            document.getElementById('f-link-oficial').value = s ? (s.linkOficial || '') : '';
            document.getElementById('f-link-alt').value = s ? (s.linkAlt || '') : '';
            document.getElementById('f-obs').value = s ? (s.obs || '') : '';
            document.getElementById('f-tags').value = s ? (s.tags || []).join(', ') : '';
            modal.classList.add('open');
        }
        function fecharForm() { modal.classList.remove('open'); }

        function salvar() {
            var id = document.getElementById('f-id').value;
            var nome = document.getElementById('f-nome').value.trim();
            if (!nome) { toastMsg('⚠️ Informe o nome do software.'); document.getElementById('f-nome').focus(); return; }
            var tags = document.getElementById('f-tags').value.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
            var dados = {
                nome: nome,
                categoria: document.getElementById('f-categoria').value,
                status: document.getElementById('f-status').value,
                desc: document.getElementById('f-desc').value.trim(),
                versao: document.getElementById('f-versao').value.trim(),
                fabricante: document.getElementById('f-fabricante').value.trim(),
                linkOficial: document.getElementById('f-link-oficial').value.trim(),
                linkAlt: document.getElementById('f-link-alt').value.trim(),
                obs: document.getElementById('f-obs').value.trim(),
                tags: tags
            };
            var list = load();
            if (id) {
                var i = list.findIndex(function (x) { return x.id === id; });
                if (i >= 0) {
                    var orig = list[i];
                    list[i] = Object.assign({}, orig, dados, { ultimaAtualizacao: hoje() });
                }
            } else {
                dados.id = 'sw' + Date.now();
                dados.dataCadastro = hoje();
                dados.ultimaAtualizacao = hoje();
                list.push(dados);
                id = dados.id;
            }
            save(list);
            fecharForm();
            toastMsg('✅ Software salvo!');
            renderDetail(id);
        }

        function excluir(id) {
            if (!confirm('Excluir este software? Esta ação não pode ser desfeita.')) return;
            save(load().filter(function (x) { return x.id !== id; }));
            toastMsg('🗑️ Software excluído.');
            renderHome();
        }

        // ===== Navegação / API global =====
        function swHome() { state.cat = ''; if (busca) busca.value = ''; state.termo = ''; renderHome(); }
        function swFiltro(k) { state.cat = k; renderHome(); }
        function swAbrir(id) { renderDetail(id); }
        function swBuscar() { state.termo = (busca.value || '').trim(); renderHome(); }
        function swNovo() { abrirForm(null); }
        function swEditar(id) { var s = load().find(function (x) { return x.id === id; }); abrirForm(s || null); }
        window.swHome = swHome; window.swFiltro = swFiltro; window.swAbrir = swAbrir; window.swBuscar = swBuscar;
        window.swNovo = swNovo; window.swEditar = swEditar; window.swExcluir = excluir;
        window.swSalvar = salvar; window.swFecharForm = fecharForm;

        document.addEventListener('DOMContentLoaded', function () {
            view = document.getElementById('sw-view');
            busca = document.getElementById('sw-busca');
            toast = document.getElementById('sw-toast');
            modal = document.getElementById('sw-modal');
            modal.addEventListener('click', function (e) { if (e.target === modal) fecharForm(); });
            renderHome();
        });

        // Re-render ao receber sincronização de outro dispositivo
        window.addEventListener('cc-portal-synced', function () {
            try {
                if (typeof state !== 'undefined' && state && state.openId) renderDetail(state.openId);
                else renderHome();
            } catch (e) { console.warn(e); }
        });
    })();
    </script>
    <!-- Sincronização multidispositivo (Firestore por conta) -->
    <script type="module">
        import { syncPortalKeys } from '../../../shared/portal-sync.js';
        syncPortalKeys([
            { key: 'cc_pt_softwares', docId: 'softwares' }
        ]);
    </script>
<script src="../../../shared/obs-expand.js?v=20260612-1"></script>
</body>
