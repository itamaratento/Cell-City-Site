<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Central do Projeto - Portal Técnico</title>
    <link rel="stylesheet" href="../portal-tecnico.css">
    <link rel="stylesheet" href="central-projeto.css">
    <link rel="stylesheet" href="../../../shared/dock.css">
</head>
<body>
    <header class="header">
        <a class="cp-back" href="../index.html" title="Voltar ao Portal Técnico">‹ Portal Técnico</a>
        <span class="header-title">🗺️ Central do Projeto</span>
        <span class="tut-header-spacer"></span>
    </header>

    <div class="cp-screen" id="cp-app">

        <!-- ===== 📌 STATUS ATUAL ===== -->
        <div class="cp-section">
            <div class="cp-section-header">
                <span class="cp-section-title"><span class="cp-icon">📌</span> Status Atual</span>
                <button class="cp-section-btn" onclick="cpEditarStatus()">✏️ Editar</button>
            </div>
            <div class="cp-status-list" id="cp-status-list"></div>
        </div>

        <!-- ===== 💡 BANCO DE IDEIAS ===== -->
        <div class="cp-section">
            <div class="cp-section-header">
                <span class="cp-section-title"><span class="cp-icon">💡</span> Banco de Ideias</span>
            </div>
            <div class="cp-ideias-list" id="cp-ideias-list"></div>
            <div class="cp-add-row">
                <input type="text" id="cp-ideia-input" placeholder="Nova ideia..." maxlength="200">
                <button class="cp-add-btn" onclick="cpAddIdeia()">➕ Adicionar</button>
            </div>
        </div>

        <!-- ===== 🎯 PRÓXIMAS ETAPAS ===== -->
        <div class="cp-section">
            <div class="cp-section-header">
                <span class="cp-section-title"><span class="cp-icon">🎯</span> Próximas Etapas</span>
            </div>
            <div class="cp-etapas-list" id="cp-etapas-list"></div>
            <div class="cp-add-row">
                <input type="text" id="cp-etapa-input" placeholder="Nova etapa..." maxlength="200">
                <button class="cp-add-btn" onclick="cpAddEtapa()">➕ Adicionar</button>
            </div>
        </div>

        <!-- ===== 📝 DIÁRIO DO PROJETO ===== -->
        <div class="cp-section">
            <div class="cp-section-header">
                <span class="cp-section-title"><span class="cp-icon">📝</span> Diário do Projeto</span>
                <button class="cp-section-btn" onclick="cpNovoDiario()">➕ Novo Registro</button>
            </div>
            <div class="cp-diario-list" id="cp-diario-list"></div>
        </div>

        <!-- ===== 🚨 PROBLEMAS ENCONTRADOS ===== -->
        <div class="cp-section">
            <div class="cp-section-header">
                <span class="cp-section-title"><span class="cp-icon">🚨</span> Problemas Encontrados</span>
                <button class="cp-section-btn" onclick="cpNovoProblema()">➕ Novo</button>
            </div>
            <div class="cp-problemas-list" id="cp-problemas-list"></div>
        </div>

        <!-- ===== 🏆 METAS ===== -->
        <div class="cp-section">
            <div class="cp-section-header">
                <span class="cp-section-title"><span class="cp-icon">🏆</span> Metas</span>
            </div>
            <div class="cp-metas-list" id="cp-metas-list"></div>
            <div class="cp-add-row">
                <input type="text" id="cp-meta-input" placeholder="Nova meta..." maxlength="200">
                <button class="cp-add-btn" onclick="cpAddMeta()">➕ Adicionar</button>
            </div>
        </div>

    </div>

    <!-- ===== MODAL: DIÁRIO ===== -->
    <div class="cp-modal-overlay" id="cp-modal-diario">
        <div class="cp-modal">
            <div class="cp-modal-head">
                <span>📝 Novo Registro no Diário</span>
                <button class="cp-modal-close" onclick="cpFecharModal('cp-modal-diario')">✕</button>
            </div>
            <div class="cp-modal-body">
                <input type="hidden" id="cp-diario-id">
                <div class="cp-fg"><label>Data</label><input type="text" id="cp-diario-data" placeholder="DD/MM/AAAA"></div>
                <div class="cp-fg"><label>Descrição</label><textarea id="cp-diario-desc" rows="4" placeholder="O que aconteceu no projeto hoje?"></textarea></div>
            </div>
            <div class="cp-modal-foot">
                <button class="cp-btn-cancel" onclick="cpFecharModal('cp-modal-diario')">Cancelar</button>
                <button class="cp-btn-save" onclick="cpSalvarDiario()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL: PROBLEMA ===== -->
    <div class="cp-modal-overlay" id="cp-modal-problema">
        <div class="cp-modal">
            <div class="cp-modal-head">
                <span>🚨 Novo Problema</span>
                <button class="cp-modal-close" onclick="cpFecharModal('cp-modal-problema')">✕</button>
            </div>
            <div class="cp-modal-body">
                <input type="hidden" id="cp-problema-id">
                <div class="cp-fg"><label>Título</label><input type="text" id="cp-problema-titulo" placeholder="Ex: Bug na pesquisa"></div>
                <div class="cp-fg"><label>Descrição</label><textarea id="cp-problema-desc" rows="4" placeholder="Detalhes do problema, impacto, possível solução..."></textarea></div>
            </div>
            <div class="cp-modal-foot">
                <button class="cp-btn-cancel" onclick="cpFecharModal('cp-modal-problema')">Cancelar</button>
                <button class="cp-btn-save" onclick="cpSalvarProblema()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL: STATUS ===== -->
    <div class="cp-modal-overlay" id="cp-modal-status">
        <div class="cp-modal">
            <div class="cp-modal-head">
                <span>📌 Editar Status do Projeto</span>
                <button class="cp-modal-close" onclick="cpFecharModal('cp-modal-status')">✕</button>
            </div>
            <div class="cp-modal-body">
                <p style="font-size:13px;color:var(--cp-text2);margin:0 0 12px;">Marque os itens já concluídos. Itens desmarcados aparecerão como pendentes.</p>
                <div id="cp-status-editor"></div>
            </div>
            <div class="cp-modal-foot">
                <button class="cp-btn-cancel" onclick="cpFecharModal('cp-modal-status')">Cancelar</button>
                <button class="cp-btn-save" onclick="cpSalvarStatus()">💾 Salvar</button>
            </div>
        </div>
    </div>

    <div class="cp-toast" id="cp-toast"></div>

    <script src="../../../shared/brand-header.js"></script>
    <script type="module" src="../../../shared/dock.js"></script>
    <script>
    (function () {
        'use strict';

        var STORAGE_KEY = 'cc_central_projeto';

        // ── Dados padrão (primeira execução) ──────────────────────────
        var DEFAULTS = {
            status: [
                { label: 'Base de Conhecimento', done: true },
                { label: 'Tutoriais', done: true },
                { label: 'Ferramentas Utilizadas', done: true },
                { label: 'Soluções Técnicas', done: false },
                { label: 'Favoritos', done: false },
                { label: 'Estatísticas', done: false },
                { label: 'Firestore', done: false }
            ],
            ideias: [
                'Adicionar favoritos.',
                'Adicionar anexos PDF.',
                'Adicionar imagens nos procedimentos.',
                'Adicionar filtros avançados.',
                'Melhorar pesquisa.'
            ],
            etapas: [
                { text: 'Favoritos', done: false },
                { text: 'Estatísticas', done: false },
                { text: 'Soluções Técnicas', done: false },
                { text: 'Firestore', done: false },
                { text: 'Controle de usuários', done: false }
            ],
            diario: [
                { id: 'd1', data: '08/06/2026', texto: 'Criada Base de Conhecimento.' },
                { id: 'd2', data: '09/06/2026', texto: 'Campo Ferramentas Utilizadas implementado.' },
                { id: 'd3', data: '10/06/2026', texto: 'Criada a Central do Projeto 🗺️.' }
            ],
            problemas: [
                {
                    id: 'p1',
                    titulo: 'Exemplo: Ajustar busca mobile',
                    desc: 'A pesquisa na Base de Conhecimento precisa de melhorias em telas pequenas. O placeholder atual some ao focar.'
                }
            ],
            metas: [
                { text: '50 tutoriais cadastrados', done: false },
                { text: '100 tutoriais cadastrados', done: false },
                { text: 'Firestore implementado', done: false },
                { text: 'Compartilhamento entre dispositivos', done: false }
            ]
        };

        var toast;

        // ── Load / Save ────────────────────────────────────────────────
        function load() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    var data = JSON.parse(raw);
                    // Merge com defaults para garantir estrutura completa
                    if (data && typeof data === 'object') {
                        var merged = JSON.parse(JSON.stringify(DEFAULTS));
                        Object.keys(merged).forEach(function (k) {
                            if (Array.isArray(data[k])) merged[k] = data[k];
                        });
                        return merged;
                    }
                }
            } catch (e) {}
            return JSON.parse(JSON.stringify(DEFAULTS));
        }

        function save(data) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
        }

        function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }

        function toastMsg(m) {
            if (!toast) return;
            toast.textContent = m;
            toast.classList.add('show');
            clearTimeout(window.__cp);
            window.__cp = setTimeout(function () { toast.classList.remove('show'); }, 2500);
        }

        function hoje() { return new Date().toLocaleDateString('pt-BR'); }

        function gerarId() { return 'cp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

        // ── Renderizar tudo ────────────────────────────────────────────
        function renderAll() {
            var data = load();

            // Status
            renderStatus(data.status);

            // Ideias
            renderIdeias(data.ideias);

            // Etapas
            renderEtapas(data.etapas);

            // Diário
            renderDiario(data.diario);

            // Problemas
            renderProblemas(data.problemas);

            // Metas
            renderMetas(data.metas);
        }

        // ═══════════════════════════════════════════════════════════════
        //  📌 STATUS
        // ═══════════════════════════════════════════════════════════════
        function renderStatus(list) {
            var el = document.getElementById('cp-status-list');
            if (!list || !list.length) {
                el.innerHTML = '<div class="cp-empty">Nenhum item de status configurado.</div>';
                return;
            }
            el.innerHTML = list.map(function (item) {
                var icon = item.done ? '✅' : '⏳';
                var badge = item.done
                    ? '<span class="cp-status-badge ok">Concluído</span>'
                    : '<span class="cp-status-badge pending">Pendente</span>';
                return '<div class="cp-status-item">'
                    + '<span class="cp-status-icon">' + icon + '</span>'
                    + '<span class="cp-status-label">' + esc(item.label) + '</span>'
                    + badge
                    + '</div>';
            }).join('');
        }

        function cpEditarStatus() {
            var data = load();
            var el = document.getElementById('cp-status-editor');
            el.innerHTML = (data.status || []).map(function (item, i) {
                return '<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--cp-border);cursor:pointer;font-size:14px;color:var(--cp-text2);">'
                    + '<input type="checkbox" data-idx="' + i + '" ' + (item.done ? 'checked' : '') + ' style="width:18px;height:18px;accent-color:var(--cp-green);cursor:pointer;">'
                    + esc(item.label)
                    + '</label>';
            }).join('');
            document.getElementById('cp-modal-status').classList.add('open');
        }
        window.cpEditarStatus = cpEditarStatus;

        function cpSalvarStatus() {
            var data = load();
            var checks = document.querySelectorAll('#cp-status-editor input[type="checkbox"]');
            checks.forEach(function (chk) {
                var idx = parseInt(chk.dataset.idx, 10);
                if (data.status[idx]) data.status[idx].done = chk.checked;
            });
            save(data);
            cpFecharModal('cp-modal-status');
            renderStatus(data.status);
            toastMsg('✅ Status atualizado!');
        }
        window.cpSalvarStatus = cpSalvarStatus;

        // ═══════════════════════════════════════════════════════════════
        //  💡 IDEIAS
        // ═══════════════════════════════════════════════════════════════
        function renderIdeias(list) {
            var el = document.getElementById('cp-ideias-list');
            if (!list || !list.length) {
                el.innerHTML = '<div class="cp-empty">Nenhuma ideia registrada ainda.</div>';
                return;
            }
            el.innerHTML = list.map(function (ideia, i) {
                return '<div class="cp-ideia-item">'
                    + '<span class="cp-ideia-text">💡 ' + esc(ideia) + '</span>'
                    + '<button class="cp-ideia-del" onclick="cpDelIdeia(' + i + ')" title="Remover">✕</button>'
                    + '</div>';
            }).join('');
        }

        function cpAddIdeia() {
            var input = document.getElementById('cp-ideia-input');
            var val = (input.value || '').trim();
            if (!val) { toastMsg('⚠️ Digite uma ideia.'); input.focus(); return; }
            var data = load();
            data.ideias.push(val);
            save(data);
            input.value = '';
            renderIdeias(data.ideias);
            toastMsg('✅ Ideia adicionada!');
        }
        window.cpAddIdeia = cpAddIdeia;

        function cpDelIdeia(idx) {
            var data = load();
            data.ideias.splice(idx, 1);
            save(data);
            renderIdeias(data.ideias);
            toastMsg('🗑️ Ideia removida.');
        }
        window.cpDelIdeia = cpDelIdeia;

        // ═══════════════════════════════════════════════════════════════
        //  🎯 ETAPAS
        // ═══════════════════════════════════════════════════════════════
        function renderEtapas(list) {
            var el = document.getElementById('cp-etapas-list');
            if (!list || !list.length) {
                el.innerHTML = '<div class="cp-empty">Nenhuma etapa definida.</div>';
                return;
            }
            el.innerHTML = list.map(function (etapa, i) {
                var chk = etapa.done ? '✅' : '⬜';
                return '<div class="cp-etapa-item">'
                    + '<span class="cp-etapa-num">' + (i + 1) + '.</span>'
                    + '<span class="cp-etapa-text" style="' + (etapa.done ? 'text-decoration:line-through;color:var(--cp-text3);' : '') + '">' + esc(etapa.text) + '</span>'
                    + '<button class="cp-etapa-check" onclick="cpToggleEtapa(' + i + ')" title="' + (etapa.done ? 'Reabrir' : 'Concluir') + '">' + chk + '</button>'
                    + '</div>';
            }).join('');
        }

        function cpAddEtapa() {
            var input = document.getElementById('cp-etapa-input');
            var val = (input.value || '').trim();
            if (!val) { toastMsg('⚠️ Digite uma etapa.'); input.focus(); return; }
            var data = load();
            data.etapas.push({ text: val, done: false });
            save(data);
            input.value = '';
            renderEtapas(data.etapas);
            toastMsg('✅ Etapa adicionada!');
        }
        window.cpAddEtapa = cpAddEtapa;

        function cpToggleEtapa(idx) {
            var data = load();
            if (data.etapas[idx]) {
                data.etapas[idx].done = !data.etapas[idx].done;
                save(data);
                renderEtapas(data.etapas);
                toastMsg(data.etapas[idx].done ? '✅ Etapa concluída!' : '🔄 Etapa reaberta.');
            }
        }
        window.cpToggleEtapa = cpToggleEtapa;

        // ═══════════════════════════════════════════════════════════════
        //  📝 DIÁRIO
        // ═══════════════════════════════════════════════════════════════
        function renderDiario(list) {
            var el = document.getElementById('cp-diario-list');
            if (!list || !list.length) {
                el.innerHTML = '<div class="cp-empty">Nenhum registro no diário.</div>';
                return;
            }
            // Mais recente primeiro
            var sorted = list.slice().reverse();
            el.innerHTML = sorted.map(function (item) {
                return '<div class="cp-diario-item">'
                    + '<span class="cp-diario-data">' + esc(item.data) + '</span>'
                    + '<span class="cp-diario-text">' + esc(item.texto) + '</span>'
                    + '<button class="cp-diario-del" onclick="cpDelDiario(\'' + item.id + '\')" title="Remover">✕</button>'
                    + '</div>';
            }).join('');
        }

        function cpNovoDiario() {
            document.getElementById('cp-diario-id').value = '';
            document.getElementById('cp-diario-data').value = hoje();
            document.getElementById('cp-diario-desc').value = '';
            document.getElementById('cp-modal-diario').classList.add('open');
        }
        window.cpNovoDiario = cpNovoDiario;

        function cpSalvarDiario() {
            var id = document.getElementById('cp-diario-id').value;
            var data = document.getElementById('cp-diario-data').value.trim();
            var texto = document.getElementById('cp-diario-desc').value.trim();
            if (!data) { toastMsg('⚠️ Informe a data.'); return; }
            if (!texto) { toastMsg('⚠️ Informe a descrição.'); return; }
            var all = load();
            if (id) {
                // Editar existente
                for (var i = 0; i < all.diario.length; i++) {
                    if (all.diario[i].id === id) {
                        all.diario[i].data = data;
                        all.diario[i].texto = texto;
                        break;
                    }
                }
            } else {
                all.diario.push({ id: gerarId(), data: data, texto: texto });
            }
            save(all);
            cpFecharModal('cp-modal-diario');
            renderDiario(all.diario);
            toastMsg('✅ Registro salvo!');
        }
        window.cpSalvarDiario = cpSalvarDiario;

        function cpDelDiario(id) {
            var all = load();
            all.diario = all.diario.filter(function (d) { return d.id !== id; });
            save(all);
            renderDiario(all.diario);
            toastMsg('🗑️ Registro removido.');
        }
        window.cpDelDiario = cpDelDiario;

        // ═══════════════════════════════════════════════════════════════
        //  🚨 PROBLEMAS
        // ═══════════════════════════════════════════════════════════════
        function renderProblemas(list) {
            var el = document.getElementById('cp-problemas-list');
            if (!list || !list.length) {
                el.innerHTML = '<div class="cp-empty">Nenhum problema registrado.</div>';
                return;
            }
            el.innerHTML = list.map(function (p) {
                return '<div class="cp-problema-item">'
                    + '<span class="cp-problema-icon">🚨</span>'
                    + '<div class="cp-problema-content">'
                    + '<div class="cp-problema-title">' + esc(p.titulo) + '</div>'
                    + '<div class="cp-problema-desc">' + esc(p.desc) + '</div>'
                    + '</div>'
                    + '<button class="cp-problema-del" onclick="cpDelProblema(\'' + p.id + '\')" title="Remover">✕</button>'
                    + '</div>';
            }).join('');
        }

        function cpNovoProblema() {
            document.getElementById('cp-problema-id').value = '';
            document.getElementById('cp-problema-titulo').value = '';
            document.getElementById('cp-problema-desc').value = '';
            document.getElementById('cp-modal-problema').classList.add('open');
        }
        window.cpNovoProblema = cpNovoProblema;

        function cpSalvarProblema() {
            var id = document.getElementById('cp-problema-id').value;
            var titulo = document.getElementById('cp-problema-titulo').value.trim();
            var desc = document.getElementById('cp-problema-desc').value.trim();
            if (!titulo) { toastMsg('⚠️ Informe o título do problema.'); return; }
            var all = load();
            if (id) {
                for (var i = 0; i < all.problemas.length; i++) {
                    if (all.problemas[i].id === id) {
                        all.problemas[i].titulo = titulo;
                        all.problemas[i].desc = desc;
                        break;
                    }
                }
            } else {
                all.problemas.push({ id: gerarId(), titulo: titulo, desc: desc });
            }
            save(all);
            cpFecharModal('cp-modal-problema');
            renderProblemas(all.problemas);
            toastMsg('✅ Problema salvo!');
        }
        window.cpSalvarProblema = cpSalvarProblema;

        function cpDelProblema(id) {
            var all = load();
            all.problemas = all.problemas.filter(function (p) { return p.id !== id; });
            save(all);
            renderProblemas(all.problemas);
            toastMsg('🗑️ Problema removido.');
        }
        window.cpDelProblema = cpDelProblema;

        // ═══════════════════════════════════════════════════════════════
        //  🏆 METAS
        // ═══════════════════════════════════════════════════════════════
        function renderMetas(list) {
            var el = document.getElementById('cp-metas-list');
            if (!list || !list.length) {
                el.innerHTML = '<div class="cp-empty">Nenhuma meta definida.</div>';
                return;
            }
            el.innerHTML = list.map(function (meta, i) {
                var chk = meta.done ? '🏆' : '⬜';
                return '<div class="cp-meta-item">'
                    + '<button class="cp-meta-check" onclick="cpToggleMeta(' + i + ')" title="' + (meta.done ? 'Desmarcar' : 'Concluir') + '">' + chk + '</button>'
                    + '<span class="cp-meta-text' + (meta.done ? ' done' : '') + '">' + esc(meta.text) + '</span>'
                    + '<button class="cp-meta-del" onclick="cpDelMeta(' + i + ')" title="Remover">✕</button>'
                    + '</div>';
            }).join('');
        }

        function cpAddMeta() {
            var input = document.getElementById('cp-meta-input');
            var val = (input.value || '').trim();
            if (!val) { toastMsg('⚠️ Digite uma meta.'); input.focus(); return; }
            var data = load();
            data.metas.push({ text: val, done: false });
            save(data);
            input.value = '';
            renderMetas(data.metas);
            toastMsg('✅ Meta adicionada!');
        }
        window.cpAddMeta = cpAddMeta;

        function cpToggleMeta(idx) {
            var data = load();
            if (data.metas[idx]) {
                data.metas[idx].done = !data.metas[idx].done;
                save(data);
                renderMetas(data.metas);
                toastMsg(data.metas[idx].done ? '🏆 Meta concluída!' : '🔄 Meta reaberta.');
            }
        }
        window.cpToggleMeta = cpToggleMeta;

        function cpDelMeta(idx) {
            var data = load();
            data.metas.splice(idx, 1);
            save(data);
            renderMetas(data.metas);
            toastMsg('🗑️ Meta removida.');
        }
        window.cpDelMeta = cpDelMeta;

        // ═══════════════════════════════════════════════════════════════
        //  MODAL UTILITÁRIO
        // ═══════════════════════════════════════════════════════════════
        function cpFecharModal(id) {
            var el = document.getElementById(id);
            if (el) el.classList.remove('open');
        }
        window.cpFecharModal = cpFecharModal;

        // ═══════════════════════════════════════════════════════════════
        //  ENTER nos inputs
        // ═══════════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', function () {
            toast = document.getElementById('cp-toast');

            document.getElementById('cp-ideia-input').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); cpAddIdeia(); }
            });
            document.getElementById('cp-etapa-input').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); cpAddEtapa(); }
            });
            document.getElementById('cp-meta-input').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); cpAddMeta(); }
            });

            // Fechar modais ao clicar fora
            document.querySelectorAll('.cp-modal-overlay').forEach(function (m) {
                m.addEventListener('click', function (e) {
                    if (e.target === m) m.classList.remove('open');
                });
            });

            renderAll();
        });

    })();
    </script>
</body>
</html>
