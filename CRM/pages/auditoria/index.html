<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoria — Cell City</title>
<script>var _h=location.hostname;var _p=location.pathname;var _dev=(_p==='/dev'||_p.indexOf('/dev/')===0);if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace((_dev?'/dev':'')+'/CRM/login.html');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="../../shared/design-system.css">
    <script src="../../shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auditoria.css">
</head>
<body>

<div class="au-header">
  <button class="au-btn-voltar" onclick="history.back()">← Voltar</button>
  <h1>🔍 Auditoria</h1>
  <span class="au-badge">Tempo real</span>
</div>

<div class="au-wrap">

  <!-- Dashboard -->
  <div class="au-cards" id="au-cards"></div>

  <!-- Filtros -->
  <div class="au-toolbar">
    <input type="search" class="au-input au-busca" id="au-busca" placeholder="🔍 Buscar por admin, alvo ou detalhes...">
    <select class="au-input au-select" id="au-filtro-acao"></select>
    <select class="au-input au-select" id="au-filtro-usuario" style="display:none"></select>
    <input type="date" class="au-input au-select" id="au-data-inicio" title="Data início">
    <input type="date" class="au-input au-select" id="au-data-fim" title="Data fim">
  </div>

  <!-- Tabela -->
  <div class="au-table-wrap">
    <table class="au-table" id="au-table">
      <thead>
        <tr>
          <th>Ação</th>
          <th>Administrador</th>
          <th>Alvo</th>
          <th>Data/Hora</th>
          <th>Detalhes</th>
        </tr>
      </thead>
      <tbody id="au-tbody"></tbody>
    </table>
    <div class="au-empty" id="au-empty">Nenhum registro de auditoria encontrado.</div>
    <div class="au-loading" id="au-loading"><div class="au-spinner"></div><span>Carregando...</span></div>
  </div>

  <!-- Paginação -->
  <div class="au-toolbar" style="margin-top:12px;justify-content:space-between">
    <span id="au-info" style="font-size:12px;color:var(--text-tertiary)"></span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="au-btn" id="au-ant">← Anterior</button>
      <span id="au-pag-info" style="font-size:12px;color:var(--text-tertiary)"></span>
      <button class="au-btn" id="au-prox">Próxima →</button>
    </div>
  </div>

</div>

<script type="module" src="auditoria.js"></script>
</body>
</html>
