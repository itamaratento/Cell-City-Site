<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>var _h=location.hostname;var _p=location.pathname;var _dev=(_p==='/dev'||_p.indexOf('/dev/')===0);if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace((_dev?'/dev':'')+'/CRM/login.html');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Módulos - Cell City Gestão Empresarial</title>
    <link rel="stylesheet" href="../../shared/design-system.css">
    <script src="../../shared/theme.js"></script>
<link rel="stylesheet" href="../../shared/dock.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #050505;
    color: #fff;
    min-height: 100dvh;
  }
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 12, 11, .92);
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    backdrop-filter: blur(16px);
  }
  .header-title { font-size: 16px; font-weight: 800; }

  .cm-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  .cm-metricas {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
  }
  .cm-metrica {
    background: #111213; border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
    padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 86px;
  }
  .cm-metrica-n { font-size: 15px; font-weight: 800; }
  .cm-metrica-r { font-size: 11px; color: #6b7280; }

  .cm-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111;
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .cm-search input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  .cm-search input::placeholder { color: #6b7280; }

  .cm-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .cm-filtros select {
    background: #111; color: #fff; border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 7px 10px; font-size: 12.5px; font-family: inherit; outline: none;
  }
  .cm-chip {
    background: #111; color: #9ca3af; border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: border-color .15s, color .15s;
  }
  .cm-chip:hover { border-color: rgba(0,200,83,.4); }
  .cm-chip.on { color: #00c853; border-color: rgba(0,200,83,.55); background: rgba(0,200,83,.08); }

  .cm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .cm-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    padding: 16px 12px;
    min-height: 132px;
    background: #111213;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: border-color 200ms ease, background 200ms ease, transform 200ms ease;
  }
  .cm-card:hover {
    border-color: rgba(0, 200, 83, .35);
    background: #16181a;
    transform: translateY(-2px);
  }
  .cm-icon { font-size: 26px; line-height: 1; }
  .cm-name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }
  .cm-sub { font-size: 11px; color: #6b7280; display: flex; gap: 6px; align-items: center; }
  .cm-grupo { border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 1px 8px; }

  .cm-vazio {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    padding: 40px 0;
    display: none;
  }

  .cm-legend { text-align: center; color: #6b7280; font-size: 11.5px; margin: -4px 0 14px; }
  .cm-rodape { text-align: center; color: #4b5563; font-size: 11px; margin-top: 26px; }

  .cm-star, .cm-info {
    position: absolute; top: 8px;
    background: rgba(10,12,16,.7); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 6px;
    font-size: 14px; line-height: 1; padding: 4px 6px; cursor: pointer;
    color: #6b7280; transition: background .15s, color .15s, transform .12s;
  }
  .cm-star { right: 8px; }
  .cm-star:hover { background: rgba(255,200,0,.18); color: #f5a623; transform: scale(1.15); }
  .cm-star.on { color: #f5a623; }
  .cm-info { left: 8px; font-size: 12.5px; }
  .cm-info:hover { background: rgba(0,200,83,.15); color: #00c853; transform: scale(1.12); }

  dialog#cm-det {
    background: #101214; color: #e5e7eb; border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 0; max-width: 640px; width: calc(100vw - 32px);
    max-height: 84dvh;
  }
  dialog#cm-det::backdrop { background: rgba(0,0,0,.65); backdrop-filter: blur(3px); }
  .cm-det-scroll { overflow-y: auto; max-height: calc(84dvh - 52px); padding: 18px; }
  .cm-det-barra {
    display: flex; justify-content: flex-end; padding: 10px 14px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .cm-det-barra button {
    background: #1a1d20; color: #fff; border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px; padding: 8px 18px; cursor: pointer; font-family: inherit;
  }
  .cm-det-titulo { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .cm-det-status { font-size: 12px; font-weight: 600; color: #9ca3af; margin-left: 6px; }
  .cm-det-desc { font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
  .cm-det-linha {
    display: flex; justify-content: space-between; gap: 14px; font-size: 12.5px;
    padding: 5px 0; border-bottom: 1px dashed rgba(255,255,255,.06);
  }
  .cm-det-linha span { color: #6b7280; white-space: nowrap; }
  .cm-det-linha b { font-weight: 600; text-align: right; word-break: break-word; }
  #cm-det h4 { font-size: 13px; margin: 14px 0 6px; color: #d1d5db; }
  .cm-check { list-style: none; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
  .cm-det-rodape { font-size: 11px; color: #4b5563; margin-top: 14px; }
</style>
</head>
<body>
  <header class="header"><span class="header-title">🧩 Central de Módulos</span></header>

  <div class="cm-wrap">
    <div class="cm-metricas" id="cm-metricas"></div>

    <div class="cm-search">
      <span>🔍</span>
      <input type="text" id="cm-busca" placeholder="Buscar por nome, descrição, grupo, arquivo, coleção, permissão ou dependência..." autocomplete="off">
    </div>

    <div class="cm-filtros">
      <select id="cm-f-grupo"><option value="">Todos os grupos</option></select>
      <select id="cm-f-status">
        <option value="">Todos os status</option>
        <option value="ok">🟢 OK</option>
        <option value="atencao">🟡 Atenção</option>
        <option value="erro">🔴 Erro</option>
      </select>
      <button type="button" class="cm-chip" id="cm-f-fav">⭐ Favoritos</button>
      <button type="button" class="cm-chip" id="cm-f-semrbac">🔓 Sem RBAC</button>
      <button type="button" class="cm-chip" id="cm-f-recentes">🕘 Atualizados 7d</button>
      <button type="button" class="cm-chip" id="cm-f-semdeps">🧱 Sem dependências</button>
      <button type="button" class="cm-chip" id="cm-logs-btn">📜 Logs</button>
    </div>

    <div class="cm-legend">⭐ = aparece no menu principal do Dashboard · ⓘ = detalhes e health check do módulo</div>

    <div class="cm-grid" id="cm-grid"></div>
    <div class="cm-vazio" id="cm-vazio">Nenhum módulo encontrado.</div>

    <div class="cm-rodape" id="cm-rodape-info"></div>
  </div>

  <dialog id="cm-det">
    <div class="cm-det-scroll" id="cm-det-corpo"></div>
    <div class="cm-det-barra"><button type="button" id="cm-det-fechar">Fechar</button></div>
  </dialog>

  <script type="module" src="./central-modulos-page.js"></script>
  <script src="../../shared/brand-header.js"></script>
  <script type="module" src="../../shared/dock.js"></script>
</body>
</html>
