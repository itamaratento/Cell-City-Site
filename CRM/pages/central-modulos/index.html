<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace('/CRM/login.html');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Módulos - Cell City CRM</title>
<link rel="stylesheet" href="../../shared/dock.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #050505;
    color: #fff;
    min-height: 100dvh;
  }
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 12, 11, .92);
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    backdrop-filter: blur(16px);
  }
  .header-title { font-size: 16px; font-weight: 800; }

  .cm-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  .cm-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111;
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }
  .cm-search input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  .cm-search input::placeholder { color: #6b7280; }

  .cm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }

  .cm-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 16px 12px;
    min-height: 120px;
    background: #111213;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: border-color 200ms ease, background 200ms ease, transform 200ms ease;
  }
  .cm-card:hover {
    border-color: rgba(0, 200, 83, .35);
    background: #16181a;
    transform: translateY(-2px);
  }
  .cm-icon { font-size: 26px; line-height: 1; }
  .cm-name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }

  .cm-vazio {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    padding: 40px 0;
    display: none;
  }
</style>
</head>
<body>
  <header class="header"><span class="header-title">🧩 Central de Módulos</span></header>

  <div class="cm-wrap">
    <div class="cm-search">
      <span>🔍</span>
      <input type="text" id="cm-busca" placeholder="Buscar módulo..." autocomplete="off" oninput="filtrarModulos()">
    </div>

    <div class="cm-grid" id="cm-grid"></div>
    <div class="cm-vazio" id="cm-vazio">Nenhum módulo encontrado.</div>
  </div>

  <script>
    var MODULOS = [
      { icon: '📦', nome: 'Ordem de Serviço', url: '../os/index.html' },
      { icon: '💰', nome: 'Caixa', url: '../caixa/index.html' },
      { icon: '🔔', nome: 'Central de Alertas', url: '../central-alertas/index.html' },
      { icon: '⚡', nome: 'Central de Comandos', url: '../central-comandos/index.html' },
      { icon: '🎯', nome: 'CRM Comercial', url: '../crm-comercial/index.html' },
      { icon: '👥', nome: 'Clientes', url: '../clientes/index.html' },
      { icon: '📱', nome: 'Estoque', url: '../estoque/index.html' },
      { icon: '💹', nome: 'Financeiro', url: '../financeiro/index.html' },
      { icon: '🛒', nome: 'Compras', url: '../compras/index.html' },
      { icon: '🏭', nome: 'Fornecedor', url: '../fornecedor/index.html' },
      { icon: '💝', nome: 'Pós-venda', url: '../pos-venda/index.html' },
      { icon: '🖨️', nome: 'Impressora', url: '../config/index.html' },
      { icon: '📇', nome: 'Contas & Números', url: '../contas/index.html' },
      { icon: '📅', nome: 'Agenda', url: '../acaodasemana/index.html' },
      { icon: '🔷', nome: 'Portal do Cliente', url: '../portal-cliente/admin.html' },
      { icon: '🔓', nome: 'Portal Técnico', url: '../portal-tecnico/index.html' },
      { icon: '⚡', nome: 'Central de Automação', url: '../central-organizacao/index.html' },
      { icon: '📚', nome: 'Central de Informações', url: '../central-informacoes/index.html' },
      { icon: '🛍️', nome: 'Catálogo', url: '../catalogo/index.html' },
      { icon: '📊', nome: 'Relatórios', url: '../relatorios/index.html' },
      { icon: '📔', nome: 'Diário', url: '../diario/index.html' },
      { icon: '🔍', nome: 'Auditoria', url: '../auditoria/index.html' },
      { icon: '🤖', nome: 'Autoatendimento', url: '../autoatendimento/index.html' },
      { icon: '⚙️', nome: 'Configurações', url: '../config/index.html' }
    ];

    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderModulos(lista) {
      var grid = document.getElementById('cm-grid');
      var vazio = document.getElementById('cm-vazio');
      grid.innerHTML = lista.map(function (m) {
        return '<a class="cm-card" href="' + m.url + '">' +
          '<div class="cm-icon">' + m.icon + '</div>' +
          '<div class="cm-name">' + escHtml(m.nome) + '</div>' +
          '</a>';
      }).join('');
      vazio.style.display = lista.length ? 'none' : 'block';
    }

    function filtrarModulos() {
      var termo = document.getElementById('cm-busca').value.trim().toLowerCase();
      if (!termo) { renderModulos(MODULOS); return; }
      renderModulos(MODULOS.filter(function (m) {
        return m.nome.toLowerCase().indexOf(termo) !== -1;
      }));
    }

    renderModulos(MODULOS);
  </script>

  <script src="../../shared/brand-header.js"></script>
  <script type="module" src="../../shared/dock.js"></script>
</body>
</html>
