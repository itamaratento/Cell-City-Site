<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>var _h=location.hostname;var _p=location.pathname;var _dev=(_p==='/dev'||_p.indexOf('/dev/')===0);if(_h!=='127.0.0.1'&&_h!=='localhost'&&localStorage.getItem('cc_kernel_v1')!=='1')window.location.replace((_dev?'/dev':'')+'/CRM/login.html');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Módulos - Cell City Gestão Empresarial</title>
<link rel="stylesheet" href="../../shared/dock.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #050505;
    color: #fff;
    min-height: 100dvh;
  }
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 12, 11, .92);
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    backdrop-filter: blur(16px);
  }
  .header-title { font-size: 16px; font-weight: 800; }

  .cm-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }

  .cm-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111;
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 20px;
  }
  .cm-search input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  .cm-search input::placeholder { color: #6b7280; }

  .cm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }

  .cm-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 16px 12px;
    min-height: 120px;
    background: #111213;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: border-color 200ms ease, background 200ms ease, transform 200ms ease;
  }
  .cm-card:hover {
    border-color: rgba(0, 200, 83, .35);
    background: #16181a;
    transform: translateY(-2px);
  }
  .cm-icon { font-size: 26px; line-height: 1; }
  .cm-name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }

  .cm-vazio {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    padding: 40px 0;
    display: none;
  }

  .cm-legend { text-align: center; color: #6b7280; font-size: 11.5px; margin: -10px 0 18px; }

  .cm-star {
    position: absolute; top: 8px; right: 8px;
    background: rgba(10,12,16,.7); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,.08); border-radius: 6px;
    font-size: 14px; line-height: 1; padding: 4px 6px; cursor: pointer;
    color: #6b7280; transition: background .15s, color .15s, transform .12s;
  }
  .cm-star:hover { background: rgba(255,200,0,.18); color: #f5a623; transform: scale(1.15); }
  .cm-star.on { color: #f5a623; }
</style>
</head>
<body>
  <header class="header"><span class="header-title">🧩 Central de Módulos</span></header>

  <div class="cm-wrap">
    <div class="cm-search">
      <span>🔍</span>
      <input type="text" id="cm-busca" placeholder="Buscar módulo..." autocomplete="off" oninput="filtrarModulos()">
    </div>
    <div class="cm-legend">⭐ = aparece automaticamente no menu principal do Dashboard</div>

    <div class="cm-grid" id="cm-grid"></div>
    <div class="cm-vazio" id="cm-vazio">Nenhum módulo encontrado.</div>
  </div>

  <script type="module">
    import { init, TODOS_MODULOS, isFavorito, toggleFavorito } from '../../shared/central-modulos.js';

    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderModulos(lista) {
      var grid = document.getElementById('cm-grid');
      var vazio = document.getElementById('cm-vazio');
      grid.innerHTML = lista.map(function (m) {
        var on = isFavorito(m.id);
        return '<a class="cm-card" href="' + m.url + '" style="position:relative;">' +
          '<button type="button" class="cm-star' + (on ? ' on' : '') + '" data-id="' + m.id + '" ' +
          'title="' + (on ? 'Remover do menu principal' : 'Adicionar ao menu principal') + '">' + (on ? '⭐' : '☆') + '</button>' +
          '<div class="cm-icon">' + m.icone + '</div>' +
          '<div class="cm-name">' + escHtml(m.nome) + '</div>' +
          '</a>';
      }).join('');
      vazio.style.display = lista.length ? 'none' : 'block';

      grid.querySelectorAll('.cm-star').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          toggleFavorito(btn.dataset.id).then(function () { filtrarModulos(); });
        });
      });
    }

    function filtrarModulos() {
      var termo = document.getElementById('cm-busca').value.trim().toLowerCase();
      if (!termo) { renderModulos(TODOS_MODULOS); return; }
      renderModulos(TODOS_MODULOS.filter(function (m) {
        return m.nome.toLowerCase().indexOf(termo) !== -1;
      }));
    }

    window.filtrarModulos = filtrarModulos;
    window.addEventListener('cc-modulos-changed', filtrarModulos);

    init();
    renderModulos(TODOS_MODULOS);
  </script>

  <script src="../../shared/brand-header.js"></script>
  <script type="module" src="../../shared/dock.js"></script>
</body>
</html>
