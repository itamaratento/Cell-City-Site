<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>var _h=location.hostname;if(_h!=='127.0.0.1'&&_h!=='localhost'&&sessionStorage.getItem('cc_acesso')!=='ok')window.location.replace('/CRM/pages/config/index.html');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell City Gestão Empresarial — Mensagens WhatsApp</title>
<link rel="stylesheet" href="../../shared/dock.css">
<style>
:root {
    --bg: #050505;
    --bg-gradient: radial-gradient(ellipse at top, #0a0f0c 0%, #050505 60%, #000000 100%);
    --surface2: rgba(25, 28, 27, 0.8);
    --surface3: #1c1f1d;
    --border: rgba(255, 255, 255, 0.08);
    --text: #ffffff;
    --text2: #d1d5db;
    --text3: #6b7280;
    --green-primary: #00C853;
    --green-light: #00E676;
    --red: #EF4444;
    --radius-sm: 10px;
    --radius: 14px;
    --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font-main);
    background: var(--bg);
    background-image: var(--bg-gradient);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}
.header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 12, 11, 0.92);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    backdrop-filter: blur(16px);
}
.header-title { font-size: 16px; font-weight: 700; color: var(--text); }
.header-back {
    background: none; border: none; color: var(--text3);
    font-size: 20px; cursor: pointer; padding: 2px 6px;
    border-radius: 8px; line-height: 1;
}
.header-back:hover { background: var(--surface3); color: var(--text); }

#tabs {
    display: flex; gap: 8px;
    padding: 14px 16px 0;
}
.tab-btn {
    background: var(--surface3); border: 1px solid var(--border);
    color: var(--text3); padding: 8px 18px;
    border-radius: 10px 10px 0 0; cursor: pointer;
    font-size: 13px; font-weight: 600;
    transition: all 0.2s;
}
.tab-btn.active {
    background: rgba(0,200,83,0.12);
    border-color: rgba(0,200,83,0.35);
    color: var(--green-light);
}

#content {
    padding: 16px 16px 120px;
    max-width: 680px;
    margin: 0 auto;
}

.vars-bar {
    background: rgba(0,200,83,0.06);
    border: 1px solid rgba(0,200,83,0.2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.vars-title { font-size: 11px; font-weight: 700; color: var(--text3); width: 100%; margin-bottom: 2px; }
.var-chip {
    background: var(--surface3); border: 1px solid var(--border);
    color: var(--green-light); font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 100px; font-family: monospace;
    cursor: pointer; user-select: all;
}

.section-title {
    font-size: 12px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--text3);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
}

.tpl-item { margin-bottom: 14px; }
.tpl-label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--text2); margin-bottom: 5px;
}
.tpl-textarea {
    width: 100%; padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: var(--font-main);
    font-size: 13px; line-height: 1.55;
    resize: vertical; min-height: 90px;
    transition: border-color 0.2s;
}
.tpl-textarea:focus {
    outline: none;
    border-color: rgba(0,200,83,0.4);
}

.action-bar {
    display: flex; gap: 10px;
    margin-top: 24px; padding-top: 16px;
    border-top: 1px solid var(--border);
}
.btn-salvar {
    flex: 2; padding: 12px;
    background: var(--green-primary); border: none;
    border-radius: var(--radius-sm); cursor: pointer;
    font-size: 14px; font-weight: 700; color: #000;
}
.btn-restaurar {
    flex: 1; padding: 12px;
    background: var(--surface3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--text2);
}

/* Histórico */
.hist-count {
    font-size: 12px; color: var(--text3);
    margin-bottom: 12px;
}
.table-wrap { overflow-x: auto; }
.hist-table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
}
.hist-table th {
    text-align: left; padding: 8px 10px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--text3);
    border-bottom: 1px solid var(--border);
}
.hist-table td {
    padding: 10px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    vertical-align: middle;
}
.hist-badge {
    background: rgba(0,200,83,0.1);
    border: 1px solid rgba(0,200,83,0.25);
    color: var(--green-light);
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 100px;
    white-space: nowrap;
}
</style>
</head>
<body>

<header class="header">
    <button class="header-back" onclick="history.back()">←</button>
    <span class="header-title">💬 Mensagens WhatsApp</span>
</header>

<div id="tabs"></div>
<div id="content"></div>

<script type="module" src="../../shared/dock.js"></script>
<script type="module" src="mensagens-wpp.js"></script>
</body>
</html>
