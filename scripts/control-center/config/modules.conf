# Cell City Control Center — Manifesto Oficial dos Módulos (Fase 1.1).
#
# Fonte única do menu principal: core/menu.sh lê este arquivo pra montar as
# opções e o dispatch — nunca tem os módulos hardcoded no script. Adicionar
# um módulo novo é sempre isto, nada mais:
#   1. criar modules/<slug>/menu.sh (ver README.md, "Como adicionar um novo módulo");
#   2. adicionar uma linha aqui.
# Nunca precisa editar core/menu.sh pra isso.
#
# Formato: ordem|slug|rotulo
#   ordem  = opção numérica mostrada no menu principal (também a ordem de exibição).
#   slug   = nome da pasta em modules/ (mesmo valor usado em modules/<slug>/menu.sh).
#   rotulo = texto exibido ao lado do número no menu.
#
# Linhas em branco e iniciadas com "#" são ignoradas.
1|desenvolvimento|Desenvolvimento
2|release|Release
3|backup-recuperacao|Backup e Recuperação
4|banco-dados|Banco de Dados
5|branches-sincronizacao|Branches e Sincronização
6|diagnostico|Diagnóstico
7|ferramentas|Ferramentas
8|central-ias|Central das IAs
9|configuracoes|Configurações
10|manutencao|Manutenção e Higienização
11|noc-v3|NOC V3 (Operations Center)
