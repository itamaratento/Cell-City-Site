# Cell City V3 — NOC Configuration
# Configuração principal do Network Operations Center.
# Lido pelo noc.sh durante o boot (fonte após todos os módulos).
# NÃO editar manualmente — usar o módulo de Configurações do Control Center.

V3_NOC_ENABLED="true"
V3_NOC_AUTO_REFRESH="30"
# Painéis válidos: main | alerts | missions (qualquer outro valor cai em "main").
V3_NOC_DEFAULT_PANEL="main"
V3_NOC_LOG_LEVEL="info"
V3_NOC_CACHE_TTL="60"
V3_NOC_MAX_EVENTS="1000"
