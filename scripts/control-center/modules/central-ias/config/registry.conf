# Cell City Control Center — Central de IAs, Registro de IAs (Fase 10 —
# CCC-F10-001).
#
# Cadastro das Inteligências Artificiais envolvidas no desenvolvimento do
# Cell City CRM (ver ../../../../../ENGINEERING.md — autoridade de
# governança multi-IA do projeto). "Módulos atribuídos" e "fases" NÃO se
# repetem aqui de propósito — são derivados de fases.conf (mesma IA, uma
# única fonte, nunca duas divergindo). Expansível: uma linha nova cadastra
# uma IA nova, sem tocar em lib/agents.sh.
#
# Formato: slug|nome|versao|funcao|especialidades
#   slug            = identificador usado em fases.conf (coluna "ia").
#   nome            = nome exibido.
#   versao          = versão/modelo declarado ("-" se não aplicável).
#   funcao          = papel no projeto (ver ENGINEERING.md).
#   especialidades  = lista separada por vírgula.
#
# Linhas em branco e iniciadas com "#" são ignoradas.
