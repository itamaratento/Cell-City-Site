# Cell City Control Center — Central de IAs, Registro de Fases (Fase 10 —
# CCC-F10-001).
#
# Fonte única de verdade sobre as fases do Roadmap do Control Center (ver
# ../../../README.md, "Roadmap", e o Roadmap Oficial CCC-ROADMAP-001) —
# nenhuma tela deste módulo hardcoda fase/status/responsável, tudo lido
# daqui. Atualizar esta linha sempre que uma fase mudar de status (nunca
# direto em lib/*.sh — mesmo princípio de ../../../config/modules.conf).
#
# Formato: numero|nome|ia|status|modulos
#   numero  = número da fase no Roadmap.
#   nome    = nome exibido da fase.
#   ia      = slug da IA responsável pela implementação (ver registry.conf)
#             — claude|deepseek.
#   status  = CONCLUIDA | AGUARDANDO_REVISAO | EM_IMPLEMENTACAO | NAO_INICIADA.
#   modulos = slugs de modules/ entregues nesta fase, separados por vírgula;
#             "*" = fase transversal (toda a plataforma); "-" = nenhum
#             módulo próprio (infraestrutura/core).
#
# Linhas em branco e iniciadas com "#" são ignoradas.
1|Estrutura Base, UX e Arquitetura|claude|CONCLUIDA|-
2|Desenvolvimento e Release|claude|CONCLUIDA|desenvolvimento,release
3|Backup e Recuperação|claude|CONCLUIDA|backup-recuperacao
4|Banco de Dados|claude|CONCLUIDA|banco-dados
5|Branches e Sincronização|claude|CONCLUIDA|branches-sincronizacao
6|Diagnóstico e Health Check|deepseek|AGUARDANDO_REVISAO|diagnostico
7|Ferramentas, Auditorias e Relatórios|deepseek|AGUARDANDO_REVISAO|ferramentas
8|Polimento Final, Testes e Certificação|claude|NAO_INICIADA|*
9|Manutenção e Higienização|deepseek|AGUARDANDO_REVISAO|manutencao
10|Central de IAs|claude|EM_IMPLEMENTACAO|central-ias
11|Configurações|claude|NAO_INICIADA|configuracoes
