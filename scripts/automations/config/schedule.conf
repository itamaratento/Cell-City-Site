# Cell City V3 — Cron-like Scheduler Configuration
# Cada linha: minuto hora dia-mes mes dia-semana tarefa
# Use * para "qualquer". Intervalos: */N para "a cada N".
#
# Exemplo:
#   0 6 * * * auto-health   → health check todo dia às 06:00
#   */10 * * * * auto-audit  → auditoria a cada 10 minutos
#
# Tarefas disponíveis:
#   auto-health   → Health check automático (usa health-engine --quick)
#   auto-audit    → Auditoria automática (usa diagnostic-engine --auto)
#   auto-backup   → Backup automático (executa backup-manual.sh)
#   auto-cleanup  → Limpeza de logs/states antigos (>30d logs, >90d states)
#   auto-report   → Relatório consolidado de todos os componentes V3
#   all           → Executa todas as tarefas acima

# Health check completo todo dia às 06:00
0 6 * * * auto-health

# Auditoria automática a cada 30 minutos
*/30 * * * * auto-audit

# Backup diário às 02:00
0 2 * * * auto-backup

# Limpeza semanal — domingo às 04:00
0 4 * * 0 auto-cleanup

# Relatório consolidado — todo dia às 07:00
0 7 * * * auto-report

# Rodada completa (todas tarefas) — sábado às 04:30
30 4 * * 6 all
